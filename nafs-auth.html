<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب نافس</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;color:#172033}.box{max-width:460px;margin:55px auto;padding:28px;background:#fff;border:1px solid #e3e7ef;border-radius:24px}h1{text-align:center;margin:0 0 8px}.sub{text-align:center;color:#697386;margin-bottom:22px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1;padding:11px;border:0;border-radius:11px;font-weight:900;cursor:pointer}.on{background:#5538c8;color:#fff}.off{background:#eef0f5;color:#555}label{display:block;font-weight:800;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #d8deea;border-radius:11px;font-size:16px}.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#5538c8;color:#fff;font-size:17px;font-weight:900}.msg{text-align:center;margin-top:13px;line-height:1.7}.back{display:block;text-align:center;margin-top:17px;color:#5538c8;text-decoration:none;font-weight:800}</style></head><body><main class="box"><h1>حساب نافس</h1><div class="sub">حساب مستقل عن محاكي القدرات</div><div class="tabs"><button id="loginTab" class="on">تسجيل الدخول</button><button id="signupTab" class="off">إنشاء حساب</button></div><form id="form"><div id="nameWrap" style="display:none"><label>الاسم</label><input id="name" autocomplete="name"></div><label>البريد الإلكتروني</label><input id="email" type="email" required autocomplete="email"><label>كلمة المرور</label><input id="password" type="password" required minlength="6" autocomplete="current-password"><button class="go" id="go">تسجيل الدخول</button><div id="msg" class="msg"></div></form><a class="back" href="nafs.html">العودة إلى نافس</a></main><script>const URL='https://cixwjisioawswnnwwswf.supabase.co',KEY='sb_publishable_g9JTqjUOCtU4qBzGBftFcg_7ZMtGVm-',db=supabase.createClient(URL,KEY,{auth:{storageKey:'nafs-auth',persistSession:true,autoRefreshToken:true}});let mode='login';const lt=document.getElementById('loginTab'),st=document.getElementById('signupTab'),nw=document.getElementById('nameWrap'),go=document.getElementById('go'),msg=document.getElementById('msg');function setMode(m){mode=m;lt.className=m==='login'?'on':'off';st.className=m==='signup'?'on':'off';nw.style.display=m==='signup'?'block':'none';go.textContent=m==='login'?'تسجيل الدخول':'إنشاء الحساب'}lt.onclick=()=>setMode('login');st.onclick=()=>setMode('signup');document.getElementById('form').onsubmit=async e=>{e.preventDefault();msg.textContent='';go.disabled=true;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(mode==='login'){const {error}=await db.auth.signInWithPassword({email,password});if(error)msg.textContent='تعذر تسجيل الدخول. تحقق من البريد وكلمة المرور.';else location.href='nafs.html'}else{const full_name=document.getElementById('name').value.trim();const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name},emailRedirectTo:'https://qudrati.com.sa/nafs.html'}});if(error)msg.textContent='تعذر إنشاء الحساب: '+error.message;else if(data.session)location.href='nafs.html';else msg.textContent='تم إنشاء الحساب. افتح رسالة التحقق في بريدك ثم سجّل الدخول.'}go.disabled=false};</script></body></html>

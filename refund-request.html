<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب استرداد | محاكي القدرات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;background:#f5f8fc;color:#18345b;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #dbe6f1;border-radius:20px;padding:25px}h1,h2{color:#102a56}.info{padding:14px;border-radius:12px;background:#f2f7fd;border:1px solid #d5e5f7;margin:15px 0}.warn{background:#fff8e7;border-color:#f0d79a;color:#704d00}.ok{background:#effbf5;border-color:#bfe8d1;color:#12653d}.bad{background:#fff1f1;border-color:#efc5c5;color:#8f2222}.statusCard{padding:16px;border:1px solid #dbe6f1;border-radius:14px;margin-top:14px}.status{font-weight:900;font-size:19px}.meta{color:#66758f;font-size:14px}textarea{width:100%;min-height:120px;padding:12px;border:1px solid #cad8e7;border-radius:12px;font:inherit;box-sizing:border-box}button{width:100%;padding:13px;border:0;border-radius:12px;background:#164f94;color:white;font-weight:900;font-size:16px;margin-top:12px}.back{display:inline-block;margin-bottom:14px;color:#1769c2;text-decoration:none;font-weight:800}.small{font-size:13px;color:#66758f}.hidden{display:none}</style></head><body><main class="wrap"><a class="back" href="dashboard.html">← العودة للوحة الطالب</a><div class="card"><h1>طلب استرداد المدفوعات</h1><div id="history"></div><div id="state" class="info">جاري التحقق من بيانات اشتراكك...</div><div id="form" class="hidden"><label for="reason"><b>سبب طلب الاسترداد</b></label><textarea id="reason" placeholder="اكتب سبب طلب الاسترداد"></textarea><p class="small">سيتم حفظ تاريخ ووقت تقديم الطلب وبيانات الأهلية وقت التقديم للمراجعة.</p><button id="send">إرسال طلب الاسترداد</button></div><div id="result"></div></div></main><script>(async()=>{const db=window.getQudratSupabase(),state=document.getElementById('state'),form=document.getElementById('form'),result=document.getElementById('result'),history=document.getElementById('history');const {data:{session}}=await db.auth.getSession();if(!session||session.user?.is_anonymous){location.replace('login.html');return}const fmt=x=>x?new Intl.DateTimeFormat('ar-SA',{dateStyle:'long'}).format(new Date(x)):'—',names={new:'جديد',reviewing:'قيد المراجعة',approved:'مقبول',rejected:'مرفوض',refunded:'تم الاسترداد'};async function loadHistory(){const {data}=await db.rpc('my_refund_requests');if(!data?.length){history.innerHTML='';return false}history.innerHTML='<h2>متابعة طلبات الاسترداد</h2>'+data.map(r=>{let cls=r.status==='rejected'?'bad':(r.status==='approved'||r.status==='refunded'?'ok':'info');let detail='';if(r.status==='new')detail='تم استلام طلبك وهو بانتظار المراجعة.';if(r.status==='reviewing')detail='طلبك قيد المراجعة حاليًا.';if(r.status==='approved')detail='تم قبول طلب الاسترداد بتاريخ '+fmt(r.decided_at)+'. سيتم استكمال إجراءات إعادة المبلغ.';if(r.status==='rejected')detail='تم رفض طلب الاسترداد بتاريخ '+fmt(r.decided_at)+'.'+(r.decision_reason?'<br><b>سبب الرفض:</b> '+esc(r.decision_reason):'');if(r.status==='refunded')detail='تم تسجيل إتمام الاسترداد بتاريخ '+fmt(r.decided_at)+'. قد يستغرق ظهور المبلغ مدة بحسب مزود الدفع والجهة المالية.';return '<div class="statusCard '+cls+'"><div class="status">طلب رقم '+r.id+' — '+names[r.status]+'</div><div class="meta">تاريخ تقديم الطلب: '+fmt(r.created_at)+'</div><div style="margin-top:8px">'+detail+'</div></div>'}).join('');return data.some(r=>['new','reviewing','approved','refunded'].includes(r.status))}function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}const hasOpen=await loadHistory();const {data:e,error}=await db.rpc('refund_eligibility');if(error){state.textContent='تعذر التحقق من بيانات الاشتراك. حاول مرة أخرى لاحقًا.';return}if(e.reason==='request_exists'||hasOpen){state.className='info';state.textContent='يوجد طلب استرداد مسجل لهذا الاشتراك. يمكنك متابعة حالته أعلاه.';return}if(e.reason==='no_active_subscription'){state.textContent='لا يوجد اشتراك فعّال يمكن التحقق منه حاليًا.';return}if(e.eligible){state.className='info ok';state.innerHTML='طلبك مستوفٍ مبدئيًا لشروط الاسترداد.<br><b>تاريخ الاشتراك:</b> '+fmt(e.started_at)+'<br><b>آخر موعد لطلب الاسترداد:</b> '+fmt(e.deadline)}else if(e.reason==='service_used'){state.className='info warn';state.innerHTML='<b>سبب عدم الاستحقاق المبدئي: سبق الانتفاع بالخدمة المدفوعة.</b><br><b>تاريخ الاشتراك:</b> '+fmt(e.started_at)+'<br><b>تاريخ أول انتفاع:</b> '+fmt(e.first_paid_use_at)+'<br><b>آخر موعد لطلب الاسترداد:</b> '+fmt(e.deadline)+'<br>يمكنك تقديم الطلب للمراجعة، وسيتم حفظ تاريخ تقديمه.'}else if(e.reason==='period_expired'){state.className='info warn';state.innerHTML='<b>سبب عدم الاستحقاق المبدئي: انتهاء مدة السبعة أيام.</b><br><b>تاريخ الاشتراك:</b> '+fmt(e.started_at)+'<br><b>انتهت مدة السبعة أيام بتاريخ:</b> '+fmt(e.deadline)+'<br>يمكنك تقديم الطلب للمراجعة، وسيتم حفظ تاريخ تقديمه.'}form.classList.remove('hidden');document.getElementById('send').onclick=async()=>{const reason=document.getElementById('reason').value.trim();if(reason.length<3){result.innerHTML='<div class="info warn">يرجى كتابة سبب طلب الاسترداد.</div>';return}const btn=document.getElementById('send');btn.disabled=true;btn.textContent='جاري الإرسال...';const {data:r,error:er}=await db.rpc('submit_refund_request',{p_reason:reason});if(er||!r?.submitted){result.innerHTML='<div class="info warn">تعذر تسجيل الطلب أو يوجد طلب سابق لهذا الاشتراك.</div>';btn.disabled=false;btn.textContent='إرسال طلب الاسترداد';return}form.classList.add('hidden');state.className='info ok';state.innerHTML='تم استلام طلبك وتسجيله للمراجعة.<br><b>رقم الطلب: '+r.request_id+'</b><br>تم حفظ تاريخ ووقت تقديم الطلب.';await loadHistory()}})();</script></body></html>

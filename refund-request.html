<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب استرداد | محاكي القدرات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;background:#f5f8fc;color:#18345b;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #dbe6f1;border-radius:20px;padding:25px}h1{margin-top:0;color:#102a56}.info{padding:14px;border-radius:12px;background:#f2f7fd;border:1px solid #d5e5f7;margin:15px 0}.warn{background:#fff8e7;border-color:#f0d79a;color:#704d00}.ok{background:#effbf5;border-color:#bfe8d1;color:#12653d}textarea{width:100%;min-height:120px;padding:12px;border:1px solid #cad8e7;border-radius:12px;font:inherit;box-sizing:border-box}button{width:100%;padding:13px;border:0;border-radius:12px;background:#164f94;color:white;font-weight:900;font-size:16px;margin-top:12px}.back{display:inline-block;margin-bottom:14px;color:#1769c2;text-decoration:none;font-weight:800}.small{font-size:13px;color:#66758f}.hidden{display:none}</style></head><body><main class="wrap"><a class="back" href="dashboard.html">← العودة للوحة الطالب</a><div class="card"><h1>طلب استرداد المدفوعات</h1><div id="state" class="info">جاري التحقق من بيانات اشتراكك...</div><div id="form" class="hidden"><label for="reason"><b>سبب طلب الاسترداد</b></label><textarea id="reason" placeholder="اكتب سبب طلب الاسترداد"></textarea><p class="small">سيتم حفظ تاريخ ووقت تقديم الطلب وبيانات الأهلية وقت التقديم للمراجعة.</p><button id="send">إرسال طلب الاسترداد</button></div><div id="result"></div></div></main><script>(async()=>{const db=window.getQudratSupabase(),state=document.getElementById('state'),form=document.getElementById('form'),result=document.getElementById('result');const {data:{session}}=await db.auth.getSession();if(!session||session.user?.is_anonymous){location.replace('login.html');return}const fmt=x=>x?new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(x)):'—';const {data:e,error}=await db.rpc('refund_eligibility');if(error){state.textContent='تعذر التحقق من بيانات الاشتراك. حاول مرة أخرى لاحقًا.';return}if(e.reason==='no_active_subscription'){state.textContent='لا يوجد اشتراك فعّال يمكن التحقق منه حاليًا.';return}if(e.reason==='request_exists'){state.textContent='يوجد طلب استرداد مسجل لهذا الاشتراك وهو قيد المراجعة أو تمت معالجته.';return}if(e.eligible){state.className='info ok';state.innerHTML='طلبك مستوفٍ مبدئيًا لشروط الاسترداد، بشرط صحة البيانات وعدم وجود مانع نظامي آخر.<br><b>آخر موعد ضمن مدة السبعة أيام:</b> '+fmt(e.deadline)}else if(e.reason==='service_used'){state.className='info warn';state.innerHTML='<b>تم بدء الانتفاع بالخدمة بتاريخ '+fmt(e.first_paid_use_at)+'.</b><br>يمكنك تقديم الطلب للمراجعة، وسيتم حفظ تاريخ تقديمه.'}else if(e.reason==='period_expired'){state.className='info warn';state.innerHTML='<b>انتهت مدة السبعة أيام بتاريخ '+fmt(e.deadline)+'.</b><br>يمكنك تقديم الطلب للمراجعة، وسيتم حفظ تاريخ تقديمه.'}form.classList.remove('hidden');document.getElementById('send').onclick=async()=>{const reason=document.getElementById('reason').value.trim();if(reason.length<3){result.innerHTML='<div class="info warn">يرجى كتابة سبب طلب الاسترداد.</div>';return}const btn=document.getElementById('send');btn.disabled=true;btn.textContent='جاري الإرسال...';const {data:r,error:er}=await db.rpc('submit_refund_request',{p_reason:reason});if(er){result.innerHTML='<div class="info warn">تعذر إرسال الطلب. حاول مرة أخرى.</div>';btn.disabled=false;btn.textContent='إرسال طلب الاسترداد';return}if(r?.submitted){form.classList.add('hidden');state.className='info ok';state.innerHTML='تم استلام طلبك وتسجيله للمراجعة.<br><b>رقم الطلب: '+r.request_id+'</b><br>تم حفظ تاريخ ووقت تقديم الطلب.'}else{result.innerHTML='<div class="info warn">تعذر تسجيل الطلب: '+(r?.reason==='request_exists'?'يوجد طلب سابق لهذا الاشتراك.':'تحقق من بيانات الطلب وحاول مرة أخرى.')+'</div>';btn.disabled=false;btn.textContent='إرسال طلب الاسترداد'}}})();</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الفصلية | نافس</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Tahoma,Arial}.wrap{max-width:980px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:22px}h1{color:#167783}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}select,input{width:100%;padding:12px;border:1px solid #d4dbe5;border-radius:10px;background:#fff;font:inherit}.actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 17px;background:#167783;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.back{background:#edf0f5;color:#344054}.preview{margin-top:20px;overflow:auto;background:#fff}table{width:100%;border-collapse:collapse}th,td{border:1px solid #aeb8bd;padding:9px;text-align:center;vertical-align:middle;line-height:1.55}th{background:#177985;color:#fff}.wk{font-weight:800;color:#177985;width:70px}.date{width:150px;font-weight:700}.note{color:#87572e}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><div class="form"><h1>الخطة الفصلية لتطبيق تدريبات نافس</h1><div class="grid"><div class="full"><label>اسم المدرسة</label><input id="school"></div><div><label>الصف</label><select id="grade" onchange="loadSubjects()"><option value="g3">الصف الثالث الابتدائي</option><option value="g6">الصف السادس الابتدائي</option><option value="g9">الصف الثالث المتوسط</option></select></div><div><label>المادة</label><select id="subject" onchange="build()"></select></div><div><label>اسم المعلمة</label><input id="teacher" placeholder="اكتب اسم المعلمة"></div><div><label>مديرة المدرسة</label><input id="principal" placeholder="اكتب اسم مديرة المدرسة"></div><div class="full"><label>العام الدراسي</label><input id="year" value="1448هـ"></div></div><div class="actions"><button class="btn" id="pdfBtn" onclick="exportPDF()">عرض تقرير A4</button><button class="btn" onclick="build()">تحديث التقرير</button><a class="btn back" href="nafs.html">رجوع</a></div></div><div class="preview" id="report"><div id="heading"></div><table><thead><tr><th>الأسبوع</th><th>التاريخ (هـ)</th><th>محتوى التطبيق</th><th>ملاحظات</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="nafs-ms-data.js"></script><script src="nafs-corrections-2026.js?v=1"></script><script src="nafs-reading-data.js"></script><script>const $=x=>document.getElementById(x),dates=['١٢–١٧ ربيع الأول','٢٤–٢٨ ربيع الأول','٢–٦ ربيع الآخر','٩–١١ ربيع الآخر','١٦–٢١ ربيع الآخر','٢٣–٢٧ ربيع الآخر','٣٠ ربيع الآخر – ٤ جمادى الأولى','٧–١١ جمادى الأولى','١٤–١٨ جمادى الأولى','٢١–٢٥ جمادى الأولى','٢٨ جمادى الأولى – ٢ جمادى الآخرة','٥–٩ جمادى الآخرة','١٩–٢٣ جمادى الآخرة','٢٦ جمادى الآخرة – ١ رجب','٤–٨ رجب','١١–١٥ رجب','١٨–٢٣ رجب','٢٥–٢٩ رجب'];function data(s,g){return s==='reading'?(window.NAFS_READING?.[g]||[]):(window.NAFS_MS?.[s]?.[g]||[])}function subjects(){let g=$('grade').value,a=[];if(data('reading',g).length)a.push(['reading','لغتي / القراءة']);if(data('math',g).length)a.push(['math','الرياضيات']);if(data('science',g).length)a.push(['science','العلوم الطبيعية']);return a}function loadSubjects(){$('subject').innerHTML=subjects().map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');build()}function skills(){let out=[];data($('subject').value,$('grade').value).forEach(r=>(r[2]||[]).forEach(x=>{x=String(x||'').trim();if(x&&!out.includes(x))out.push(x)}));return out}function noteFor(s,i){let t=String(s),sub=$('subject').value;if(sub==='reading'){if(/مفرد|معن|مرادف|مضاد/.test(t))return'توظيف المفردات في جمل وسياقات جديدة والتحقق من دقة المعنى';if(/فكرة|هدف|عنوان/.test(t))return'استخلاص الفكرة الرئيسة والأفكار الداعمة وتبرير الاختيار من النص';if(/استنت|استدلال|ضمني/.test(t))return'الاستدلال من القرائن وربط المعلومات للوصول إلى المعنى الضمني';return['قراءة نص مناسب وتطبيق المهارة مع تغذية راجعة','تنويع النصوص والتركيز على استخراج الدليل','تطبيق فردي وتعاوني ومراجعة مواطن التعثر'][i%3]}if(sub==='math'){if(/كسر/.test(t))return'استخدام النماذج والرسوم وخط الأعداد لتمثيل الكسور والتحقق من الحل';if(/منزل|أعداد/.test(t))return'تمثيل الأعداد وتحليلها بالقيمة المنزلية والتحقق بالمقارنة والتقدير';if(/جمع|طرح/.test(t))return'حل مسائل لفظية وتحديد العملية المناسبة والتحقق من معقولية الناتج';if(/ضرب|قسمة/.test(t))return'توظيف حقائق الضرب والقسمة في مواقف حياتية وشرح استراتيجية الحل';if(/هندس|شكل|زاوي|محيط|مساحة/.test(t))return'استخدام الرسم والنماذج لتحليل الأشكال وتبرير العلاقات والنتائج';return['حل أمثلة متدرجة وتبرير خطوات الحل','استخدام تمثيل بصري ومقارنة استراتيجيات الحل','تطبيق المهارة في موقف حياتي والتحقق من الناتج'][i%3]}if(/تجرب|استقص/.test(t))return'تنفيذ نشاط استقصائي وتسجيل الملاحظات ثم تفسير النتائج';if(/خلية|جسم|عضو|جهاز/.test(t))return'استخدام رسم أو نموذج لتحديد المكونات وشرح وظائفها';if(/بيئ|تكيف|مخلوق/.test(t))return'تحليل العلاقات في النظام البيئي وتفسير أثر التغيرات';return['مناقشة المفهوم وتحديد الدليل الداعم للإجابة','تطبيق المهارة بنموذج أو نشاط مبسط وتفسير النتيجة','ربط المهارة بظاهرة حياتية وتفسيرها بالأدلة'][i%3]}function distributeSkills(sk,n){const groups=Array.from({length:n},()=>[]);if(!sk.length)return groups;for(let i=0;i<sk.length;i++)groups[i%n].push(sk[i]);for(let i=0;i<n;i++)if(!groups[i].length)groups[i].push(sk[i%sk.length]);return groups}function build(){let sk=skills(),sub=$('subject').selectedOptions[0]?.text||'';$('heading').innerHTML=`<div style="text-align:center;margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-weight:700"><span>${$('school').value||'اسم المدرسة'}</span><span>العام الدراسي ${$('year').value}</span></div><h2 style="margin:8px 0;color:#176f78">خطة التطبيق — تدريبات نافس</h2><h3 style="margin:5px">الخطة الزمنية الفصلية لتطبيق تدريبات نافس — مادة ${sub}</h3><div style="display:flex;justify-content:space-between"><b>الصف: ${$('grade').selectedOptions[0]?.text||''}</b><b>المادة: ${sub}</b></div></div>`;const reserved=new Set([0,2,3,15,17]),training=[];for(let i=0;i<18;i++)if(!reserved.has(i))training.push(i);const groups=distributeSkills(sk,training.length),byWeek={};training.forEach((w,j)=>byWeek[w]=groups[j]);let h='';for(let i=0;i<18;i++){let c,n;if(i===0){c='تطبيق الاختبار التشخيصي لنواتج التعلم وتحليل نتائجه لترتيب أولويات المعالجة';n='إعداد الطلاب والتعريف بنمط الاختبار والاستعداد لتطبيقه'}else if(i===2||i===3||i===17){c='مراجعة عامة وسد الفجوات في ضوء نتائج التدريب';n=i===2?'تحليل الأخطاء الشائعة وإعادة تدريب المهارات الأقل إتقانًا':i===3?'متابعة التحسن بتدريبات مركزة وتقديم دعم وفق الاحتياج':'مراجعة ختامية وقياس مستوى التحسن وتحديد المهارات المستمرة في الدعم'}else if(i===15){c='تطبيق الاختبار النهائي ومعالجة الفاقد التعليمي في ضوء نتائجه';n='تحليل النتائج ومقارنتها بالتشخيص وتحديد أولويات المعالجة اللاحقة'}else{const g=byWeek[i]||[];const list=g.length?g:['تدريب على نواتج التعلم المستهدفة'];c='التدريب على '+(list.length>1?'المهارات':'المهارة')+': '+list.map((s,j)=>`${j+1}) ${s}`).join(' • ');n=noteFor(list[0],i)+(list.length>1?' • مع تطبيق متدرج على جميع المهارات المدرجة في هذا الأسبوع.':'')}h+=`<tr><td class="wk">${i+1}</td><td class="date">${dates[i]}</td><td>${c}</td><td class="note">${n}</td></tr>`}$('rows').innerHTML=h}function loadScript(src){return new Promise((ok,no)=>{let s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}function pdfPage(a,b){let box=document.createElement('div');box.style.cssText='width:1120px;height:760px;background:#fff;padding:14px 24px 76px;direction:rtl;font-family:Tahoma,Arial;overflow:hidden;position:relative';let content=document.createElement('div');content.style.cssText='height:670px;overflow:hidden';content.innerHTML=$('heading').outerHTML;let hd=content.firstElementChild;hd.style.marginBottom='6px';hd.querySelectorAll('h2,h3').forEach(x=>{x.style.margin='3px 0';x.style.lineHeight='1.15'});let t=document.createElement('table');t.style.cssText='width:100%;border-collapse:collapse;background:#fff;font-size:12.5px;table-layout:fixed';t.innerHTML=$('report').querySelector('thead').outerHTML+'<tbody></tbody>';[...$('rows').children].slice(a,b).forEach(r=>t.tBodies[0].appendChild(r.cloneNode(true)));content.appendChild(t);box.appendChild(content);box.querySelectorAll('th,td').forEach(c=>c.style.cssText+=';padding:4px 6px;line-height:1.2');let sig=document.createElement('div');sig.style.cssText='position:absolute;height:56px;bottom:10px;right:24px;left:24px;background:#fff;border-top:1px solid #d8dee6;display:flex;align-items:center;justify-content:space-between;padding:8px 70px 0;font-size:16px;font-weight:800;z-index:5';sig.innerHTML=`<span style="width:42%;text-align:center">المعلمة: ${$('teacher').value||'................................'}</span><span style="width:42%;text-align:center">مديرة المدرسة: ${$('principal').value||'................................'}</span>`;box.appendChild(sig);return box}async function exportPDF(){let b=$('pdfBtn'),host;try{b.disabled=true;b.textContent='جاري إنشاء العرض...';build();if(!window.html2canvas)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');host=document.createElement('div');host.style.cssText='position:absolute;left:-12000px;top:0';document.body.appendChild(host);let ranges=[[0,9],[9,18]],pages=[];for(let p=0;p<2;p++){let page=pdfPage(...ranges[p]);host.innerHTML='';host.appendChild(page);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));let cv=await html2canvas(page,{scale:1.35,useCORS:true,backgroundColor:'#fff',logging:false,width:1120,height:760,windowWidth:1120,windowHeight:760});pages.push(cv.toDataURL('image/jpeg',.9))}sessionStorage.setItem('nafsSemesterPreviewPages',JSON.stringify(pages));location.href='nafs-semester-viewer.html?v=fit1'}catch(e){console.error(e);alert('تعذر إنشاء العرض، أعد المحاولة.')}finally{host?.remove();b.disabled=false;b.textContent='عرض تقرير A4'}}loadSubjects();</script></body></html>

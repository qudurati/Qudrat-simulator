<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة العلاجية | نافس</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Tahoma,Arial}.wrap{max-width:960px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:22px}h1{margin:0 0 18px;color:#a82c2c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.f{margin-top:8px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}select,input{width:100%;padding:12px;border:1px solid #d4dbe5;border-radius:10px;background:#fff;font:inherit}.checks{border:1px solid #eadede;border-radius:11px;overflow:hidden}.check{display:flex;gap:9px;padding:11px 13px;border-bottom:1px solid #f1e8e8;line-height:1.65}.check input{width:auto;margin-top:6px}.actions{display:flex;gap:9px;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 17px;background:#b73535;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.back{background:#edf0f5;color:#344054}.note{color:#667085;font-size:13px}.report{display:none;background:#fff;padding:0;width:1120px;min-height:1584px}.empty{padding:14px;color:#667085}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><h1>خطة نافس العلاجية</h1><div class="grid"><div class="f full"><label>اسم المدرسة</label><input id="school"></div><div class="f full"><label>مديرة المدرسة</label><input id="principal"></div><div class="f full"><label>اسم المعلمة</label><input id="teacher"></div><div class="f"><label>اليوم</label><select id="day"><option>الأحد</option><option>الاثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option></select></div><div class="f"><label>التاريخ الهجري</label><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"><select id="hday"></select><select id="hmonth"><option>محرم</option><option>صفر</option><option>ربيع الأول</option><option>ربيع الآخر</option><option>جمادى الأولى</option><option>جمادى الآخرة</option><option>رجب</option><option>شعبان</option><option>رمضان</option><option>شوال</option><option>ذو القعدة</option><option>ذو الحجة</option></select><select id="hyear"><option>1447</option><option selected>1448</option><option>1449</option></select></div></div><div class="f"><label>الصف</label><select id="grade" onchange="loadSubjects()"><option value="g3">الصف الثالث الابتدائي</option><option value="g4">الصف الرابع الابتدائي</option><option value="g5">الصف الخامس الابتدائي</option><option value="g6" selected>الصف السادس الابتدائي</option><option value="g9">الثالث متوسط</option></select></div><div class="f"><label>المادة</label><select id="subject" onchange="loadDomains()"></select></div><div class="f full"><label>المجال</label><select id="domain" onchange="loadSubs()"></select></div><div class="f full" id="subField"><label>المجال الفرعي</label><select id="sub" onchange="loadOutcomes()"></select></div><div class="f full" id="outcomeField"><label>ناتج التعلم</label><select id="outcome" onchange="loadIndicators()"></select></div><div class="f full"><label>المهارات / المؤشرات</label><div id="indicators" class="checks"></div></div></div><p class="note">اختر المهارات ثم إجراءات التنفيذ العلاجية وأدوات القياس والمتابعة التي تريد ظهورها في التقرير.</p><div class="actions"><button class="btn" onclick="pdf()">عرض التقرير</button><button class="btn back" type="button" onclick="window.top.location.replace('nafs.html')">رجوع</button></div></div></div><section id="pdfReport" class="report"><header class="rhead"><h1>تقرير خطة نافس العلاجية</h1><div class="rsub">تشخيص جوانب الضعف • معالجة مركزة • متابعة أثر التحسن</div></header><div id="metaCards" class="metaCards"></div><div id="reportBody" class="rbody"></div></section><script>(async()=>{try{const db=supabase.createClient('https://cixwjisioawswnnwwswf.supabase.co','sb_publishable_g9JTqjUOCtU4qBzGBftFcg_7ZMtGVm-',{auth:{storageKey:'nafs-auth',persistSession:true,autoRefreshToken:true}});const {data}=await db.rpc('get_nafs_access');const a=data&&data[0];if(a?.active&&a.subject_code){const old=sessionStorage.getItem('nafsSubjectCode')||'';if(old&&old!==a.subject_code){sessionStorage.setItem('nafsSubjectCode',a.subject_code);sessionStorage.setItem('nafsTeacherName',a.teacher_name||'');location.reload()}else{sessionStorage.setItem('nafsSubjectCode',a.subject_code);sessionStorage.setItem('nafsTeacherName',a.teacher_name||'')}}}catch(e){}})();</script><script src="nafs-ms-data.js"></script><script src="nafs-g3-science-data.js?v=20261009-1"></script><script src="nafs-g4-data.js?v=20261005-1"></script><script src="nafs-g5-data.js?v=20261007-sync"></script><script src="nafs-corrections-2026.js?v=1"></script><script src="nafs-reading-data.js"></script><script src="nafs-pdf-remedial.js?v=404-fit-width"></script><script>const $=id=>document.getElementById(id);let rows=[],outcomeRows=[];function data(s,g){return s==='reading'?(window.NAFS_READING?.[g]||[]):(window.NAFS_MS?.[s]?.[g]||[])}function subjects(){const g=$('grade').value,a=[];if(data('reading',g).length)a.push(['reading','لغتي']);if(data('math',g).length)a.push(['math','الرياضيات']);if(data('science',g).length)a.push(['science','العلوم']);return a}function loadSubjects(){$('subject').innerHTML=subjects().map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');loadDomains()}function split(v){const p=String(v||'').split(' — ');return{domain:p[0]||'',sub:p.slice(1).join(' — ')||''}}function isDirectGrade(){return ['g4','g5'].includes($('grade').value)}function loadDomains(){rows=data($('subject').value,$('grade').value);$('domain').innerHTML=[...new Set(rows.map(r=>split(r[0]).domain))].map(x=>`<option>${x}</option>`).join('');$('subField').style.display=isDirectGrade()?'none':'';$('outcomeField').style.display=isDirectGrade()?'none':'';loadSubs()}function loadSubs(){const d=$('domain').value;if(isDirectGrade()){$('sub').innerHTML=`<option>${d}</option>`;outcomeRows=rows.filter(r=>split(r[0]).domain===d);loadIndicators();return}$('sub').innerHTML=[...new Set(rows.filter(r=>split(r[0]).domain===d).map(r=>split(r[0]).sub||d))].map(x=>`<option>${x}</option>`).join('');loadOutcomes()}function loadOutcomes(){const d=$('domain').value,s=$('sub').value;outcomeRows=rows.filter(r=>{const x=split(r[0]);return x.domain===d&&(x.sub||d)===s});$('outcome').innerHTML=outcomeRows.map((r,i)=>`<option value="${i}">${r[1]}</option>`).join('');loadIndicators()}function row(){return isDirectGrade()?outcomeRows[0]:(outcomeRows[+$('outcome').value]||null)}function loadIndicators(){if(isDirectGrade()){const skills=outcomeRows.flatMap(r=>r[2]||[]);$('indicators').innerHTML=skills.map((x,i)=>`<label class="check"><input type="checkbox" value="${i}"><span>${x}</span></label>`).join('')||'<div class="empty">لا توجد مهارات.</div>';return}const r=row();$('indicators').innerHTML=r?.[2]?.map((x,i)=>`<label class="check"><input type="checkbox" value="${i}"><span>${x}</span></label>`).join('')||'<div class="empty">لا توجد مؤشرات.</div>'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}function hdate(){return `${$('hday').value} ${$('hmonth').value} ${$('hyear').value} هـ`}function sec(i,t,c,cl=''){return `<div class="section ${cl}"><div class="stitle"><span class="ico">${i}</span>${t}</div><div class="scontent">${c}</div></div>`}function profile(skills,subjectCode){const j=skills.join('، ');let strategy='النمذجة، التدريب الموجه، الممارسة المتدرجة، التغذية الراجعة الفورية',action='تشخيص الأخطاء المرتبطة بالمهارات، إعادة تقديمها بخطوات واضحة، تدريب موجه ثم مستقل، وإعادة القياس.';if(subjectCode==='math'){strategy='النمذجة الرياضية، التمثيلات، حل مسائل متدرجة، تحليل الخطأ';action='تحديد مواضع الخطأ، نمذجة الاستراتيجية الصحيحة، تدريب متدرج إلى المسائل الحياتية، ثم التحقق من الحل وتفسيره.'}else if(subjectCode==='reading'){strategy='القراءة الموجهة، التفكير بصوت عالٍ، الأسئلة المتدرجة، الاستدلال من السياق';action='تحديد مواضع التعثر، نمذجة استراتيجية القراءة المناسبة، تدريب على نصوص قصيرة متدرجة، ثم تطبيق مستقل بدليل من النص.'}else if(subjectCode==='science'){strategy='الاستقصاء الموجه، النمذجة، تفسير الأدلة، تصحيح التصورات البديلة';action='كشف التصورات غير الصحيحة، إعادة بناء المفاهيم بالنموذج أو الاستقصاء، تفسير البيانات والأدلة، ثم تطبيق المفهوم في موقف جديد.'}return{strategy,action,goal:`رفع مستوى إتقان المهارات المستهدفة «${j}» ومعالجة جوانب الضعف حتى تتمكن الطالبة من أدائها باستقلالية.`,success:`تحسن مستوى الأداء في المهارات المحددة ومعالجة جوانب الضعف وفق نتائج القياس والمتابعة.`,tools:'قياس تشخيصي • أوراق عمل متدرجة • ملاحظة الأداء • تحليل الأخطاء • مهام تطبيقية • قياس بعدي'}}async function pdf(){const r=row();if(!r)return;const allSkills=isDirectGrade()?outcomeRows.flatMap(x=>x[2]||[]):r[2];const sel=[...document.querySelectorAll('#indicators input:checked')].map(x=>allSkills[+x.value]);if(!sel.length)return alert('اختر مهارة أو مؤشرًا واحدًا على الأقل');const g=$('grade').selectedOptions[0].text,s=$('subject').selectedOptions[0].text,subjectCode=$('subject').value,d=$('domain').value,sd=$('sub').value,sc=$('school').value,t=$('teacher').value,p=$('principal').value,dy=$('day').value,dt=hdate();$('metaCards').innerHTML=`<div class="metaCard"><b>المدرسة</b>${esc(sc||'—')}</div><div class="metaCard"><b>الصف</b>${esc(g)}</div><div class="metaCard"><b>المادة</b>${esc(s)}</div><div class="metaCard"><b>اليوم</b>${esc(dy)}</div><div class="metaCard"><b>التاريخ</b>${esc(dt)}</div>`;const q=profile(sel,subjectCode),skills=sel.map(x=>`<span style="display:inline-block;margin:3px 4px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.62);border:1px solid rgba(120,40,40,.18)">${esc(x)}</span>`).join('');$('reportBody').innerHTML=(isDirectGrade()?sec('','المجال',esc(d)):sec('','المجال والمسار',`${esc(d)} <b>←</b> ${esc(sd)}`)+sec('','ناتج التعلم',esc(r[1])))+sec('','المهارات المستهدفة بالعلاج',skills,'skillHero')+`<div class="two">${sec('','الهدف العلاجي',esc(q.goal))}${sec('','الاستراتيجيات العلاجية',esc(q.strategy))}</div>`+sec('','إجراءات التنفيذ',esc(q.action))+sec('','مؤشر النجاح',esc(q.success))+sec('','أدوات القياس والمتابعة',esc(q.tools))+`<div class="sig"><div>المعلمة<br><b>${esc(t||'........................')}</b></div><div>مديرة المدرسة<br><b>${esc(p||'........................')}</b></div></div><div class="footer">خطة نافس العلاجية • تقرير مبني على المهارات المستهدفة بالعلاج</div>`;await NAFS_PDF_REMEDIAL.download($('pdfReport'),'خطة-نافس-العلاجية.pdf')}$('hday').innerHTML=Array.from({length:30},(_,i)=>`<option>${i+1}</option>`).join('');loadSubjects();</script><script src="nafs-remedial-options.js?v=1"></script><script src="nafs-weekly-skill-picker.js?v=20261007-g5science-sync2"></script></body></html>

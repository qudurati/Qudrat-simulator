<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مسرد الحصص - تجربة المالك</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:15px;margin:12px 0}h1{color:#5538c8}button,select{padding:10px;margin:5px;border-radius:8px;border:1px solid #ddd;font:inherit}button{background:#5538c8;color:#fff}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:8px}th{background:#eeeaff}textarea{width:95%;min-height:52px;font:inherit;border:1px solid #ddd}.controls{display:flex;flex-wrap:wrap;gap:10px}#app{display:none}@media print{@page{size:A4 landscape}.no-print{display:none!important}body{background:white}.card{padding:0}textarea{border:0;resize:none}tr{break-inside:avoid}}</style><div class="wrap"><div class="card no-print"><a href="/nafs.html">العودة إلى نافس</a><h1>مسرد الحصص الدراسية — تجربة المالك</h1><p id="status">جارٍ التحقق من صلاحية المالك...</p></div><div id="app"><div class="card no-print"><div class="controls"><label>الصف <select id="grade"></select></label><label>المادة <select id="subject"></select></label><label>الأحد <select id="sun"></select></label><label>الثلاثاء <select id="tue"></select></label><label>الخميس <select id="thu"></select></label></div><button id="build">توزيع مهارات الخطة الفصلية</button><button onclick="print()">طباعة</button><p id="notice">التوزيع تجريبي ولا يغير بيانات الخطط أو المشتركين. التاريخ المعروض نطاق الأسبوع وليس تاريخ الحصة.</p></div><div class="card"><h1 style="text-align:center">مسرد الحصص الدراسية</h1><p id="summary"></p><div style="overflow:auto"><table><thead><tr><th>الأسبوع</th><th>التاريخ الهجري للأسبوع</th><th>اليوم</th><th>الحصة</th><th>المهارة / النشاط</th><th>ملاحظات</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div><script>const $=x=>document.getElementById(x);const db=supabase.createClient('https://cixwjisioawswnnwwswf.supabase.co','sb_publishable_g9JTqjUOCtU4qBzGBftFcg_7ZMtGVm-',{auth:{storageKey:'nafs-auth',persistSession:true}});const days=[['الأحد','sun'],['الثلاثاء','tue'],['الخميس','thu']];for(const [,id]of days)$(id).innerHTML=Array.from({length:8},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'</option>').join('');sun.value=1;tue.value=3;thu.value=2;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let frame;function source(){return frame?.contentWindow?.document?.getElementById('core')?.contentWindow?.document?.getElementById('plan')?.contentWindow}function sync(){let w=source(),d=w?.document,g=d?.getElementById('grade'),s=d?.getElementById('subject');if(!g||!s||!s.options.length)return false;let oldG=grade.value,oldS=subject.value;grade.innerHTML=[...g.options].map(o=>'<option value="'+esc(o.value)+'">'+esc(o.textContent)+'</option>').join('');if([...g.options].some(o=>o.value===oldG))grade.value=oldG;if(g.value!==grade.value){g.value=grade.value;g.dispatchEvent(new Event('change'))}subject.innerHTML=[...s.options].map(o=>'<option value="'+esc(o.value)+'">'+esc(o.textContent)+'</option>').join('');if([...s.options].some(o=>o.value===oldS))subject.value=oldS;return true}function selectSource(){const w=source(),d=w?.document;if(!d)return;d.getElementById('grade').value=grade.value;d.getElementById('grade').dispatchEvent(new Event('change'));setTimeout(()=>{sync();d.getElementById('subject').value=subject.value;d.getElementById('subject').dispatchEvent(new Event('change'));setTimeout(render,400)},400)}function render(){const w=source(),rs=[...w?.document?.querySelectorAll('#rows tr')||[]];if(rs.length!==18){notice.textContent='بيانات الأسابيع لم تكتمل. أعد المحاولة.';return}let h='';rs.forEach((r,i)=>{let period=r.cells[1]?.textContent.trim()||'',raw=r.cells[2]?.textContent.trim()||'',review=/مراجعة|اختبار|تشخيص/.test(raw)&&!/^التدريب على/.test(raw),skills=raw.replace(/^التدريب على المهارات?:\s*/,'').split(/\s*•\s*|\s+\d+\)\s*/).map(x=>x.trim()).filter(Boolean);let a=review?[raw,raw,raw]:skills;if(!a.length)a=['تدريب على مهارات الأسبوع'];while(a.length<3)a.push(a.length===1?'تطبيق المهارة والتدريب عليها':'تقويم ومراجعة');if(a.length>3)a=[a[0],a[1],a.slice(2).join(' • ')];days.forEach(([day,id],j)=>{h+='<tr><td>'+(i+1)+'</td><td>'+esc(period)+'</td><td>'+day+'</td><td>'+esc($(id).value)+'</td><td><textarea>'+esc(a[j])+'</textarea></td><td><textarea></textarea></td></tr>'})});rows.innerHTML=h;summary.textContent='18 أسبوعًا — 54 حصة — '+grade.selectedOptions[0]?.text+' — '+subject.selectedOptions[0]?.text;notice.textContent='تم إنشاء توزيع مقترح قابل للتعديل. التعديلات محلية في هذه الصفحة ولا تحفظ في قاعدة البيانات.'}async function init(){try{const session=(await db.auth.getSession()).data.session;if(!session){$('status').textContent='سجل الدخول في نافس أولًا.';return}const {data,error}=await db.rpc('get_nafs_access');if(error||data?.[0]?.is_owner!==true){$('status').textContent='هذه الصفحة لحساب المالك فقط.';return}$('status').textContent='تم التحقق من حساب المالك.';$('app').style.display='block';frame=document.createElement('iframe');frame.style.cssText='position:absolute;left:-12000px;top:0;width:1100px;height:850px;border:0;pointer-events:none';frame.src='/nafs-semester-plan-v3.html?v=20261004-restored-latest';document.body.appendChild(frame);let n=0,t=setInterval(()=>{if(sync()){clearInterval(t);setTimeout(render,600)}else if(++n>50){clearInterval(t);notice.textContent='تعذر تحميل مصدر الخطة.'}},400)}catch(e){$('status').textContent='تعذر التحقق من الحساب.'}}grade.onchange=selectSource;subject.onchange=selectSource;$('build').onclick=selectSource;for(const [,id]of days)$(id).onchange=render;init();</script>

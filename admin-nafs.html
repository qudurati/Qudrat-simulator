nt-weight:900;margin:0 0 4px}.save{background:#5538c8;color:#fff;white-space:nowrap}.meta{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:9px}.meta div{background:#f8faff;border-radius:9px;padding:7px 8px;min-width:0}.meta small{display:block;color:#7b8498;font-size:10px;font-weight:800;margin-bottom:2px}.meta b{display:block;font-size:12px;overflow-wrap:anywhere}.subAction{margin-top:8px;display:flex;justify-content:flex-end}.activate{background:#e9f8ef;color:#167044}.stop{background:#fff0f0;color:#b42318}.empty{text-align:center;padding:24px;background:#fff;border-radius:14px;color:#667085}.login{max-width:430px;margin:35px auto;padding:16px;display:none}.login h2{margin-top:0}.login label{display:block;font-weight:800;margin:8px 0 5px}.msg{margin-top:9px;color:#b42318;font-weight:800}.version{font-size:10px;color:#98a2b3;margin-top:5px}@media(max-width:760px){.head{display:block}.headActions{margin-top:8px}.editGrid{grid-template-columns:1fr 1fr}.editGrid .save{grid-column:1/-1}.meta{grid-template-columns:repeat(2,1fr)}.meta div:last-child{grid-column:1/-1}.subAction .btn{width:100%}}@media(max-width:430px){.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:8px}.stat b{font-size:20px}.editGrid{grid-template-columns:1fr}.editGrid .save{grid-column:auto}.head h1{font-size:24px}}/* NAFS owner dashboard visual refresh */body{background:#f4f6fb;color:#182239}.wrap{max-width:1080px;padding:24px 16px 48px}.head{align-items:center}.head h1{font-size:clamp(24px,4vw,32px);letter-spacing:-.5px}.head p{line-height:1.7}.stat,.tools,.card,.login{border:1px solid #e3e8f2;border-radius:22px;background:#fff;box-shadow:0 6px 24px rgba(28,40,80,.035)}.stats{gap:12px;margin:22px 0}.stat{padding:17px 20px}.stat b{font-size:28px;color:#4933b8}.stat span{font-size:13px}.tools{padding:12px;gap:10px;margin-bottom:16px}.tools input,.field input,.field select,.login input{border:1px solid #d5ddef;border-radius:13px;padding:13px 14px;min-height:48px;outline:none;transition:border-color .15s,box-shadow .15s}.tools input:focus,.field input:focus,.field select:focus,.login input:focus{border-color:#7655e9;box-shadow:0 0 0 3px rgba(118,85,233,.1)}.btn{border-radius:13px;padding:13px 18px;transition:filter .15s,transform .15s}.btn:active{transform:scale(.99)}.purple,.save{background:#593dd2;color:#fff}.cards{gap:16px}.card{padding:24px;border-radius:24px}.top{align-items:flex-start;gap:14px;padding-bottom:17px;margin-bottom:20px;border-bottom:1px solid #edf0f6}.top>div:first-child{min-width:0}.top b{font-size:21px;line-height:1.5}.top .email{font-size:14px;margin-top:3px;line-height:1.5}.tags{gap:7px;justify-content:flex-start}.tag{font-size:12px;padding:7px 11px;white-space:nowrap}.on{background:#e1f8e9;color:#187443}.off{background:#eef1f6;color:#58657b}.paid{background:#e6efff;color:#2457b2}.editGrid{grid-template-columns:1.15fr 1fr 1fr auto;gap:13px}.field label{font-size:13px;margin-bottom:8px}.save{min-width:95px}.meta{gap:10px;margin-top:20px;grid-template-columns:repeat(5,minmax(0,1fr))}.meta div{background:#f5f7fc;border-radius:16px;padding:14px 13px;min-height:76px}.meta small{font-size:12px;margin-bottom:9px}.meta b{font-size:14px;line-height:1.5}.meta div:nth-child(1){background:#f0f3ff}.meta div:nth-child(2){background:#ecf8f3}.meta div:nth-child(3){background:#fff7e9}.meta div:nth-child(4){background:#fff1f4}.meta div:nth-child(5){background:#eff7ff}.subAction{margin-top:16px}.activate{background:#e8f6ed;color:#196e42}.stop{background:#fff0f0;color:#b42318}@media(max-width:760px){.wrap{padding:18px 12px 40px}.head{display:block}.headActions{margin-top:12px}.card{padding:18px}.top{flex-direction:column;align-items:stretch}.tags{justify-content:flex-start}.editGrid{grid-template-columns:1fr 1fr}.editGrid .field:first-child{grid-column:1/-1}.editGrid .save{grid-column:1/-1;width:100%}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}.meta div:last-child{grid-column:1/-1}.subAction .btn{width:100%}}@media(max-width:430px){.stat{padding:12px}.stat b{font-size:22px}.stat span{font-size:11px}.card{padding:15px}.top b{font-size:20px}.editGrid{grid-template-columns:1fr}.editGrid .field:first-child,.editGrid .save{grid-column:auto}.meta div{padding:12px}.meta b{font-size:13px}}.email-action{padding:7px 10px;background:#f1efff;color:#5538c8;font-size:12px}.tags .btn{white-space:normal}</style></head><body><div class="wrap"><div class="head"><div><h1>اشتراكات نافس</h1><p>تعديل بيانات المشتركين مباشرة من نفس الشاشة.</p><div class="version">نسخة 2026-10-05-nafs-semester</div></div><div class="headActions"><button id="nafsLogout" class="btn logoutNafs" type="button">تسجيل خروج نافس</button><a class="back" href="admin.html">← لوحة المالك</a></div></div><section id="loginBox" class="login"><h2>دخول مالك نافس</h2><label>البريد الإلكتروني</label><input id="ownerEmail" type="email"><label>كلمة المرور</label><input id="ownerPassword" type="password"><button id="ownerLogin" class="btn purple" style="width:100%;margin-top:10px">تسجيل الدخول</button><div id="loginMsg" class="msg"></div></section><main id="panel" style="display:none"><div class="stats"><div class="stat"><b id="total">0</b><span>الاشتراكات</span></div><div class="stat"><b id="active">0</b><span>فعّال</span></div><div class="stat"><b id="paid">0</b><span>مدفوع</span></div></div><div class="tools"><input id="q" placeholder="بحث بالاسم أو البريد أو الجوال أو الفاتورة"><button id="refresh" class="btn purple">تحديث</button></div><div id="cards" class="cards"></div></main></div><script>const db=supabase.createClient('https://cixwjisioawswnnwwswf.supabase.co','sb_publishable_g9JTqjUOCtU4qBzGBftFcg_7ZMtGVm-',{auth:{storageKey:'nafs-owner-admin',persistSession:true,autoRefreshToken:true}});const names={math:'الرياضيات',science:'العلوم',arabic:'لغتي / اللغة العربية'};let all=[];const $=id=>document.getElementById(id),esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML},fmt=x=>x?new Intl.DateTimeFormat('ar-SA',{dateStyle:'short'}).format(new Date(x)):'—';async function ensure(){const s=(await db.auth.getSession()).data.session;if(!s){$('loginBox').style.display='block';$('panel').style.display='none';return}$('loginBox').style.display='none';$('panel').style.display='block';load()}async function load(){$('cards').innerHTML='<div class="empty">جاري تحميل الاشتراكات...</div>';const {data,error}=await db.rpc('owner_nafs_subscriptions');if(error){$('cards').innerHTML='<div class="empty">تعذر التحميل: '+esc(error.message)+'</div>';return}const {data:confirmations,error:confirmError}=await db.rpc('owner_nafs_email_confirmations');const confirmationMap=new Map((!confirmError&&confirmations||[]).map(x=>[x.user_id,x.email_confirmed]));all=(data||[]).map(x=>({...x,email_confirmed:confirmationMap.has(x.user_id)?confirmationMap.get(x.user_id):null}));draw()}function draw(){const q=$('q').value.trim().toLowerCase(),a=all.filter(x=>!q||[x.teacher_name,x.email,x.phone,names[x.subject_code],x.payment_order_number].join(' ').toLowerCase().includes(q));$('total').textContent=all.length;$('active').textContent=all.filter(x=>x.status==='active'&&(!x.ends_at||new Date(x.ends_at)>new Date())).length;$('paid').textContent=all.filter(x=>x.payment_status==='paid').length;$('cards').innerHTML=a.length?a.map(x=>{const active=x.status==='active'&&(!x.ends_at||new Date(x.ends_at)>new Date()),paid=x.payment_status==='paid',id=esc(x.user_id);return `<article class="card" data-card="${id}"><div class="top"><div><b>${esc(x.teacher_name||'بدون اسم')}</b><div class="email">${esc(x.email||'—')}</div></div><div class="tags"><span class="tag ${active?'on':'off'}">${active?'فعّال':'غير فعّال'}</span>${paid?'<span class="tag paid">مدفوع</span>':''}${x.email_confirmed===false?'<span class="tag off">البريد غير مفعّل</span>':x.email_confirmed===true?'<span class="tag on">البريد مفعّل</span>':''}${x.email_confirmed===false?'<button class="btn email-action" data-mail="resend" data-uid="'+id+'">إعادة إرسال الرابط</button><button class="btn email-action" data-mail="confirm" data-uid="'+id+'">تفعيل البريد يدوياً</button>':''}</div></div><div class="editGrid"><div class="field"><label>الاسم</label><input data-name value="${esc(x.teacher_name||'')}"></div><div class="field"><label>رقم الجوال</label><input data-phone inputmode="numeric" maxlength="10" placeholder="05xxxxxxxx" value="${esc(x.phone||'')}"></div><div class="field"><label>المادة</label><select data-subject><option value="math" ${x.subject_code==='math'?'selected':''}>الرياضيات</option><option value="science" ${x.subject_code==='science'?'selected':''}>العلوم</option><option value="arabic" ${x.subject_code==='arabic'?'selected':''}>لغتي / العربية</option></select></div><button class="btn save" data-save="${id}">حفظ</button></div><div class="meta"><div><small>بداية الاشتراك</small><b>${fmt(x.starts_at)}</b></div><div><small>انتهاء الاشتراك</small><b>${fmt(x.ends_at)}</b></div><div><small>المبلغ</small><b>${paid?esc(String(x.amount_sar||0))+' ريال':'—'}</b></div><div><small>الفاتورة</small><b>${esc(x.payment_order_number||'—')}</b></div><div><small>الدفع</small><b>${fmt(x.paid_at)}</b></div></div><div class="subAction"><button class="btn ${active?'stop':'activate'}" data-sub="${id}" data-active="${active?'0':'1'}">${active?'إيقاف الاشتراك':'تفعيل فصل دراسي'}</button></div></article>`}).join(''):'<div class="empty">لا توجد اشتراكات.</div>';$('cards').querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveInline(b));$('cards').querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>setSub(b));$('cards').querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>emailAction(b))}async function emailAction(b){const action=b.dataset.mail,id=b.dataset.uid;if(!confirm(action==='confirm'?'هل تحققت من ملكية المشترك للبريد وتريد تفعيله يدوياً؟':'إعادة إرسال رابط التفعيل للمشترك؟'))return;const session=(await db.auth.getSession()).data.session;if(!session)return alert('يجب تسجيل دخول المالك');b.disabled=true;try{const res=await fetch('https://cixwjisioawswnnwwswf.supabase.co/functions/v1/nafs-owner-email-action',{method:'POST',headers:{'Content-Type':'application/json',apikey:'sb_publishable_g9JTqjUOCtU4qBzGBftFcg_7ZMtGVm-',Authorization:'Bearer '+session.access_token},body:JSON.stringify({user_id:id,action})});const data=await res.json();if(!res.ok)throw Error(data.error||'فشل الطلب');alert(action==='confirm'?'تم تفعيل البريد':'تم طلب إرسال رابط التفعيل');await load()}catch(e){alert('تعذر التنفيذ: '+e.message)}finally{b.disabled=false}}async function saveInline(b){const card=b.closest('[data-card]'),id=b.dataset.save,phone=card.querySelector('[data-phone]').value.trim(),name=card.querySelector('[data-name]').value.trim(),subject=card.querySelector('[data-subject]').value;if(phone&&!/^05\d{8}$/.test(phone))return alert('رقم الجوال يجب أن يكون 10 أرقام ويبدأ بـ 05');b.disabled=true;b.textContent='حفظ...';const {error}=await db.rpc('owner_update_nafs_profile',{p_user_id:id,p_teacher_name:name,p_subject_code:subject,p_phone:phone});if(error){b.disabled=false;b.textContent='حفظ';return alert(error.message)}await load()}async function setSub(b){const on=b.dataset.active==='1';if(!confirm(on?'تفعيل الاشتراك لمدة فصل دراسي؟':'إيقاف الاشتراك؟'))return;b.disabled=true;const {error}=await db.rpc('owner_set_nafs_subscription',{p_user_id:b.dataset.sub,p_active:on,p_days:180});if(error)alert(error.message);await load()}$('ownerLogin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('ownerEmail').value.trim(),password:$('ownerPassword').value});$('loginMsg').textContent=error?'تعذر الدخول. استخدم حساب مالك نافس.':'';if(!error)ensure()};$('nafsLogout').onclick=async()=>{const b=$('nafsLogout');b.disabled=true;b.textContent='جاري الخروج...';try{await db.auth.signOut({scope:'local'})}catch(e){}localStorage.removeItem('nafs-owner-admin');sessionStorage.removeItem('nafs-owner-admin');location.reload()};$('refresh').onclick=load;$('q').oninput=draw;ensure();</script></body></html>

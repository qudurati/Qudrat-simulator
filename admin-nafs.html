<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اشتراكات نافس | لوحة المالك</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial}.wrap{max-width:900px;margin:auto;padding:24px}.head{margin-bottom:22px}.head h1{font-size:38px;margin:0 0 8px}.head p{color:#667085;line-height:1.7;margin:0 0 14px}.back{color:#5538c8;text-decoration:none;font-weight:900}.tools{background:#fff;border:1px solid #dce7f2;border-radius:20px;padding:16px;box-shadow:0 5px 18px #1e46780d;display:flex;gap:10px;margin-bottom:18px}.tools input{flex:1;padding:13px;border:1px solid #d8deea;border-radius:12px;font:inherit}.tools button,.act{border:0;border-radius:12px;padding:12px 15px;font:inherit;font-weight:900;cursor:pointer}.tools button{background:#5538c8;color:#fff}.cards{display:grid;gap:16px}.card{background:#fff;border:1px solid #dce7f2;border-radius:22px;padding:20px;box-shadow:0 5px 18px rgba(30,70,120,.05)}.cardTop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid #edf1f5}.teacher{font-size:21px;font-weight:900}.tag{display:inline-block;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:900}.on{background:#dcfce7;color:#166534}.off{background:#f1f3f6;color:#667085}.rows{margin-top:5px}.row{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid #edf1f5;align-items:center}.row:last-child{border-bottom:0}.label{color:#7b8498;font-weight:800}.value{font-weight:700;overflow-wrap:anywhere}.actions{padding-top:15px}.act{width:100%;font-size:16px}.activate{background:#e9f8ef;color:#167044;border:1px solid #bfe5cc}.stop{background:#fff0f0;color:#b42318;border:1px solid #f4c7c7}.empty{text-align:center;background:#fff;border:1px solid #dce7f2;border-radius:20px;padding:35px;color:#667085}@media(max-width:650px){.wrap{padding:18px 14px}.head h1{font-size:34px}.tools{flex-direction:column}.card{padding:17px 16px}.row{grid-template-columns:92px 1fr;padding:12px 0}.teacher{font-size:19px}}</style></head><body><div class="wrap"><div class="head"><h1>اشتراكات نافس</h1><p>إدارة حسابات المعلمين وتفعيل الاشتراك يدويًا للاختبار أو الدعم.</p><a class="back" href="admin.html">← لوحة المالك</a></div><div class="tools"><input id="q" placeholder="بحث بالاسم أو البريد أو المادة"><button id="refresh">تحديث</button></div><div id="cards" class="cards"></div><div id="empty" class="empty" hidden>لا توجد حسابات نافس.</div></div><script src="supabase-config.js"></script><script>const db=window.getQudratSupabase(),cards=document.getElementById('cards'),empty=document.getElementById('empty'),names={math:'الرياضيات',science:'العلوم',arabic:'لغتي / اللغة العربية'};let all=[];const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML},fmt=x=>x?new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium'}).format(new Date(x)):'—';async function load(){cards.innerHTML='<div class="empty">جاري تحميل الاشتراكات...</div>';const {data,error}=await db.rpc('owner_nafs_subscriptions');if(error){cards.innerHTML='<div class="empty">غير مصرح أو تعذر تحميل الاشتراكات.</div>';return}all=data||[];draw()}function draw(){const q=document.getElementById('q').value.trim().toLowerCase(),a=all.filter(x=>!q||[x.teacher_name,x.email,names[x.subject_code]].join(' ').toLowerCase().includes(q));empty.hidden=!!a.length;cards.innerHTML=a.map(x=>{const active=x.status==='active'&&(!x.ends_at||new Date(x.ends_at)>new Date());return `<article class="card"><div class="cardTop"><div class="teacher">${esc(x.teacher_name||'بدون اسم')}</div><span class="tag ${active?'on':'off'}">${active?'فعّال':'غير فعّال'}</span></div><div class="rows"><div class="row"><div class="label">البريد</div><div class="value">${esc(x.email)}</div></div><div class="row"><div class="label">المادة</div><div class="value">${esc(names[x.subject_code]||x.subject_code||'—')}</div></div><div class="row"><div class="label">بداية الاشتراك</div><div class="value">${fmt(x.starts_at)}</div></div><div class="row"><div class="label">انتهاء الاشتراك</div><div class="value">${fmt(x.ends_at)}</div></div></div><div class="actions"><button class="act ${active?'stop':'activate'}" data-id="${x.user_id}" data-active="${active?'0':'1'}">${active?'إيقاف الاشتراك':'تفعيل الاشتراك لمدة سنة'}</button></div></article>`}).join('');cards.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>setSub(b))}async function setSub(b){const on=b.dataset.active==='1',msg=on?'تفعيل اشتراك نافس لهذا الحساب لمدة سنة؟':'إيقاف اشتراك نافس لهذا الحساب؟';if(!confirm(msg))return;b.disabled=true;const {error}=await db.rpc('owner_set_nafs_subscription',{p_user_id:b.dataset.id,p_active:on,p_days:365});if(error)alert('تعذر تنفيذ العملية: '+error.message);await load()}document.getElementById('q').oninput=draw;document.getElementById('refresh').onclick=load;load();</script></body></html>

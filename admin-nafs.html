<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اشتراكات نافس | لوحة المالك</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial}.wrap{max-width:950px;margin:auto;padding:24px}.head h1{font-size:34px;margin:0 0 8px}.head p{color:#667085}.back{color:#5538c8;text-decoration:none;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat,.card,.tools{background:#fff;border:1px solid #dce7f2;border-radius:18px;padding:16px}.stat b{display:block;font-size:26px}.stat span{color:#667085}.tools{display:flex;gap:10px;margin-bottom:16px}.tools input{flex:1;padding:12px;border:1px solid #d8deea;border-radius:11px;font:inherit}.btn{border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:900;cursor:pointer}.purple{background:#5538c8;color:#fff}.cards{display:grid;gap:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #edf1f5;padding-bottom:12px}.teacher{font-size:20px;font-weight:900}.tag{padding:6px 10px;border-radius:999px;font-size:13px;font-weight:900}.on{background:#dcfce7;color:#166534}.off{background:#f1f3f6;color:#667085}.paid{background:#e8f1ff;color:#174ea6}.row{display:grid;grid-template-columns:125px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #edf1f5}.label{color:#7b8498;font-weight:800}.value{font-weight:700;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:13px}.edit{background:#eef2ff;color:#4338ca}.activate{background:#e9f8ef;color:#167044}.stop{background:#fff0f0;color:#b42318}.empty{text-align:center;padding:30px;background:#fff;border-radius:18px;color:#667085}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px}.box{background:#fff;width:min(480px,100%);border-radius:20px;padding:22px}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #d8deea;border-radius:10px;font:inherit}.modalActions{display:flex;gap:8px;margin-top:16px}.modalActions button{flex:1}@media(max-width:650px){.wrap{padding:16px 12px}.stats{grid-template-columns:1fr 1fr}.tools{flex-direction:column}.row{grid-template-columns:95px 1fr}.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><h1>اشتراكات نافس</h1><p>إدارة المشتركين وبيانات الدفع والتفعيل.</p><a class="back" href="admin.html">← لوحة المالك</a></div><div class="stats"><div class="stat"><b id="total">0</b><span>الحسابات</span></div><div class="stat"><b id="active">0</b><span>اشتراك فعّال</span></div><div class="stat"><b id="paid">0</b><span>مدفوع</span></div></div><div class="tools"><input id="q" placeholder="بحث بالاسم أو البريد أو الجوال أو الفاتورة"><button id="refresh" class="btn purple">تحديث</button></div><div id="cards" class="cards"></div></div><div id="modal" class="modal"><div class="box"><h2>تعديل بيانات المشترك</h2><input id="editId" type="hidden"><div class="field"><label>الاسم</label><input id="editName"></div><div class="field"><label>رقم الجوال</label><input id="editPhone" inputmode="numeric" placeholder="05xxxxxxxx" maxlength="10"></div><div class="field"><label>المادة</label><select id="editSubject"><option value="math">الرياضيات</option><option value="science">العلوم</option><option value="arabic">لغتي / اللغة العربية</option></select></div><div class="modalActions"><button id="saveEdit" class="btn purple">حفظ التعديل</button><button id="cancelEdit" class="btn">إلغاء</button></div></div></div><script src="supabase-config.js"></script><script>const db=window.getQudratSupabase(),cards=document.getElementById('cards'),names={math:'الرياضيات',science:'العلوم',arabic:'لغتي / اللغة العربية'};let all=[];const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML},fmt=x=>x?new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(x)):'—';async function load(){cards.innerHTML='<div class="empty">جاري تحميل الاشتراكات...</div>';const {data,error}=await db.rpc('owner_nafs_subscriptions');if(error){cards.innerHTML='<div class="empty">تعذر تحميل الاشتراكات: '+esc(error.message)+'</div>';return}all=data||[];draw()}function draw(){const q=document.getElementById('q').value.trim().toLowerCase(),a=all.filter(x=>!q||[x.teacher_name,x.email,x.phone,names[x.subject_code],x.payment_order_number].join(' ').toLowerCase().includes(q));document.getElementById('total').textContent=all.length;document.getElementById('active').textContent=all.filter(x=>x.status==='active'&&(!x.ends_at||new Date(x.ends_at)>new Date())).length;document.getElementById('paid').textContent=all.filter(x=>x.payment_status==='paid').length;cards.innerHTML=a.length?a.map(x=>{const active=x.status==='active'&&(!x.ends_at||new Date(x.ends_at)>new Date()),paid=x.payment_status==='paid';return `<article class="card"><div class="top"><div class="teacher">${esc(x.teacher_name||'بدون اسم')}</div><div><span class="tag ${active?'on':'off'}">${active?'فعّال':'غير فعّال'}</span> ${paid?'<span class="tag paid">مدفوع</span>':''}</div></div><div class="row"><div class="label">البريد</div><div class="value">${esc(x.email)}</div></div><div class="row"><div class="label">الجوال</div><div class="value">${esc(x.phone||'—')}</div></div><div class="row"><div class="label">المادة</div><div class="value">${esc(names[x.subject_code]||x.subject_code||'—')}</div></div><div class="row"><div class="label">بداية الاشتراك</div><div class="value">${fmt(x.starts_at)}</div></div><div class="row"><div class="label">انتهاء الاشتراك</div><div class="value">${fmt(x.ends_at)}</div></div>${paid?`<div class="row"><div class="label">المبلغ</div><div class="value">${esc(String(x.amount_sar||0))} ريال</div></div><div class="row"><div class="label">رقم الفاتورة</div><div class="value">${esc(x.payment_order_number||'—')}</div></div><div class="row"><div class="label">وقت الدفع</div><div class="value">${fmt(x.paid_at)}</div></div>`:''}<div class="actions"><button class="btn edit" data-edit="${x.user_id}">تعديل البيانات</button><button class="btn ${active?'stop':'activate'}" data-sub="${x.user_id}" data-active="${active?'0':'1'}">${active?'إيقاف الاشتراك':'تفعيل سنة'}</button></div></article>`}).join(''):'<div class="empty">لا توجد نتائج.</div>';cards.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));cards.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>setSub(b))}function openEdit(id){const x=all.find(v=>v.user_id===id);if(!x)return;editId.value=id;editName.value=x.teacher_name||'';editPhone.value=x.phone||'';editSubject.value=x.subject_code||'math';modal.style.display='flex'}cancelEdit.onclick=()=>modal.style.display='none';saveEdit.onclick=async()=>{const phone=editPhone.value.trim();if(phone&&!/^05\d{8}$/.test(phone))return alert('رقم الجوال يجب أن يكون 10 أرقام ويبدأ بـ 05');saveEdit.disabled=true;const {error}=await db.rpc('owner_update_nafs_profile',{p_user_id:editId.value,p_teacher_name:editName.value.trim(),p_subject_code:editSubject.value,p_phone:phone});saveEdit.disabled=false;if(error)return alert('تعذر الحفظ: '+error.message);modal.style.display='none';await load()};async function setSub(b){const on=b.dataset.active==='1';if(!confirm(on?'تفعيل الاشتراك لمدة سنة؟':'إيقاف الاشتراك؟'))return;b.disabled=true;const {error}=await db.rpc('owner_set_nafs_subscription',{p_user_id:b.dataset.sub,p_active:on,p_days:365});if(error)alert(error.message);await load()}q.oninput=draw;refresh.onclick=load;load();</script></body></html>

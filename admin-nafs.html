<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اشتراكات نافس | لوحة المالك</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial}.wrap{max-width:1100px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.head a{color:#5538c8;text-decoration:none;font-weight:800}.panel{background:#fff;border:1px solid #dce7f2;border-radius:20px;padding:18px;box-shadow:0 5px 18px #1e46780d}.tools{display:flex;gap:10px;margin-bottom:15px}.tools input{flex:1;padding:12px;border:1px solid #d8deea;border-radius:11px;font:inherit}.tools button,.act{border:0;border-radius:10px;padding:10px 13px;font:inherit;font-weight:800;cursor:pointer}.tools button{background:#5538c8;color:#fff}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:12px 9px;border-bottom:1px solid #edf1f5;text-align:right}th{color:#667085;font-size:13px}.tag{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.on{background:#dcfce7;color:#166534}.off{background:#f1f3f6;color:#667085}.activate{background:#dcfce7;color:#166534}.stop{background:#fee2e2;color:#991b1b}.empty{text-align:center;padding:35px;color:#667085}@media(max-width:650px){.wrap{padding:14px}.head{align-items:flex-start;flex-direction:column}.tools{flex-direction:column}}</style></head><body><div class="wrap"><div class="head"><div><h1>اشتراكات نافس</h1><p>إدارة حسابات المعلمين وتفعيل الاشتراك يدويًا للاختبار أو الدعم.</p></div><a href="admin.html">← لوحة المالك</a></div><div class="panel"><div class="tools"><input id="q" placeholder="بحث بالاسم أو البريد أو المادة"><button id="refresh">تحديث</button></div><div class="table"><table><thead><tr><th>المعلم</th><th>البريد</th><th>المادة</th><th>الحالة</th><th>البداية</th><th>النهاية</th><th>الإجراء</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>لا توجد حسابات نافس.</div></div></div></div><script src="supabase-config.js"></script><script>const db=window.getQudratSupabase(),rows=document.getElementById('rows'),empty=document.getElementById('empty'),names={math:'الرياضيات',science:'العلوم',arabic:'لغتي / اللغة العربية'};let all=[];const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML},fmt=x=>x?new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium'}).format(new Date(x)):'—';async function load(){rows.innerHTML='<tr><td colspan="7">جاري التحميل...</td></tr>';const {data,error}=await db.rpc('owner_nafs_subscriptions');if(error){rows.innerHTML='<tr><td colspan="7">غير مصرح أو تعذر تحميل الاشتراكات.</td></tr>';return}all=data||[];draw()}function draw(){const q=document.getElementById('q').value.trim().toLowerCase(),a=all.filter(x=>!q||[x.teacher_name,x.email,names[x.subject_code]].join(' ').toLowerCase().includes(q));empty.hidden=!!a.length;rows.innerHTML=a.map(x=>{const active=x.status==='active'&&(!x.ends_at||new Date(x.ends_at)>new Date());return `<tr><td><b>${esc(x.teacher_name||'—')}</b></td><td>${esc(x.email)}</td><td>${esc(names[x.subject_code]||x.subject_code||'—')}</td><td><span class="tag ${active?'on':'off'}">${active?'فعّال':'غير فعّال'}</span></td><td>${fmt(x.starts_at)}</td><td>${fmt(x.ends_at)}</td><td><button class="act ${active?'stop':'activate'}" data-id="${x.user_id}" data-active="${active?'0':'1'}">${active?'إيقاف':'تفعيل سنة'}</button></td></tr>`}).join('');rows.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>setSub(b))}async function setSub(b){const on=b.dataset.active==='1',msg=on?'تفعيل اشتراك نافس لهذا الحساب لمدة سنة؟':'إيقاف اشتراك نافس لهذا الحساب؟';if(!confirm(msg))return;b.disabled=true;const {error}=await db.rpc('owner_set_nafs_subscription',{p_user_id:b.dataset.id,p_active:on,p_days:365});if(error)alert('تعذر تنفيذ العملية: '+error.message);await load()}document.getElementById('q').oninput=draw;document.getElementById('refresh').onclick=load;load();</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اشتراكات نافس | لوحة المالك</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial}.wrap{max-width:1050px;margin:auto;padding:24px 16px 40px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.head h1{font-size:32px;margin:0 0 6px}.head p{margin:0;color:#667085}.back{color:#5538c8;text-decoration:none;font-weight:900;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat,.card,.tools,.login{background:#fff;border:1px solid #dfe6ef;border-radius:18px;box-shadow:0 4px 14px rgba(28,39,60,.04)}.stat{padding:16px}.stat b{display:block;font-size:28px}.stat span{color:#667085;font-weight:700}.tools{display:flex;gap:10px;padding:12px;margin-bottom:16px}.tools input,.login input,.inlineField input,.inlineField select{width:100%;padding:12px 13px;border:1px solid #d7deea;border-radius:11px;font:inherit;background:#fff}.btn{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:900;cursor:pointer}.purple{background:#5538c8;color:#fff}.cards{display:grid;gap:14px}.card{overflow:hidden}.cardHead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;background:#fbfcff;border-bottom:1px solid #edf1f5}.teacher{font-size:20px;font-weight:900}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900}.on{background:#dcfce7;color:#166534}.off{background:#f1f3f6;color:#667085}.paid{background:#e8f1ff;color:#174ea6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px 18px}.item{padding:13px 0;border-bottom:1px solid #edf1f5}.item:nth-child(odd){padding-left:18px;border-left:1px solid #edf1f5}.item:nth-child(even){padding-right:18px}.label{display:block;color:#7b8498;font-size:12px;font-weight:800;margin-bottom:4px}.value{font-weight:800;overflow-wrap:anywhere}.actions{display:flex;gap:8px;padding:14px 18px}.actions .btn{flex:1}.edit{background:#eef2ff;color:#4338ca}.activate{background:#e9f8ef;color:#167044}.stop{background:#fff0f0;color:#b42318}.inlineEdit{display:none;background:#fafbff;border-top:1px solid #e6eaf1;padding:16px 18px}.inlineEdit.show{display:block}.inlineGrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}.inlineField label{display:block;font-size:12px;font-weight:900;color:#667085;margin:0 0 6px}.inlineActions{display:flex;gap:8px;margin-top:12px}.save{background:#5538c8;color:#fff}.cancel{background:#eef1f5;color:#344054}.empty{text-align:center;padding:30px;background:#fff;border-radius:18px;color:#667085}.login{max-width:460px;margin:40px auto;padding:18px;display:none}.login h2{margin-top:0}.login label{display:block;font-weight:800;margin:9px 0 6px}.login .msg{margin-top:10px;color:#b42318;font-weight:700}.version{font-size:11px;color:#98a2b3;margin-top:8px}@media(max-width:700px){.head{display:block}.back{display:inline-block;margin-top:10px}.stats{grid-template-columns:repeat(3,1fr)}.tools{flex-direction:column}.grid{grid-template-columns:1fr}.item:nth-child(odd),.item:nth-child(even){padding:12px 0;border-left:0}.inlineGrid{grid-template-columns:1fr}.actions{flex-direction:column}}@media(max-width:430px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.head h1{font-size:27px}}</style></head><body><div class="wrap"><div class="head"><div><h1>اشتراكات نافس</h1><p>إدارة المشتركين وبيانات الدفع والتفعيل من صفحة واحدة.</p><div class="version">نسخة نافس الإدارية 2026-10-04-inline</div></div><a class="back" href="admin.html">← لوحة المالك</a></div><section id="loginBox" class="login"><h2>دخول مالك نافس</h2><p>هذه اللوحة مرتبطة بقاعدة بيانات نافس مباشرة.</p><label>البريد الإلكتروني</label><input id="ownerEmail" type="email"><label>كلمة المرور</label><input id="ownerPassword" type="password"><button id="ownerLogin" class="btn purple" style="width:100%;margin-top:12px">تسجيل الدخول</button><div id="loginMsg" class="msg"></div></section><main id="panel" style="display:none"><div class="stats"><div class="stat"><b id="total">0</b><span>الاشتراكات</span></div><div class="stat"><b id="active">0</b><span>اشتراك فعّال</span></div><div class="stat"><b id="paid">0</b><span>مدفوع</span></div></div><div class="tools"><input id="q" placeholder="بحث بالاسم أو البريد أو الجوال أو الفاتورة"><button id="refresh" class="btn purple">تحديث</button></div><div id="cards" class="cards"></div></main></div><script>const db=supabase.createClient('https://cixwjisioawswnnwwswf.supabase.co','sb_publishable_g9JTqjUOCtU4qBzGBftFcg_7ZMtGVm-',{auth:{storageKey:'nafs-owner-admin',persistSession:true,autoRefreshToken:true}});const names={math:'الرياضيات',science:'العلوم',arabic:'لغتي / اللغة العربية'};let all=[];const $=id=>document.getElementById(id),esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML},fmt=x=>x?new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(x)):'—';async function ensure(){const s=(await db.auth.getSession()).data.session;if(!s){$('loginBox').style.display='block';$('panel').style.display='none';return}$('loginBox').style.display='none';$('panel').style.display='block';load()}async function load(){$('cards').innerHTML='<div class="empty">جاري تحميل الاشتراكات...</div>';const {data,error}=await db.rpc('owner_nafs_subscriptions');if(error){$('cards').innerHTML='<div class="empty">تعذر التحميل. تأكد أنك داخل بحساب مالك نافس.<br>'+esc(error.message)+'</div>';return}all=data||[];draw()}function draw(){const q=$('q').value.trim().toLowerCase(),a=all.filter(x=>!q||[x.teacher_name,x.email,x.phone,names[x.subject_code],x.payment_order_number].join(' ').toLowerCase().includes(q));$('total').textContent=all.length;$('active').textContent=all.filter(x=>x.status==='active'&&(!x.ends_at||new Date(x.ends_at)>new Date())).length;$('paid').textContent=all.filter(x=>x.payment_status==='paid').length;$('cards').innerHTML=a.length?a.map(x=>{const active=x.status==='active'&&(!x.ends_at||new Date(x.ends_at)>new Date()),paid=x.payment_status==='paid',id=esc(x.user_id);return `<article class="card" data-card="${id}"><div class="cardHead"><div class="teacher">${esc(x.teacher_name||'بدون اسم')}</div><div class="tags"><span class="tag ${active?'on':'off'}">${active?'فعّال':'غير فعّال'}</span>${paid?'<span class="tag paid">مدفوع</span>':''}</div></div><div class="grid"><div class="item"><span class="label">البريد</span><div class="value">${esc(x.email||'—')}</div></div><div class="item"><span class="label">الجوال</span><div class="value">${esc(x.phone||'—')}</div></div><div class="item"><span class="label">المادة</span><div class="value">${esc(names[x.subject_code]||x.subject_code||'—')}</div></div><div class="item"><span class="label">بداية الاشتراك</span><div class="value">${fmt(x.starts_at)}</div></div><div class="item"><span class="label">انتهاء الاشتراك</span><div class="value">${fmt(x.ends_at)}</div></div><div class="item"><span class="label">المبلغ</span><div class="value">${paid?esc(String(x.amount_sar||0))+' ريال':'—'}</div></div><div class="item"><span class="label">رقم الفاتورة</span><div class="value">${esc(x.payment_order_number||'—')}</div></div><div class="item"><span class="label">وقت الدفع</span><div class="value">${fmt(x.paid_at)}</div></div></div><div class="actions"><button class="btn edit" data-edit="${id}">تعديل البيانات هنا</button><button class="btn ${active?'stop':'activate'}" data-sub="${id}" data-active="${active?'0':'1'}">${active?'إيقاف الاشتراك':'تفعيل سنة'}</button></div><div class="inlineEdit" id="edit-${id}"><div class="inlineGrid"><div class="inlineField"><label>الاسم</label><input data-name value="${esc(x.teacher_name||'')}"></div><div class="inlineField"><label>رقم الجوال</label><input data-phone inputmode="numeric" maxlength="10" placeholder="05xxxxxxxx" value="${esc(x.phone||'')}"></div><div class="inlineField"><label>المادة</label><select data-subject><option value="math" ${x.subject_code==='math'?'selected':''}>الرياضيات</option><option value="science" ${x.subject_code==='science'?'selected':''}>العلوم</option><option value="arabic" ${x.subject_code==='arabic'?'selected':''}>لغتي / اللغة العربية</option></select></div></div><div class="inlineActions"><button class="btn save" data-save="${id}">حفظ التعديل</button><button class="btn cancel" data-cancel="${id}">إلغاء</button></div></div></article>`}).join(''):'<div class="empty">لا توجد اشتراكات.</div>';$('cards').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>toggleEdit(b.dataset.edit,true));$('cards').querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>toggleEdit(b.dataset.cancel,false));$('cards').querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveInline(b));$('cards').querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>setSub(b))}function toggleEdit(id,on){document.querySelectorAll('.inlineEdit.show').forEach(e=>e.classList.remove('show'));if(on){const e=document.getElementById('edit-'+id);if(e){e.classList.add('show');e.scrollIntoView({behavior:'smooth',block:'nearest'})}}}async function saveInline(b){const id=b.dataset.save,box=document.getElementById('edit-'+id),phone=box.querySelector('[data-phone]').value.trim(),name=box.querySelector('[data-name]').value.trim(),subject=box.querySelector('[data-subject]').value;if(phone&&!/^05\d{8}$/.test(phone))return alert('رقم الجوال يجب أن يكون 10 أرقام ويبدأ بـ 05');b.disabled=true;b.textContent='جاري الحفظ...';const {error}=await db.rpc('owner_update_nafs_profile',{p_user_id:id,p_teacher_name:name,p_subject_code:subject,p_phone:phone});if(error){b.disabled=false;b.textContent='حفظ التعديل';return alert(error.message)}await load()}async function setSub(b){const on=b.dataset.active==='1';if(!confirm(on?'تفعيل الاشتراك لمدة سنة؟':'إيقاف الاشتراك؟'))return;b.disabled=true;const {error}=await db.rpc('owner_set_nafs_subscription',{p_user_id:b.dataset.sub,p_active:on,p_days:365});if(error)alert(error.message);load()}$('ownerLogin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('ownerEmail').value.trim(),password:$('ownerPassword').value});$('loginMsg').textContent=error?'تعذر الدخول. استخدم حساب مالك نافس.':'';if(!error)ensure()};$('refresh').onclick=load;$('q').oninput=draw;ensure();</script></body></html>

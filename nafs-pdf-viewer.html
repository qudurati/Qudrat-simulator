<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>عرض تقرير نافس</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef1f5;font-family:Tahoma,Arial}.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dfe3ea;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bar b{font-size:15px;margin-left:auto}.bar button{border:0;border-radius:9px;padding:9px 13px;background:#edf0f5;color:#344054;font:inherit;font-weight:700;cursor:pointer}.bar .primary{background:#24594b;color:#fff}.bar .share{background:#5538c8;color:#fff}.stage{padding:12px;display:flex;justify-content:center}.sheet{width:min(100%,794px);aspect-ratio:210/297;background:#fff;box-shadow:0 2px 12px #0002;overflow:hidden}.sheet img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}.msg{padding:40px;text-align:center;color:#667085}@media(max-width:600px){.stage{padding:7px}.sheet{width:100%}.bar{justify-content:center}.bar b{width:100%;margin:0;text-align:center}.bar button{flex:1;min-width:90px;padding:9px 7px;font-size:13px}}</style></head><body><div class="bar"><b>تقرير نافس — PDF</b><button id="back">رجوع</button><button id="print" class="primary">طباعة PDF</button><button id="download">حفظ في الملفات</button><button id="share" class="share">مشاركة PDF</button></div><main class="stage"><div class="sheet"><img id="page" alt="تقرير نافس"></div></main><script>const img=document.getElementById('page'),data=sessionStorage.getItem('nafsPdfPreviewImage'),ret=sessionStorage.getItem('nafsReturnPath')||'nafs.html',name='تقرير-نافس.pdf';let pdfBlob=null,pdfUrl=null;function makePdf(){if(pdfBlob||!data||!window.jspdf)return pdfBlob;const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});pdf.addImage(data,'JPEG',0,0,210,297,undefined,'FAST');pdfBlob=pdf.output('blob');pdfUrl=URL.createObjectURL(pdfBlob);return pdfBlob}function file(){const b=makePdf();return b?new File([b],name,{type:'application/pdf'}):null}function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1}if(!data){document.querySelector('.sheet').innerHTML='<div class="msg">انتهت معاينة التقرير. ارجع وأنشئ التقرير مرة أخرى.</div>'}else{img.src=data;img.onload=()=>makePdf()}document.getElementById('back').onclick=()=>location.href=ret;document.getElementById('download').onclick=async()=>{const f=file();if(!f)return alert('تعذر إنشاء ملف PDF');try{if(isIOS()&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'حفظ تقرير نافس'});return}const a=document.createElement('a');a.href=pdfUrl;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();if(isIOS())setTimeout(()=>window.open(pdfUrl,'_blank'),250)}catch(e){if(e&&e.name!=='AbortError')window.open(pdfUrl,'_blank')}};document.getElementById('print').onclick=()=>{const b=makePdf();if(!b)return alert('تعذر إنشاء ملف PDF');window.open(pdfUrl,'_blank')};document.getElementById('share').onclick=async()=>{const f=file();if(!f)return alert('تعذر إنشاء ملف PDF');try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'تقرير نافس'})}else{window.open(pdfUrl,'_blank')}}catch(e){if(e&&e.name!=='AbortError')window.open(pdfUrl,'_blank')}};window.addEventListener('beforeunload',()=>{if(pdfUrl)URL.revokeObjectURL(pdfUrl)});</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>عرض تقرير نافس</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef1f5;font-family:Tahoma,Arial}.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dfe3ea;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}.bar b{font-size:15px}.bar button{border:0;border-radius:9px;padding:9px 14px;background:#edf0f5;color:#344054;font:inherit;font-weight:700}.stage{padding:12px;display:flex;justify-content:center}.sheet{width:min(100%,794px);aspect-ratio:210/297;background:#fff;box-shadow:0 2px 12px #0002;overflow:hidden}.sheet img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}@media(max-width:600px){.stage{padding:7px}.sheet{width:100%}}</style></head><body><div class="bar"><b>تقرير نافس — A4</b><button onclick="history.back()">رجوع</button></div><main class="stage"><div class="sheet"><img id="page" alt="تقرير نافس"></div></main><script>const img=document.getElementById('page'),data=sessionStorage.getItem('nafsPdfPreviewImage');if(!data){document.querySelector('.sheet').innerHTML='<div style="padding:40px;text-align:center">انتهت معاينة التقرير. ارجع وأنشئ التقرير مرة أخرى.</div>'}else img.src=data;</script></body></html>

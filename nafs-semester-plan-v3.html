<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الفصلية | نافس</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/nafs-semester-science-notes.js?v=20261005-1"></script><style>html,body,#plan{margin:0;width:100%;height:100%;border:0;background:#f5f7fb}body{overflow:hidden;visibility:hidden}</style></head><body><iframe id="plan" src="/nafs-semester-plan-v2.html?v=20261005-variednotes"></iframe><script>const U='https://cixwjisioawswnnwwswf.supabase.co',K='sb_publishable_g9JTqjUOCtU4qBzGBftFcg_7ZMtGVm-',db=supabase.createClient(U,K,{auth:{storageKey:'nafs-auth',persistSession:true,autoRefreshToken:true}}),f=document.getElementById('plan');const D=['١٢–١٧ ربيع الأول','٢٤–٢٨ ربيع الأول','٢–٦ ربيع الآخر','٩–١١ ربيع الآخر','١٦–٢١ ربيع الآخر','٢٣–٢٧ ربيع الآخر','٣٠ ربيع الآخر – ٤ جمادى الأولى','٧–١١ جمادى الأولى','١٤–١٨ جمادى الأولى','٢١–٢٥ جمادى الأولى','٢٨ جمادى الأولى – ٢ جمادى الآخرة','٥–٩ جمادى الآخرة','١٩–٢٣ جمادى الآخرة','٢٦ جمادى الآخرة – ١ رجب','٤–٨ رجب','١١–١٥ رجب','١٨–٢٣ رجب','٢٥–٢٩ رجب'];const pick=(a,w)=>a[w%a.length];function noteFor(list,subject,week){const t=list.join(' ');if(subject==='reading')return pick(['قراءة نصوص قصيرة ومتنوعة وتطبيق المهارات المستهدفة عليها مع تغذية راجعة مباشرة.','تدريب فردي وتعاوني من خلال نصوص جديدة وأسئلة متدرجة في مستوى التفكير.','تنويع النصوص والأسئلة ومناقشة طرق الوصول إلى الإجابة والتحقق منها.'],week);if(subject==='math')return pick(['حل مسائل متنوعة فرديًا وتعاونيًا مع مناقشة استراتيجيات الحل والتحقق من النتائج.','تطبيق المهارات في مسائل متدرجة ومواقف حياتية مع عرض أكثر من طريقة للحل.','استخدام نماذج ورسوم وأمثلة عملية لتوضيح المهارات ثم تدريب قصير مستقل.'],week);if(subject==='science'){if(typeof window.NAFS_SCIENCE_NOTE==='function')return window.NAFS_SCIENCE_NOTE(list,week);return 'تطبيق المهارات من خلال مواقف علمية متنوعة مع المناقشة والتفسير والاستدلال بالأدلة.'}return 'تدريب متنوع على المهارات المستهدفة باستخدام أمثلة وتطبيقات مناسبة مع المناقشة والتغذية الراجعة.'}const accessReady=(async()=>{try{const{data:{session}}=await db.auth.getSession();if(!session){location.replace('/nafs.html');return null}const{data,error}=await db.rpc('get_nafs_access');const a=!error&&data&&data[0];if(!a||a.active!==true||(!a.subject_code&&a.is_owner!==true)){location.replace('/nafs.html');return null}return a}catch(e){location.replace('/nafs.html');return null}})();f.addEventListener('load',async()=>{const a=await accessReady;if(!a)return;try{const w=f.contentWindow,d=f.contentDocument,teacher=a.teacher_name||'',subjectCode=a.subject_code||'',isOwner=a.is_owner===true,map={math:'math',science:'science',arabic:'reading'},wanted=map[subjectCode];const lockTeacher=()=>{const x=d.getElementById('teacher');if(x&&teacher){x.value=teacher;x.readOnly=true;x.style.background='#f2f4f7'}};const lockGrade=()=>{const g=d.getElementById('grade');if(!g||isOwner||subjectCode!=='science')return;const x=[...g.options].find(o=>o.value==='g3');if(x)x.remove();if(![...g.options].some(o=>o.value===g.value))g.value='g6'};const lockSubject=()=>{lockGrade();const s=d.getElementById('subject');if(!s)return;if(isOwner){s.disabled=false;return}if(wanted&&[...s.options].some(o=>o.value===wanted)){s.value=wanted;s.disabled=true;s.style.background='#f2f4f7'}else{s.selectedIndex=-1;s.disabled=true}};const patch=()=>{if(typeof w.skills!=='function'||typeof w.loadSubjects!=='function')return setTimeout(patch,80);lockTeacher();lockGrade();lockSubject();const p=d.getElementById('principal');if(p)p.placeholder='اكتب اسم الإدارة المدرسية';d.querySelectorAll('label').forEach(l=>{if(l.textContent.trim()==='اسم المعلمة')l.textContent='الاسم';if(l.textContent.trim()==='مديرة المدرسة')l.textContent='الإدارة المدرسية'});const green=d.getElementById('pdfBtn');if(green)green.style.display='none';const back=d.querySelector('a.back');if(back){back.removeAttribute('href');back.onclick=e=>{e.preventDefault();window.top.location.replace('/nafs.html')}}function build18(){lockTeacher();lockGrade();lockSubject();const sk=w.skills(),groups=Array.from({length:18},()=>[]),subject=d.getElementById('subject')?.value||wanted||'reading';sk.forEach((s,i)=>groups[i%18].push(s));let h='';for(let week=0;week<18;week++){const list=groups[week],content=list.length?'التدريب على المهارات: '+list.map((s,j)=>`${j+1}) ${s}`).join(' • '):'مراجعة وتثبيت المهارات السابقة',note=noteFor(list,subject,week);h+=`<tr><td class="wk">${week+1}</td><td class="date">${D[week]}</td><td>${content}</td><td class="note">${note}</td></tr>`}d.getElementById('rows').innerHTML=h}w.build=build18;const actions=d.querySelector('.actions');if(actions&&!d.getElementById('portraitTestBtn')){const t=d.createElement('button');t.className='btn';t.id='portraitTestBtn';t.textContent='عرض التقرير';t.style.background='#7c3aed';t.onclick=()=>{build18();alert('تم تحديث الخطة. استخدم عرض التقرير.')};actions.prepend(t)}if(typeof w.loadSubjects==='function')w.loadSubjects();lockSubject();setTimeout(build18,50);document.body.style.visibility='visible'};patch()}catch(e){console.error(e);location.replace('/nafs.html')}});</script></body></html>

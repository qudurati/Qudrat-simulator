<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الفصلية | نافس</title><style>html,body,#core{margin:0;width:100%;height:100%;border:0;background:#f5f7fb}body{overflow:hidden}</style></head><body><iframe id="core" src="/nafs-semester-plan-v3-core.html?v=20261005-labels1"></iframe><script>(()=>{const core=document.getElementById('core');function patch(){try{const cd=core.contentDocument;if(!cd)return;const plan=cd.getElementById('plan');if(!plan||!plan.contentDocument)return;const d=plan.contentDocument,w=plan.contentWindow,g=d.getElementById('grade');if(!g)return;let st=d.getElementById('iphone-select-normalize');if(!st){st=d.createElement('style');st.id='iphone-select-normalize';st.textContent='select{width:100%!important;height:46px!important;min-height:46px!important;font-size:16px!important;color:#111827!important;-webkit-text-fill-color:#111827!important;line-height:normal!important}';d.head.appendChild(st)}const fixDates=()=>{const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(n.nodeValue&&n.nodeValue.includes('١٢–١٧ ربيع الأول'))n.nodeValue=n.nodeValue.replaceAll('١٢–١٧ ربيع الأول','١٧–٢١ ربيع الأول')}};const fixLabels=()=>{const s=d.getElementById('subject');if(s){const r=s.querySelector('option[value="reading"]');if(r)r.textContent='لغتي';const sc=s.querySelector('option[value="science"]');if(sc)sc.textContent='العلوم'}const g9=g.querySelector('option[value="g9"]');if(g9)g9.textContent='الصف الثالث متوسط'};const addGrade=(code,label,before)=>{if(!g.querySelector('option[value="'+code+'"]')){const o=d.createElement('option');o.value=code;o.textContent=label;const b=g.querySelector('option[value="'+before+'"]');g.insertBefore(o,b||null)}};const ready=()=>{if(w.NAFS_MS?.math?.g4&&w.NAFS_READING?.g4)addGrade('g4','الصف الرابع الابتدائي','g5');if(w.NAFS_MS?.math?.g5&&w.NAFS_READING?.g5)addGrade('g5','الصف الخامس الابتدائي','g6');fixDates();fixLabels()};const load=(id,src,done)=>{let s=d.getElementById(id);if(s)return;s=d.createElement('script');s.id=id;s.src=src;s.onload=()=>{done&&done()};d.head.appendChild(s)};load('nafs-g4-semester-data','/nafs-g4-data.js?v=20261005-g4-safe1',()=>{load('nafs-g5-semester-data','/nafs-g5-data.js?v=20261005-g5-safe2',()=>{ready();if(typeof w.loadSubjects==='function'&&['g4','g5'].includes(g.value)){w.loadSubjects();fixLabels()}});ready();if(typeof w.loadSubjects==='function'&&g.value==='g4'){w.loadSubjects();fixLabels()}});load('nafs-g5-semester-data','/nafs-g5-data.js?v=20261005-g5-safe2',()=>{ready();if(typeof w.loadSubjects==='function'&&g.value==='g5'){w.loadSubjects();fixLabels()}});ready();setTimeout(()=>{fixDates();fixLabels()},100);setTimeout(()=>{fixDates();fixLabels()},500)}catch(e){console.error(e)}}core.addEventListener('load',()=>{setTimeout(patch,150);setTimeout(patch,500);setTimeout(patch,1200)});setInterval(patch,1500)})();</script></body></html>

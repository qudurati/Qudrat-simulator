<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الفصلية | نافس</title><style>html,body,#plan{margin:0;width:100%;height:100%;border:0;background:#f5f7fb}body{overflow:hidden}</style></head><body><iframe id="plan" src="nafs-semester-plan-v2.html?v=portrait-premium"></iframe><script>const f=document.getElementById('plan');f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;const patch=()=>{if(typeof w.build!=='function'||typeof w.pdfPage!=='function'||typeof w.loadScript!=='function')return setTimeout(patch,50);const oldBuild=w.build;w.build=function(){oldBuild();const h=d.getElementById('heading');if(h){const bs=h.querySelectorAll('b');if(bs.length){const grade=d.getElementById('grade')?.selectedOptions?.[0]?.text||'';bs[0].textContent=grade;}}};const oldPdf=w.pdfPage;w.pdfPage=function(a,b){const box=oldPdf(a,b);const table=box.querySelector('table');if(table){table.style.fontSize='14px';table.querySelectorAll('th,td').forEach(c=>{c.style.padding='2.5px 5px';c.style.lineHeight='1.15';});}const content=box.firstElementChild;if(content)content.style.height='674px';return box;};w.exportPDF=async function(){const b=d.getElementById('pdfBtn');let host;try{b.disabled=true;b.textContent='جاري تصدير PDF...';w.build();if(!w.html2canvas)await w.loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');if(!w.jspdf)await w.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');host=d.createElement('div');host.style.cssText='position:absolute;left:-12000px;top:0';d.body.appendChild(host);const pdf=new w.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true}),ranges=[[0,9],[9,18]];for(let p=0;p<2;p++){const page=w.pdfPage(...ranges[p]);host.innerHTML='';host.appendChild(page);await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));const cv=await w.html2canvas(page,{scale:1.5,useCORS:true,backgroundColor:'#fff',logging:false,width:1120,height:760,windowWidth:1120,windowHeight:760});if(p)pdf.addPage('a4','landscape');pdf.addImage(cv.toDataURL('image/jpeg',.94),'JPEG',5,5,287,195,undefined,'FAST')}const blob=pdf.output('blob');const url=URL.createObjectURL(blob);window.top.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),300000)}catch(e){console.error(e);alert('تعذر تصدير ملف PDF. أعد المحاولة.')}finally{host?.remove();b.disabled=false;b.textContent='تصدير PDF'}};const actions=d.querySelector('.actions');const btn=d.getElementById('pdfBtn');if(btn)btn.textContent='تصدير PDF';if(actions&&!d.getElementById('portraitTestBtn')){const t=d.createElement('button');t.className='btn';t.id='portraitTestBtn';t.textContent='تجريب PDF عمودي';t.style.background='#7c3aed';t.onclick=async()=>{let host;try{t.disabled=true;t.textContent='جاري تصدير PDF عمودي...';w.build();if(!w.html2canvas)await w.loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');if(!w.jspdf)await w.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');host=d.createElement('div');host.style.cssText='position:absolute;left:-12000px;top:0';d.body.appendChild(host);const pdf=new w.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});const src=w.pdfPage(0,18);src.style.width='760px';src.style.height='1080px';src.style.padding='7px 12px 43px';src.style.background='#fff';src.style.borderTop='7px solid #176b70';src.style.boxSizing='border-box';const content=src.firstElementChild;if(content){content.style.height='1018px';content.style.padding='0 2px';const heads=content.querySelectorAll('h1,h2,h3');heads.forEach((x,i)=>{x.style.margin=i===0?'1px 0 2px':'1px 0';x.style.lineHeight='1.25'});const title=content.querySelector('h2');if(title){title.style.color='#176b70';title.style.fontSize='21px';title.style.fontWeight='800';title.style.letterSpacing='.1px'}const table=content.querySelector('table');if(table){table.style.width='100%';table.style.tableLayout='fixed';table.style.fontSize='9.35px';table.style.borderCollapse='separate';table.style.borderSpacing='0';table.style.border='1px solid #9fb1b4';table.style.borderRadius='5px';table.style.overflow='hidden';const rows=table.querySelectorAll('tr');rows.forEach((r,i)=>{r.style.height=i===0?'27px':'47px';if(i>0)r.style.background=i%2===0?'#f3f8f7':'#ffffff'});table.querySelectorAll('th').forEach(c=>{c.style.background='#176b70';c.style.color='#fff';c.style.fontWeight='800';c.style.fontSize='10.4px';c.style.padding='4px 3px';c.style.borderLeft='1px solid rgba(255,255,255,.28)';c.style.borderBottom='2px solid #d2a85c'});table.querySelectorAll('td').forEach(c=>{c.style.padding='3px 4px';c.style.lineHeight='1.4';c.style.verticalAlign='middle';c.style.overflow='hidden';c.style.whiteSpace='normal';c.style.borderLeft='1px solid #c6d0d2';c.style.borderBottom='1px solid #c6d0d2';c.style.color='#243238'});table.querySelectorAll('tr').forEach((r,i)=>{const cells=r.children;if(cells[0]){cells[0].style.width='4.5%';if(i>0){cells[0].style.color='#176b70';cells[0].style.fontWeight='900';cells[0].style.fontSize='11px';cells[0].style.background=i%2===0?'#e8f3f1':'#eef7f5'}}if(cells[1]){cells[1].style.width='18.5%';if(i>0){cells[1].style.fontWeight='700';cells[1].style.color='#33474c'}}if(cells[2])cells[2].style.width='52%';if(cells[3]){cells[3].style.width='25%';if(i>0){cells[3].style.color='#7a5728';cells[3].style.background=i%2===0?'#fbf8f1':'#fffdf8'}}});}}const sig=src.lastElementChild;if(sig){sig.style.bottom='4px';sig.style.right='12px';sig.style.left='12px';sig.style.padding='6px 18px 1px';sig.style.fontSize='11px';sig.style.fontWeight='800';sig.style.borderTop='2px solid #176b70';sig.style.color='#263238';sig.style.background='#f7faf9'}host.innerHTML='';host.appendChild(src);await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));const cv=await w.html2canvas(src,{scale:1.6,useCORS:true,backgroundColor:'#fff',logging:false,width:760,height:1080,windowWidth:760,windowHeight:1080});pdf.addImage(cv.toDataURL('image/jpeg',.97),'JPEG',5,5,200,287,undefined,'FAST');const blob=pdf.output('blob');const url=URL.createObjectURL(blob);window.top.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),300000)}catch(e){console.error(e);alert('تعذر تصدير PDF العمودي.')}finally{host?.remove();t.disabled=false;t.textContent='تجريب PDF عمودي'}};actions.prepend(t)}w.build();};patch();});</script></body></html>

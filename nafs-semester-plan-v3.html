db.auth.getSession();if(!session){location.replace('/nafs.html');return null}const{data,error}=await db.rpc('get_nafs_access');const a=!error&&data&&data[0];if(!a||a.active!==true||!a.subject_code){location.replace('/nafs.html');return null}return a}catch(e){location.replace('/nafs.html');return null}})();f.addEventListener('load',async()=>{const a=await accessReady;if(!a)return;try{const w=f.contentWindow,d=f.contentDocument,teacher=a.teacher_name||'',subjectCode=a.subject_code||'',isOwner=a.is_owner===true,map={math:'math',science:'science',arabic:'reading'},wanted=map[subjectCode];const lockTeacher=()=>{const x=d.getElementById('teacher');if(x&&teacher){x.value=teacher;x.readOnly=true;x.style.background='#f2f4f7'}};const lockGrade=()=>{const g=d.getElementById('grade');if(!g)return;if(!g.querySelector('option[value="g5"]')){const o=d.createElement('option');o.value='g5';o.textContent='الصف الخامس الابتدائي';const g6=g.querySelector('option[value="g6"]');g.insertBefore(o,g6||null)}if(isOwner||subjectCode!=='science')return;const x=[...g.options].find(o=>o.value==='g3');if(x)x.remove();if(![...g.options].some(o=>o.value===g.value))g.value='g6'};const lockSubject=()=>{const s=d.getElementById('subject');if(!s||!wanted||isOwner)return;const op=[...s.options].find(o=>o.value===wanted);if(op){s.value=wanted;s.disabled=true}};const rebuild=()=>{try{const grade=d.getElementById('grade')?.value,subject=d.getElementById('subject')?.value;if(!grade||!subject)return;const rows=d.getElementById('rows');if(!rows)return;const sk=typeof w.skills==='function'?w.skills():[];const reserved=new Set([0,2,3,15,17]),training=[];for(let i=0;i<18;i++)if(!reserved.has(i))training.push(i);const groups=typeof w.distributeSkills==='function'?w.distributeSkills(sk,training.length):[],byWeek={};training.forEach((ww,j)=>byWeek[ww]=groups[j]);let h='';for(let i=0;i<18;i++){let c,n;if(i===0){c='تطبيق الاختبار التشخيصي لنواتج التعلم وتحليل نتائجه لترتيب أولويات المعالجة';n='إعداد الطلاب والتعريف ب

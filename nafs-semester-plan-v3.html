<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الفصلية | نافس</title><style>html,body,#core{margin:0;width:100%;height:100%;border:0;background:#f5f7fb}body{overflow:hidden}</style></head><body><iframe id="core" src="/nafs-semester-plan-v3-core.html?v=20261005-calendar-fix2"></iframe><script>(()=>{const core=document.getElementById('core');const western=['١٧–٢١ ربيع الأول','٢٤–٢٨ ربيع الأول','٢–٦ ربيع الآخر','٩–١١ ربيع الآخر','١٦–٢١ ربيع الآخر','٢٣–٢٧ ربيع الآخر','٣٠ ربيع الآخر – ٤ جمادى الأولى','٧–١١ جمادى الأولى','١٤–١٨ جمادى الأولى','٢١–٢٥ جمادى الأولى','٢٨ جمادى الأولى – ٢ جمادى الآخرة','٥–٩ جمادى الآخرة','١٩–٢٣ جمادى الآخرة','٢٦ جمادى الآخرة – ١ رجب','٤–٨ رجب','١١–١٥ رجب','١٨–٢٣ رجب','٢٥–٢٩ رجب'];const general=['١٠–١٤ ربيع الأول','١٧–٢١ ربيع الأول','٢٤–٢٨ ربيع الأول','٢–٦ ربيع الآخر','٩–١٣ ربيع الآخر','١٦–٢٠ ربيع الآخر','٢٣–٢٧ ربيع الآخر','٣٠ ربيع الآخر – ٤ جمادى الأولى','٧–١١ جمادى الأولى','١٤–١٨ جمادى الأولى','٢١–٢٥ جمادى الأولى','٢٨ جمادى الأولى – ٢ جمادى الآخرة','٥–٩ جمادى الآخرة','١٩–٢٣ جمادى الآخرة','٢٦ جمادى الآخرة – ١ رجب','٤–٨ رجب','١١–١٥ رجب','١٨–٢٢ رجب'];function patch(){try{const cd=core.contentDocument,plan=cd?.getElementById('plan');if(!plan?.contentDocument)return;const d=plan.contentDocument,w=plan.contentWindow,g=d.getElementById('grade');if(!g)return;let st=d.getElementById('iphone-select-normalize');if(!st){st=d.createElement('style');st.id='iphone-select-normalize';st.textContent='select{width:100%!important;height:46px!important;min-height:46px!important;font-size:16px!important;color:#111827!important;-webkit-text-fill-color:#111827!important;line-height:normal!important}#report{display:none!important}';d.head.appendChild(st)}let sel=d.getElementById('calendarTrack');if(!sel){const year=d.getElementById('year');if(year?.parentElement?.parentElement){const box=d.createElement('div');box.className='full';box.style.cssText='grid-column:1/-1';box.innerHTML='<label style="display:block;margin-bottom:6px;font-weight:700">التقويم الدراسي</label><select id="calendarTrack"><option value="western">المنطقة الغربية</option><option value="general">عام</option></select>';year.parentElement.parentElement.insertBefore(box,year.parentElement);sel=box.querySelector('select')}}const applyCalendar=()=>{const s=d.getElementById('calendarTrack');if(!s)return;const arr=s.value==='general'?general:western;d.querySelectorAll('#rows tr').forEach((tr,i)=>{if(tr.children[1]&&arr[i])tr.children[1].textContent=arr[i]})};if(sel&&!sel.__calendarBound){sel.__calendarBound=true;sel.addEventListener('change',()=>{applyCalendar();setTimeout(applyCalendar,0);setTimeout(applyCalendar,50);setTimeout(applyCalendar,250)})}const rows=d.getElementById('rows');if(rows&&!rows.__calendarObserver){rows.__calendarObserver=true;new MutationObserver(()=>{if(!rows.__calendarApplying){rows.__calendarApplying=true;requestAnimationFrame(()=>{applyCalendar();rows.__calendarApplying=false})}}).observe(rows,{childList:true,subtree:true})}const fixLabels=()=>{const s=d.getElementById('subject');if(s){const r=s.querySelector('option[value="reading"]');if(r)r.textContent='لغتي';const sc=s.querySelector('option[value="science"]');if(sc)sc.textContent='العلوم'}const g9=g.querySelector('option[value="g9"]');if(g9)g9.textContent='الصف الثالث متوسط'};if(typeof w.subjects==='function'&&!w.__nafsLabelsNative){const original=w.subjects;w.subjects=function(){return original.apply(this,arguments).map(x=>x[0]==='reading'?[x[0],'لغتي']:x[0]==='science'?[x[0],'العلوم']:x)};w.__nafsLabelsNative=true;if(typeof w.loadSubjects==='function'){w.loadSubjects();fixLabels()}}const addGrade=(code,label,before)=>{if(!g.querySelector('option[value="'+code+'"]')){const o=d.createElement('option');o.value=code;o.textContent=label;const b=g.querySelector('option[value="'+before+'"]');g.insertBefore(o,b||null)}};const ready=()=>{if(w.NAFS_MS?.math?.g4&&w.NAFS_READING?.g4)addGrade('g4','الصف الرابع الابتدائي','g5');if(w.NAFS_MS?.math?.g5&&w.NAFS_READING?.g5)addGrade('g5','الصف الخامس الابتدائي','g6');fixLabels();applyCalendar()};const load=(id,src,done)=>{if(d.getElementById(id))return;const s=d.createElement('script');s.id=id;s.src=src;s.onload=()=>done&&done();d.head.appendChild(s)};load('nafs-g4-semester-data','/nafs-g4-data.js?v=20261005-g4-safe1',()=>{load('nafs-g5-semester-data','/nafs-g5-data.js?v=20261005-g5-safe2',ready);ready();if(typeof w.loadSubjects==='function'&&g.value==='g4')w.loadSubjects()});load('nafs-g5-semester-data','/nafs-g5-data.js?v=20261005-g5-safe2',()=>{ready();if(typeof w.loadSubjects==='function'&&g.value==='g5')w.loadSubjects()});ready();setTimeout(applyCalendar,100);setTimeout(applyCalendar,500)}catch(e){console.error(e)}}core.addEventListener('load',()=>{setTimeout(patch,150);setTimeout(patch,500);setTimeout(patch,1200)});setInterval(patch,700)})();</script></body></html>

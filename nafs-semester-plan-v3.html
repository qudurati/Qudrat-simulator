e='9.5px';table.style.borderCollapse='collapse';const rows=table.querySelectorAll('tr');rows.forEach((r,i)=>{r.style.height=i===0?'24px':'48px';if(i>0)r.style.backgroundColor=i%2===1?'#f1f7f7':'#ffffff'});table.querySelectorAll('th,td').forEach(c=>{c.style.padding='3px 4px';c.style.lineHeight='1.42';c.style.verticalAlign='middle';c.style.overflow='hidden';c.style.whiteSpace='normal'});table.querySelectorAll('td').forEach(c=>{c.style.fontWeight='600'});table.querySelectorAll('tr').forEach(r=>{const cells=r.children;if(cells[0])cells[0].style.width='4.5%';if(cells[1])cells[1].style.width='18.5%';if(cells[2])cells[2].style.width='52%';if(cells[3])cells[3].style.width='25%';});}}const sig=src.lastElementChild;if(sig){sig.style.bottom='4px';sig.style.right='12px';sig.style.left='12px';sig.style.padding='3px 18px 0';sig.style.fontSize='11px'}host.innerHTML='';host.appendChild(src);await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));const cv=await w.html2canvas(src,{scale:1.6,useCORS:true,backgroundColor:'#fff',logging:false,width:760,height:1080,windowWidth:760,windowHeight:1080});pdf.addImage(cv.toDataURL('image/jpeg',.97),'JPEG',5,5,200,287,undefined,'FAST');const blob=pdf.output('blob');const url=URL.createObjectURL(blob);window.top.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),300000)}catch(e){console.error(e);alert('تعذر تصدير PDF العمودي.')}finally{host?.remove();t.disabled=false;t.textContent='تجريب PDF عمودي'}};actions.prepend(t)}w.build();};patch();});</script></body></html>

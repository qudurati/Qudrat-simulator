<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الفصلية | نافس</title><style>html,body,#plan{margin:0;width:100%;height:100%;border:0;background:#f5f7fb}body{overflow:hidden}</style></head><body><iframe id="plan" src="nafs-semester-plan-v2.html?v=fontfix2"></iframe><script>const f=document.getElementById('plan');f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;const patch=()=>{if(typeof w.build!=='function'||typeof w.pdfPage!=='function')return setTimeout(patch,50);const oldBuild=w.build;w.build=function(){oldBuild();const h=d.getElementById('heading');if(h){const bs=h.querySelectorAll('b');if(bs.length){const grade=d.getElementById('grade')?.selectedOptions?.[0]?.text||'';bs[0].textContent=grade;}}};const oldPdf=w.pdfPage;w.pdfPage=function(a,b){const box=oldPdf(a,b);const table=box.querySelector('table');if(table){table.style.fontSize='14px';table.querySelectorAll('th,td').forEach(c=>{c.style.padding='2.5px 5px';c.style.lineHeight='1.15';});}const content=box.firstElementChild;if(content)content.style.height='674px';return box;};w.build();};patch();});</script></body></html>

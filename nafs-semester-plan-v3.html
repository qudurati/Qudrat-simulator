<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الفصلية | نافس</title><style>html,body,#plan{margin:0;width:100%;height:100%;border:0;background:#f5f7fb}body{overflow:hidden}</style></head><body><iframe id="plan" src="nafs-semester-plan-v2.html?v=pdf-file-1"></iframe><script>const f=document.getElementById('plan');f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;const patch=()=>{if(typeof w.build!=='function'||typeof w.pdfPage!=='function'||typeof w.loadScript!=='function')return setTimeout(patch,50);const oldBuild=w.build;w.build=function(){oldBuild();const h=d.getElementById('heading');if(h){const bs=h.querySelectorAll('b');if(bs.length){const grade=d.getElementById('grade')?.selectedOptions?.[0]?.text||'';bs[0].textContent=grade;}}};const oldPdf=w.pdfPage;w.pdfPage=function(a,b){const box=oldPdf(a,b);const table=box.querySelector('table');if(table){table.style.fontSize='14px';table.querySelectorAll('th,td').forEach(c=>{c.style.padding='2.5px 5px';c.style.lineHeight='1.15';});}const content=box.firstElementChild;if(content)content.style.height='674px';return box;};w.exportPDF=async function(){const b=d.getElementById('pdfBtn');let host;try{b.disabled=true;b.textContent='جاري إنشاء PDF...';w.build();if(!w.html2canvas)await w.loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');if(!w.jspdf)await w.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');host=d.createElement('div');host.style.cssText='position:absolute;left:-12000px;top:0';d.body.appendChild(host);const pdf=new w.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true}),ranges=[[0,9],[9,18]];for(let p=0;p<2;p++){const page=w.pdfPage(...ranges[p]);host.innerHTML='';host.appendChild(page);await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));const cv=await w.html2canvas(page,{scale:1.5,useCORS:true,backgroundColor:'#fff',logging:false,width:1120,height:760,windowWidth:1120,windowHeight:760});if(p)pdf.addPage('a4','landscape');pdf.addImage(cv.toDataURL('image/jpeg',.94),'JPEG',5,5,287,195,undefined,'FAST')}pdf.save('خطة-نافس-الفصلية.pdf')}catch(e){console.error(e);alert('تعذر إنشاء ملف PDF. أعد المحاولة.')}finally{host?.remove();b.disabled=false;b.textContent='تصدير PDF'}};const btn=d.getElementById('pdfBtn');if(btn)btn.textContent='تصدير PDF';w.build();};patch();});</script></body></html>

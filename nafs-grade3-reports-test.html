<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مختبر تقارير علوم ثالث</title><style>body{font:16px Tahoma,Arial;background:#f4f7fb;color:#172033;margin:0}.wrap{max-width:880px;margin:auto;padding:20px}.card{background:white;border:1px solid #dfe6ec;border-radius:14px;padding:20px;margin:12px 0}h1{color:#146b58}select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #bccbd2}button{background:#146b58;color:white;border:0;margin:10px 4px;cursor:pointer}.skill{line-height:1.8}.small{color:#667085;font-size:13px}.report{background:#fff;padding:25px;margin-top:16px;border:1px solid #dfe6ec}table{border-collapse:collapse;width:100%}td,th{border:1px solid #d4dce3;padding:9px;text-align:right;vertical-align:top}@media print{.controls,.small{display:none}.wrap{max-width:none;padding:0}.card{border:0;margin:0;padding:0}.report{border:0;padding:0}body{background:white}tr,.skill{break-inside:avoid}}</style></head><body><main class="wrap"><h1>مختبر معاينة تقارير علوم ثالث الابتدائي</h1><p class="small">اختبار مستقل للعرض والطباعة، لا يتصل بقاعدة المشتركين ولا يختبر محركات PDF الأصلية للموقع.</p><div class="card controls"><label>نوع التقرير <select id="kind"><option value="semester">الخطة الفصلية</option><option value="remedial">الخطة العلاجية</option><option value="sustainable">الخطة المستدامة</option></select></label> <label>الأسبوع <select id="week"><option value="0">الأسبوع 1 — الملاحظة</option><option value="1">الأسبوع 2 — المقارنة</option><option value="2">الأسبوع 3 — التصنيف</option><option value="3">الأسبوع 4 — الاستنتاج والقياس</option><option value="4">الأسبوع 5 — التوقع والتواصل العلمي</option><option value="5">الأسبوع 6 — أجزاء النباتات</option><option value="6">الأسبوع 7 — حاجات المخلوقات الحية</option><option value="7">الأسبوع 8 — التصنيف ودورات الحياة</option><option value="8">الأسبوع 9 — التكيف والتنافس</option><option value="9">الأسبوع 10 — الإسعافات الأولية</option><option value="10">الأسبوع 11 — سطح الأرض</option><option value="11">الأسبوع 12 — الطقس القاسي</option><option value="12">الأسبوع 13 — حالات المادة</option><option value="13">الأسبوع 14 — التغيرات في المادة</option><option value="14">الأسبوع 15 — خصائص المواد</option><option value="15">الأسبوع 16 — الشغل والآلات البسيطة</option><option value="16">الأسبوع 17 — الطاقة ومصادرها</option><option value="17">الأسبوع 18 — مراجعة المهارات</option></select></label><button onclick="render()">عرض التقرير</button><button onclick="window.print()">طباعة / حفظ PDF</button></div><div class="card"><div id="report" class="report"></div></div></main><script>const data=[["عمليات العلم الأساسية — الملاحظة","الملاحظة",["استخدام الحواس لجمع معلومات عن الكائنات والأشياء."]],["عمليات العلم الأساسية — المقارنة","المقارنة",["إيجاد أوجه التشابه والاختلاف بين المخلوقات الحية والأشياء غير الحية."]],["عمليات العلم الأساسية — التصنيف","التصنيف",["تجميع الأشياء أو المخلوقات الحية في مجموعات بناء على خصائص مشتركة."]],["عمليات العلم الأساسية — الاستنتاج والقياس","الاستنتاج والقياس",["التوصل إلى نتيجة أو فكرة بناء على الأدلة والملاحظات، واستخدام الأدوات البسيطة لتقدير الأطوال أو الأحجام أو الكميات."]],["عمليات العلم الأساسية — التوقع والتواصل العلمي","التوقع والتواصل العلمي",["توقع ما قد يحدث بناء على ملاحظات سابقة، وتبادل المعلومات والبيانات شفهياً أو كتابياً أو بالرسوم."]],["المخلوقات الحية والبيئة — أجزاء النباتات","أجزاء النباتات",["الربط بين أجزاء النبات ووظائفها (الجذور، الساق، الأوراق)."]],["المخلوقات الحية والبيئة — حاجات المخلوقات الحية","حاجات المخلوقات الحية",["تحديد حاجات المخلوقات الحية الأساسية للعيش (الماء، الهواء، الغذاء، المكان)."]],["المخلوقات الحية والبيئة — التصنيف ودورات الحياة","التصنيف ودورات الحياة",["التمييز بين المخلوقات الحية والأشياء غير الحية، والتعرف على دورات حياة النباتات ومقارنتها بدورة حياة الحيوانات."]],["المخلوقات الحية والبيئة — التكيف والتنافس","التكيف والتنافس",["تحديد التكيفات التي تمكن المخلوق الحي من البقاء في بيئته، وفهم التنافس بين المخلوقات الحية على الغذاء والماء وتأثير تغيرات البيئة عليها."]],["المخلوقات الحية والبيئة — الإسعافات الأولية","الإسعافات الأولية",["التعرف على مكونات حقيبة الإسعافات الأولية (صيدلية المنزل) وأهميتها."]],["الأرض والطقس والمادة — سطح الأرض","سطح الأرض",["تحديد معالم سطح الأرض وكيفية تغيرها."]],["الأرض والطقس والمادة — الطقس القاسي","الطقس القاسي",["التمييز بين عناصر حالة الطقس وأنواع الطقس القاسي ووسائل الأمن والسلامة المتعلقة بها."]],["الأرض والطقس والمادة — حالات المادة","حالات المادة",["مقارنة خواص حالات المادة الثلاث (الصلبة، السائلة، الغازية) من حيث الحجم والشكل."]],["الأرض والطقس والمادة — التغيرات في المادة","التغيرات في المادة",["الفرق بين التغيرات الفيزيائية والكيميائية للمادة مع ضرب أمثلة عليها."]],["المادة والطاقة — خصائص المواد","خصائص المواد",["ملاحظة وتصنيف المواد وخصائصها."]],["المادة والطاقة — الشغل والآلات البسيطة","الشغل والآلات البسيطة",["فهم الشغل والآلات البسيطة وأهميتها في حياتنا اليومية."]],["المادة والطاقة — الطاقة ومصادرها","الطاقة ومصادرها",["التعرف على أشكال الطاقة المختلفة ومصادرها (المتجددة وغير المتجددة)."]],["مراجعة شاملة — مراجعة المهارات","مراجعة المهارات",["مراجعة وتثبيت مهارات علوم الصف الثالث الابتدائي."]]];const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function render(){const k=document.getElementById('kind').value,w=+document.getElementById('week').value,r=data[w],title={semester:'الخطة الفصلية',remedial:'الخطة العلاجية',sustainable:'الخطة المستدامة'}[k],review=w===17,skills=review?'مراجعة وتثبيت المهارات السابقة':r[2].join('، ');let content='<h2>تقرير '+title+' — علوم ثالث الابتدائي</h2><p>الأسبوع: '+(w+1)+'</p>';if(k==='semester'){content+='<table><tr><th>الأسبوع</th><th>المجال</th><th>المهارات</th></tr>'+data.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x[0])+'</td><td>'+esc(i===17?'مراجعة وتثبيت المهارات السابقة':x[2].join('، '))+'</td></tr>').join('')+'</table>'}else{content+='<p><b>المجال:</b> '+esc(review?'مراجعة عامة':r[0])+'</p><div class="skill"><b>المهارات المستهدفة:</b> '+esc(skills)+'</div><p><b>الهدف:</b> '+(k==='remedial'?'معالجة جوانب الضعف في المهارة المحددة':'تعزيز استدامة إتقان المهارة المحددة')+'</p><p><b>الإجراءات:</b> تدريب وتطبيق ومتابعة وتغذية راجعة.</p><p><b>أدوات القياس:</b> ملاحظة الأداء وأوراق العمل والتقويم.</p><p>الاسم: .............................</p><p>الإدارة المدرسية: .............................</p>'}document.getElementById('report').innerHTML=content}render()</script></body></html>

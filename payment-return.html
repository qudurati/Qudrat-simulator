<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحقق من الدفع | محاكي القدرات</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f9fd;color:#0d2d67;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(92%,520px);background:#fff;border:1px solid #dbe7f2;border-radius:22px;padding:28px;text-align:center;box-shadow:0 8px 28px #17386612}.spinner{width:46px;height:46px;border:5px solid #dbeaf8;border-top-color:#176ec5;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:23px;margin:0 0 9px}p{color:#687995;line-height:1.7}.ok{color:#087d46}.bad{color:#b4233d}.btn{display:none;margin-top:16px;background:#164f94;color:#fff;text-decoration:none;padding:11px 18px;border-radius:11px;font-weight:800}</style></head><body><main class="box"><div id="spin" class="spinner"></div><h1 id="title">جاري التحقق من عملية الدفع</h1><p id="msg">يرجى الانتظار، لا تغلق الصفحة.</p><a id="btn" class="btn" href="dashboard.html">العودة للرئيسية</a></main><script>(async()=>{const title=document.getElementById('title'),msg=document.getElementById('msg'),spin=document.getElementById('spin'),btn=document.getElementById('btn');try{const raw=localStorage.getItem('sb-lqvfvpvyzoupdyqahwjy-auth-token'),s=raw?JSON.parse(raw):null;if(!s?.access_token){location.replace('login.html?next=dashboard');return}const r=await fetch('https://lqvfvpvyzoupdyqahwjy.supabase.co/functions/v1/rsompay-confirm-payment',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'}});const d=await r.json();spin.style.display='none';btn.style.display='inline-block';if(r.ok&&d.ok&&d.status==='paid'){title.textContent='تم الدفع وتفعيل الاشتراك';title.className='ok';msg.textContent='تم التحقق من عملية الدفع بنجاح. يمكنك الآن استخدام مزايا باقتك.';setTimeout(()=>location.replace('dashboard.html?payment=success'),1600)}else if(r.ok&&d.status==='pending'){title.textContent='عملية الدفع قيد التحقق';msg.textContent='لم يصل تأكيد الدفع بعد. يمكنك العودة للرئيسية وسيتم التفعيل تلقائيًا عند وصول التأكيد.'}else{title.textContent='تعذر تأكيد عملية الدفع';title.className='bad';msg.textContent='لم نتمكن من تأكيد الدفع الآن. إذا تم الخصم فلا تعاود الدفع؛ ارجع للرئيسية وسيتم التحقق من العملية.'}}catch(e){spin.style.display='none';btn.style.display='inline-block';title.textContent='تعذر التحقق الآن';title.className='bad';msg.textContent='إذا تم الخصم فلا تعاود الدفع. ارجع للرئيسية وسيتم التحقق من العملية.'}})();</script></body></html>

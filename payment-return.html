<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحقق من الدفع | محاكي القدرات</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f9fd;color:#0d2d67;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(92%,520px);background:#fff;border:1px solid #dbe7f2;border-radius:22px;padding:28px;text-align:center;box-shadow:0 8px 28px #17386612}.spinner{width:46px;height:46px;border:5px solid #dbeaf8;border-top-color:#176ec5;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:23px;margin:0 0 9px}p{color:#687995;line-height:1.7}.ok{color:#087d46}.wait{color:#164f94}.bad{color:#b4233d}.btn{display:none;margin-top:16px;background:#164f94;color:#fff;text-decoration:none;padding:11px 18px;border-radius:11px;font-weight:800}</style></head><body><main class="box"><div id="spin" class="spinner"></div><h1 id="title">جاري تأكيد اشتراكك</h1><p id="msg">تمت العودة من صفحة الدفع. يرجى الانتظار قليلًا حتى يكتمل التحقق، ولا تقم بإعادة الدفع.</p><a id="btn" class="btn" href="dashboard.html">العودة للرئيسية</a></main><script>(async()=>{const title=document.getElementById('title'),msg=document.getElementById('msg'),spin=document.getElementById('spin'),btn=document.getElementById('btn');const sleep=ms=>new Promise(r=>setTimeout(r,ms));const finish=(kind,t,m,href='dashboard.html')=>{spin.style.display='none';title.textContent=t;title.className=kind;msg.textContent=m;btn.href=href;btn.style.display='inline-block'};try{const raw=localStorage.getItem('sb-lqvfvpvyzoupdyqahwjy-auth-token'),s=raw?JSON.parse(raw):null;if(!s?.access_token){location.replace('login.html?next=payment-return.html');return}const headers={Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'};let last=null;for(let i=0;i<5;i++){try{const r=await fetch('https://lqvfvpvyzoupdyqahwjy.supabase.co/functions/v1/rsompay-confirm-payment',{method:'POST',headers});const d=await r.json().catch(()=>({}));last={r,d};if(r.ok&&d.ok&&d.status==='paid'){finish('ok','تم الاشتراك بنجاح ✓','تم تأكيد عملية الدفع وتفعيل باقتك. يمكنك الآن البدء باستخدام المحاكي.','dashboard.html?payment=success');setTimeout(()=>location.replace('dashboard.html?payment=success'),1800);return}if(!(r.ok&&d.status==='pending'))break}catch(e){last={error:e}}if(i<4)await sleep(1800)}/* إذا تأخر رد بوابة الدفع، افحص الاشتراك نفسه؛ فهو مصدر الحقيقة النهائي للتفعيل. */try{const r=await fetch('https://lqvfvpvyzoupdyqahwjy.supabase.co/rest/v1/subscriptions?select=status,ends_at&user_id=eq.'+encodeURIComponent(s.user.id)+'&limit=1',{headers:{Authorization:'Bearer '+s.access_token,apikey:'sb_publishable_k7EwSBL9UTaVL_Zz_oB0Mg_oRXKcQvH'}});if(r.ok){const rows=await r.json();const sub=rows&&rows[0];if(sub&&sub.status==='active'&&(!sub.ends_at||new Date(sub.ends_at)>new Date())){finish('ok','تم الاشتراك بنجاح ✓','اشتراكك مفعّل الآن. يمكنك البدء باستخدام المحاكي.','dashboard.html?payment=success');setTimeout(()=>location.replace('dashboard.html?payment=success'),1800);return}}}catch(e){}finish('wait','جاري تأكيد اشتراكك','تم استلام عودتك من صفحة الدفع، لكن تأكيد العملية قد يتأخر قليلًا. إذا تم الخصم فلا تقم بإعادة الدفع؛ عد للرئيسية وسيظهر اشتراكك فور اكتمال التفعيل.')}catch(e){finish('wait','جاري تأكيد اشتراكك','حدث تأخير مؤقت أثناء التحقق. إذا تم الخصم فلا تقم بإعادة الدفع؛ عد للرئيسية وسيظهر اشتراكك فور اكتمال التفعيل.')}})();</script></body></html>

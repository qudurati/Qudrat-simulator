<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحليل مستواي | محاكي القدرات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f8fc;color:#102a56;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}.wrap{max-width:980px;margin:28px auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.back{color:#1457a6;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #dbe6f1;border-radius:20px;padding:20px;margin-bottom:15px;box-shadow:0 6px 22px rgba(30,70,120,.05)}h1,h2{margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f7faff;border:1px solid #deebf7;border-radius:15px;padding:15px;text-align:center}.stat b{font-size:25px;display:block;margin-top:5px}.muted{color:#66758f}.skills{display:grid;gap:10px}.skill{border:1px solid #e1eaf3;border-radius:13px;padding:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.skillMeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.level{font-size:12px;font-weight:900;padding:5px 9px;border-radius:999px;background:#eef5ff;color:#245d9d}.weak{border-color:#fecaca;background:#fffafa}.weak .level{background:#fee2e2;color:#b42318}.strong{border-color:#bbf7d0;background:#f8fff9}.strong .level{background:#dcfce7;color:#166534}.bar{height:9px;background:#e8eef5;border-radius:20px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:#1769c2;border-radius:20px}.trainBtn{border:0;background:#1769c2;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;margin-top:11px}.trainBtn:disabled{opacity:.55}.history{display:flex;align-items:end;gap:8px;min-height:180px;overflow:auto;padding-top:12px}.point{min-width:54px;text-align:center}.col{height:120px;display:flex;align-items:end;justify-content:center}.col i{display:block;width:30px;background:#1769c2;border-radius:8px 8px 3px 3px;min-height:3px}.point small{display:block;margin-top:6px}.empty{text-align:center;padding:24px;color:#718096}.loading{text-align:center;padding:45px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.wrap{padding:12px;padding-top:58px}.card{padding:16px}.row{align-items:flex-start}.skillMeta{justify-content:flex-end}}</style></head><body><main class="wrap"><div class="top"><h1>تحليل مستواي</h1><a class="back" href="dashboard.html">صفحة الطالب ←</a></div><div id="loading" class="card loading">جارٍ تحليل نتائجك…</div><div id="content" hidden><section class="card"><h2>ملخص الأداء</h2><div class="stats"><div class="stat"><span class="muted">آخر درجة</span><b id="latest">—</b></div><div class="stat"><span class="muted">متوسطك</span><b id="avg">—</b></div><div class="stat"><span class="muted">أفضل درجة</span><b id="best">—</b></div><div class="stat"><span class="muted">اختبارات مكتملة</span><b id="count">—</b></div></div></section><section class="card"><h2>الكمي واللفظي</h2><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><span class="muted">متوسط الكمي</span><b id="quant">—</b></div><div class="stat"><span class="muted">متوسط اللفظي</span><b id="verbal">—</b></div></div></section><section class="card"><h2>المهارات</h2><p class="muted">يعرض التحليل مستوى إتقانك لكل مهارة فقط. يمكنك بدء تدريب مخصص للمهارات التي تحتاج تحسينًا.</p><div id="skills" class="skills"></div></section><section class="card"><h2>تطور درجاتك</h2><div id="history" class="history"></div></section></div></main><script src="home-button.js?v=1"></script><script>(async()=>{const db=window.getQudratSupabase();const {data:{session}}=await db.auth.getSession();if(!session||session.user?.is_anonymous){location.replace('login.html');return}const {data,error}=await db.rpc('my_performance_analysis');if(error){document.getElementById('loading').textContent='تعذر تحميل تحليل المستوى. حاول مرة أخرى.';return}loading.hidden=true;content.hidden=false;const s=data?.summary||{},n=v=>v==null?'—':Math.round(Number(v));latest.textContent=n(s.latest_score);avg.textContent=n(s.average_score);best.textContent=n(s.best_score);count.textContent=s.completed_attempts||0;quant.textContent=n(s.average_quantitative);verbal.textContent=n(s.average_verbal);const sk=data?.skills||[];skills.innerHTML=sk.length?sk.map(x=>{const a=Math.max(0,Math.min(100,Number(x.accuracy)||0)),cls=a<60?'weak':a>=80?'strong':'',level=a<60?'تحتاج تحسين':a>=80?'متقن':'جيد';return `<div class="skill ${cls}"><div class="row"><b>${x.skill}</b><div class="skillMeta"><span class="level">${level}</span><span>${n(a)}٪</span></div></div><div class="bar"><i style="width:${a}%"></i></div>${a<60?`<button class="trainBtn" data-skill="${x.skill_id}">تدرّب على المهارة</button>`:''}</div>`}).join(''):'<div class="empty">أكمل اختباراً ليظهر تحليل المهارات.</div>';document.querySelectorAll('.trainBtn').forEach(b=>b.onclick=async()=>{b.disabled=true;const old=b.textContent;b.textContent='جارٍ تجهيز التدريب…';const {data:t,error:e}=await db.rpc('start_weak_skill_training',{p_skill_id:Number(b.dataset.skill),p_total:10});if(e){alert('تعذر تجهيز التدريب: '+e.message);b.disabled=false;b.textContent=old;return}sessionStorage.setItem('qudrat_weak_training',JSON.stringify(t));location.href='training.html?weak=1'});const h=data?.history||[];history.innerHTML=h.length?h.map(x=>{const a=Math.max(0,Math.min(100,Number(x.score)||0)),d=x.completed_at?new Date(x.completed_at).toLocaleDateString('ar-SA',{month:'numeric',day:'numeric'}):'';return `<div class="point"><b>${n(a)}</b><div class="col"><i style="height:${a}%"></i></div><small>${d}</small></div>`}).join(''):'<div class="empty">لا توجد نتائج مكتملة بعد.</div>'})();</script></body></html>

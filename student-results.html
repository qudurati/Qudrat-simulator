<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>النتائج السابقة | محاكي القدرات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f8fc;color:#102a56;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}.wrap{max-width:1000px;margin:25px auto;padding:55px 14px 14px}.head,.card{background:#fff;border:1px solid #dbe6f1;border-radius:18px;padding:18px;margin-bottom:14px}.head h1{margin:0;font-size:25px}.sub{color:#718096;margin-top:5px}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{background:#f8fafc;color:#667085;font-size:12px;text-align:right;padding:12px 11px;border-bottom:1px solid #dbe6f1}td{padding:14px 11px;border-bottom:1px solid #edf1f5;font-size:14px}.score{font-weight:900}.pill{display:inline-block;border-radius:20px;padding:5px 9px;font-size:12px;background:#e9f8f0;color:#087443;font-weight:800}.empty{text-align:center;padding:35px;color:#718096}@media(max-width:620px){.wrap{padding:48px 10px 10px}.head{padding:16px}.head h1{font-size:22px}.card{padding:10px;background:transparent;border:0}.tableWrap{overflow:visible}table{min-width:0}thead{display:none}tbody,tr,td{display:block;width:100%}tr{background:#fff;border:1px solid #dbe6f1;border-radius:16px;padding:8px 13px;margin-bottom:12px;box-shadow:0 5px 16px rgba(22,79,148,.05)}td{display:flex;align-items:center;justify-content:space-between;gap:15px;text-align:left;padding:10px 2px;border-bottom:1px solid #edf1f5;font-size:14px}td:last-child{border-bottom:0}td::before{content:attr(data-label);font-weight:800;color:#667085;text-align:right}.score{font-size:17px}}</style></head><body><main class="wrap"><section class="head"><h1>النتائج السابقة</h1><div class="sub">نتائج محاولاتك المكتملة</div></section><section class="card"><div id="loading">جاري تحميل النتائج...</div><div class="tableWrap"><table id="resultsTable" hidden><thead><tr><th>التاريخ</th><th>الاختبار / التدريب</th><th>الإجمالي</th><th>الكمي</th><th>اللفظي</th><th>الحالة</th></tr></thead><tbody id="list"></tbody></table></div><div id="message"></div></section></main><script src="home-button.js?v=1"></script><script>(async()=>{const db=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);const {data:{session}}=await db.auth.getSession();if(!session||session.user?.is_anonymous){location.replace('login.html?next=student-results.html');return}const {data,error}=await db.from('exam_attempts').select('exam_type,completed_at,score,quantitative_score,verbal_score').eq('user_id',session.user.id).not('completed_at','is',null).order('completed_at',{ascending:false}).limit(50);document.getElementById('loading').remove();const list=document.getElementById('list'),table=document.getElementById('resultsTable'),message=document.getElementById('message');if(error){message.innerHTML='<div class="empty">تعذر تحميل النتائج.</div>';return}if(!data?.length){message.innerHTML='<div class="empty">لا توجد نتائج سابقة حتى الآن.</div>';return}const n=v=>v==null?'—':new Intl.NumberFormat('ar-SA',{maximumFractionDigits:1}).format(v)+'٪';const type=v=>({training:'تدريب قصير',quick:'تدريب قصير',short:'تدريب قصير',mock:'محاكاة كاملة',placement:'تحديد مستوى'})[v]||v||'محاكاة';const date=v=>new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v));list.innerHTML=data.map(r=>`<tr><td data-label="التاريخ">${date(r.completed_at)}</td><td data-label="الاختبار / التدريب"><b>${type(r.exam_type)}</b></td><td data-label="الإجمالي" class="score">${n(r.score)}</td><td data-label="الكمي">${n(r.quantitative_score)}</td><td data-label="اللفظي">${n(r.verbal_score)}</td><td data-label="الحالة"><span class="pill">مكتملة</span></td></tr>`).join('');table.hidden=false})();</script></body></html>

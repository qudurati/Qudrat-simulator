<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة المستدامة | نافس</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Tahoma,Arial}.wrap{max-width:960px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:22px}h1{margin:0;color:#177344}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.tab{padding:13px;text-align:center;border:1px solid #dce2ea;border-radius:11px;font-weight:700}.active{background:#218b55;color:#fff}.off{opacity:.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.f{margin-top:8px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}select,input{width:100%;padding:12px;border:1px solid #d4dbe5;border-radius:10px;background:#fff;font:inherit}.checks{border:1px solid #dbe3dd;border-radius:11px;overflow:hidden}.check{display:flex;gap:9px;padding:11px 13px;border-bottom:1px solid #edf0ee;line-height:1.65}.check input{width:auto;margin-top:6px}.actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 17px;background:#218b55;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.back{background:#edf0f5;color:#344054}.note{color:#667085;font-size:13px}.report{display:none;background:#fff;padding:0;width:1120px;min-height:1584px}.empty{padding:14px;color:#667085}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><h1>خطة نافس المستدامة</h1><div class="tabs"><div class="tab active">المهارات</div><div class="tab off">البرامج — لاحقًا</div><div class="tab off">المبادرات — لاحقًا</div></div><div class="grid"><div class="f full"><label>اسم المدرسة</label><input id="school"></div><div class="f full"><label>مديرة المدرسة</label><input id="principal"></div><div class="f full"><label>اسم المعلمة</label><input id="teacher"></div><div class="f"><label>اليوم</label><select id="day"><option>الأحد</option><option>الاثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option></select></div><div class="f"><label>التاريخ الهجري</label><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"><select id="hday"></select><select id="hmonth"><option>محرم</option><option>صفر</option><option>ربيع الأول</option><option>ربيع الآخر</option><option>جمادى الأولى</option><option>جمادى الآخرة</option><option>رجب</option><option>شعبان</option><option>رمضان</option><option>شوال</option><option>ذو القعدة</option><option>ذو الحجة</option></select><select id="hyear"><option>1447</option><option selected>1448</option><option>1449</option></select></div></div><div class="f"><label>الصف</label><select id="grade" onchange="loadSubjects()"><option value="g3">الصف الثالث الابتدائي</option><option value="g6" selected>الصف السادس الابتدائي</option><option value="g9">الصف الثالث المتوسط (التاسع)</option></select></div><div class="f"><label>المادة</label><select id="subject" onchange="loadDomains()"></select></div><div class="f full"><label>المجال</label><select id="domain" onchange="loadSubs()"></select></div><div class="f full"><label>المجال الفرعي</label><select id="sub" onchange="loadOutcomes()"></select></div><div class="f full"><label>ناتج التعلم</label><select id="outcome" onchange="loadIndicators()"></select></div><div class="f full"><label>المهارات / المؤشرات</label><div id="indicators" class="checks"></div></div><div class="f full"><label>إجراءات وأنشطة الاستدامة</label><div id="activityChoices" class="checks"></div></div><div class="f full"><label>أدوات القياس والمتابعة</label><div id="toolChoices" class="checks"></div></div></div><p class="note">اختر المهارات والأنشطة وأدوات القياس التي تريد ظهورها في التقرير.</p><div class="actions"><button class="btn" onclick="pdf()">تنزيل تقرير PDF</button><a class="btn back" href="nafs.html">رجوع</a></div></div></div><section id="pdfReport" class="report"><header class="rhead"><h1>تقرير خطة نافس المستدامة</h1><div class="rsub">تعزيز الإتقان • تنمية مهارات التفكير العليا • استدامة أثر التعلم</div></header><div id="metaCards" class="metaCards"></div><div id="reportBody" class="rbody"></div></section><script src="nafs-ms-data.js"></script><script src="nafs-corrections-2026.js?v=1"></script><script src="nafs-reading-data.js"></script><script src="nafs-pdf.js?v=505-20261001-2"></script><script>const $=id=>document.getElementById(id);let rows=[],outcomeRows=[];const OPT={reading:{a:['قراءة نصوص متنوعة وتوظيف المهارات المختارة في سياقات جديدة','أسئلة استنتاج ومقارنة ونقد وتبرير بالدليل','أنشطة فردية وتعاونية لبناء استجابات أعمق','تحليل نص قصير وتحديد الأدلة الداعمة','مناقشة جماعية وتبرير الإجابات من النص','تطبيق المهارة على نص جديد'],t:['بطاقة ملاحظة للأداء','أسئلة قصيرة على نصوص جديدة','مهمة أدائية تتطلب توظيف الدليل وتبرير الإجابة','قائمة تحقق لمؤشرات الأداء','اختبار قصير قبلي وبعدي','ملف إنجاز لأعمال الطالبة']},math:{a:['حل مسائل غير روتينية في مواقف حياتية','مقارنة استراتيجيات الحل وشرح الأنسب','تحليل الأخطاء والتحقق من معقولية الناتج','حل مسائل متدرجة الصعوبة','تمثيل المسألة بأكثر من طريقة','تطبيق المهارة في موقف حياتي جديد'],t:['مسائل أداء قصيرة متعددة المستويات','قائمة تحقق لخطوات الحل','بطاقة تحليل أخطاء','مهمة تطبيقية','اختبار قصير قبلي وبعدي','بطاقة ملاحظة للأداء']},science:{a:['مواقف استقصائية تتطلب الملاحظة والتفسير والاستنتاج','تحليل بيانات ونتائج وبناء تفسير علمي بالأدلة','تطبيق المفهوم في موقف جديد','تنفيذ نشاط استقصائي موجه','مقارنة النتائج وتفسير أسباب الاختلاف','ربط المفهوم العلمي بموقف حياتي'],t:['مهمة استقصائية','بطاقة ملاحظة للأداء','أسئلة تفسير بيانات ونتائج','سجل تعلم','مهمة تطبيقية','اختبار قصير قبلي وبعدي']}};function data(s,g){return s==='reading'?(window.NAFS_READING?.[g]||[]):(window.NAFS_MS?.[s]?.[g]||[])}function subjects(){const g=$('grade').value,a=[];if(data('reading',g).length)a.push(['reading','القراءة']);if(data('math',g).length)a.push(['math','الرياضيات']);if(data('science',g).length)a.push(['science','العلوم الطبيعية']);return a}function checks(id,a){$(id).innerHTML=a.map((x,i)=>`<label class="check"><input type="checkbox" value="${i}" ${i<3?'checked':''}><span>${x}</span></label>`).join('')}function loadOptions(){const o=OPT[$('subject').value]||OPT.science;checks('activityChoices',o.a);checks('toolChoices',o.t)}function loadSubjects(){$('subject').innerHTML=subjects().map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');loadDomains()}function split(v){const p=String(v||'').split(' — ');return{domain:p[0]||'',sub:p.slice(1).join(' — ')||''}}function loadDomains(){rows=data($('subject').value,$('grade').value);$('domain').innerHTML=[...new Set(rows.map(r=>split(r[0]).domain))].map(x=>`<option>${x}</option>`).join('');loadSubs();loadOptions()}function loadSubs(){const d=$('domain').value;$('sub').innerHTML=[...new Set(rows.filter(r=>split(r[0]).domain===d).map(r=>split(r[0]).sub||d))].map(x=>`<option>${x}</option>`).join('');loadOutcomes()}function loadOutcomes(){const d=$('domain').value,s=$('sub').value;outcomeRows=rows.filter(r=>{const x=split(r[0]);return x.domain===d&&(x.sub||d)===s});$('outcome').innerHTML=outcomeRows.map((r,i)=>`<option value="${i}">${r[1]}</option>`).join('');loadIndicators()}function row(){return outcomeRows[+$('outcome').value]||null}function loadIndicators(){const r=row();$('indicators').innerHTML=r?.[2]?.map((x,i)=>`<label class="check"><input type="checkbox" value="${i}"><span>${x}</span></label>`).join('')||'<div class="empty">لا توجد مؤشرات.</div>'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function hdate(){return `${$('hday').value} ${$('hmonth').value} ${$('hyear').value} هـ`}function sec(t,c,cl=''){return `<div class="section ${cl}"><div class="stitle">${t}</div><div class="scontent">${c}</div></div>`}function profile(skills,subj){const j=skills.join('، ');if(subj==='القراءة')return{hot:'الاستدلال، التحليل، النقد، التقويم',goal:`استدامة إتقان المهارات المختارة «${j}» وربطها وتوظيفها في مواقف قرائية جديدة تتطلب تفكيرًا أعلى.`,success:`تحقق إتقان مستمر للمهارات المختارة «${j}» عند تطبيقها على نصوص جديدة مع الاستدلال والتبرير باستقلالية.`};if(subj==='الرياضيات')return{hot:'حل المشكلات، الاستدلال الرياضي، التحليل، التقويم',goal:`استدامة إتقان المهارات المختارة «${j}» وربطها وتوظيفها في مسائل جديدة تتطلب تفكيرًا أعلى.`,success:`ثبات إتقان المهارات المختارة «${j}» عبر مسائل جديدة مع اختيار استراتيجية مناسبة وتفسير الحل والتحقق من الناتج.`};return{hot:'الاستقصاء، الاستدلال العلمي، التحليل، التقويم',goal:`استدامة إتقان المهارات المختارة «${j}» وربطها وتوظيفها في مواقف علمية جديدة تتطلب تفكيرًا أعلى.`,success:`استمرار إتقان المهارات المختارة «${j}» في مواقف علمية جديدة مع تفسير النتائج والاستدلال بالأدلة باستقلالية.`}}function chosen(id,list){return [...document.querySelectorAll(`#${id} input:checked`)].map(x=>list[+x.value])}async function pdf(){const r=row();if(!r)return;const sel=[...document.querySelectorAll('#indicators input:checked')].map(x=>r[2][+x.value]);if(!sel.length)return alert('اختر مهارة أو مؤشرًا واحدًا على الأقل');const o=OPT[$('subject').value]||OPT.science,acts=chosen('activityChoices',o.a),tools=chosen('toolChoices',o.t);if(!acts.length)return alert('اختر إجراءً أو نشاطًا واحدًا على الأقل');if(!tools.length)return alert('اختر أداة قياس ومتابعة واحدة على الأقل');const g=$('grade').selectedOptions[0].text,s=$('subject').selectedOptions[0].text,d=$('domain').value,sd=$('sub').value,sc=$('school').value,t=$('teacher').value,p=$('principal').value,dy=$('day').value,dt=hdate();$('metaCards').innerHTML=`<div class="metaCard"><b>المدرسة</b>${esc(sc||'—')}</div><div class="metaCard"><b>الصف</b>${esc(g)}</div><div class="metaCard"><b>المادة</b>${esc(s)}</div><div class="metaCard"><b>اليوم</b>${esc(dy)}</div><div class="metaCard"><b>التاريخ</b>${esc(dt)}</div>`;const q=profile(sel,s),skills=sel.map(x=>`<span style="display:inline-block;margin:3px 4px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.62);border:1px solid rgba(32,91,76,.18)">${esc(x)}</span>`).join('');$('reportBody').innerHTML=sec('المجال والمسار',`${esc(d)} <b>←</b> ${esc(sd)}`)+sec('ناتج التعلم',esc(r[1]))+sec('المهارات المستهدفة للاستدامة',skills,'skillHero')+`<div class="two">${sec('هدف الاستدامة',esc(q.goal))}${sec('مهارات التفكير العليا',q.hot)}</div>`+sec('إجراءات وأنشطة الاستدامة',esc(acts.join(' • ')))+sec('مؤشر النجاح',esc(q.success))+sec('أدوات القياس والمتابعة',esc(tools.join(' • ')))+`<div class="sig"><div>المعلمة<br><b>${esc(t||'........................')}</b></div><div>مديرة المدرسة<br><b>${esc(p||'........................')}</b></div></div>`;await NAFS_PDF.download($('pdfReport'),'خطة-نافس-المستدامة.pdf')}$('hday').innerHTML=Array.from({length:30},(_,i)=>`<option>${i+1}</option>`).join('');loadSubjects();</script></body></html>

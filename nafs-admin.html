<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة نافس | أنجز</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#5538c8,#735bd8);color:#fff;padding:20px;border-radius:20px}.card{background:#fff;border:1px solid #e5e8ef;border-radius:18px;padding:20px;margin:12px 0}.login{max-width:460px;margin:50px auto}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d8dce7;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:11px 17px;background:#5b3fd6;color:#fff;font:inherit;font-weight:800;cursor:pointer}.ghost{background:#eeeafc;color:#5538c8}.danger{background:#b42318}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.hide{display:none!important}.link{background:#f6f4ff;border:1px solid #e0dafa;border-radius:10px;padding:11px;word-break:break-all;margin:10px 0}.err{color:#b42318;font-weight:800}.muted{color:#6d7585}.reports{display:grid;gap:10px}.reportItem{border:1px solid #e4e7ee;border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{padding:5px 9px;border-radius:999px;background:#eaf7ee;color:#16723b;font-size:12px}.closed{background:#f0f1f4;color:#626a78}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #9da95b;padding:8px;text-align:center;vertical-align:middle}th{background:#e8edbd}th:last-child{width:48%}.items{text-align:right;line-height:1.9}.reportTitle{text-align:center}@media(max-width:650px){.reportItem{align-items:flex-start;flex-direction:column}}@media print{.noPrint,.hero,#reportsCard{display:none!important}.wrap,.card{padding:0;border:0;margin:0}.tablewrap{overflow:visible}table{font-size:12px}@page{size:A4 portrait;margin:10mm}}</style></head><body><div class="wrap"><section id="login" class="card login"><h2>دخول مسؤولة نافس</h2><div class="field"><label>رمز المدرسة</label><input id="code" value="4821" inputmode="numeric"></div><div class="field"><label>رمز الإدارة</label><input id="pin" type="password" inputmode="numeric"></div><button class="btn" onclick="loginAdmin()">دخول</button><div id="loginMsg" class="err"></div></section><main id="admin" class="hide"><div class="hero"><h1 id="schoolName">نافس</h1><div>التقارير المنفصلة لمتابعة نافس</div></div><div id="reportsCard" class="card noPrint"><div class="row"><h3 style="margin-left:auto">التقارير</h3><button class="btn" onclick="newReport()">+ بدء تقرير جديد</button><button class="btn ghost" onclick="logout()">خروج</button></div><div id="reports" class="reports"></div></div><section id="viewer" class="hide"><div class="card noPrint"><div class="row"><h3 id="currentTitle" style="margin-left:auto"></h3><span id="statusBadge" class="badge"></span></div><div id="shareArea"><div id="teacherLink" class="link"></div><div class="row"><button class="btn" onclick="copyTeacher()">نسخ رابط المعلمات</button><button class="btn ghost" onclick="openTeacher()">معاينة الرابط</button><button class="btn danger" onclick="closeCurrent()">إغلاق وحفظ التقرير</button></div></div></div><div class="card"><div class="noPrint row"><span id="count" class="muted"></span><button class="btn" style="margin-right:auto" onclick="window.print()">طباعة التقرير</button></div><h2 class="reportTitle">نموذج متابعة تدريب الطالبات على مهارات نافس</h2><div class="tablewrap"><table><thead><tr><th>اسم المعلمة</th><th>الحصة</th><th>تاريخ الحصة</th><th>بنود المتابعة</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><script>const API='https://cixwjisioawswnnwwswf.supabase.co/functions/v1/nafs-api',labels=['اختيار التدريبات من بنوك نافس','استهداف مهارات التفكير العليا','تدريب الطالبات على مفاتيح الحل وتقديم تغذية راجعة','تشخيص الطالبات حسب النموذج المرفق سابقًا'];let adminToken=localStorage.getItem('nafsAdminToken'),current=null;async function api(b){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok||d.error)throw Error(d.error||'تعذر الاتصال');return d}async function loginAdmin(){loginMsg.textContent='';try{let d=await api({action:'login',school_code:code.value.trim(),pin:pin.value.trim()});adminToken=d.admin_token;localStorage.setItem('nafsAdminToken',adminToken);await loadReports()}catch(e){loginMsg.textContent='رمز المدرسة أو رمز الإدارة غير صحيح'}}async function loadReports(){try{let d=await api({action:'reports',admin:adminToken});schoolName.textContent=d.school_name+' — نافس';reports.innerHTML=d.reports.map(r=>'<div class="reportItem"><div><b>'+safe(r.title)+'</b><div class="muted">'+dateText(r.created_at)+'</div></div><div class="row"><span class="badge '+(r.status==='closed'?'closed':'')+'">'+(r.status==='closed'?'محفوظ':'مفتوح')+'</span><button class="btn ghost" onclick="openReport('+r.id+')">فتح</button></div></div>').join('')||'<div class="muted">لا توجد تقارير. ابدأ تقريرًا جديدًا.</div>';login.classList.add('hide');admin.classList.remove('hide')}catch(e){localStorage.removeItem('nafsAdminToken');adminToken='';login.classList.remove('hide');admin.classList.add('hide')}}async function newReport(){let title=prompt('اسم التقرير','تقرير نافس - '+new Date().toLocaleDateString('ar-SA'));if(title===null)return;try{let r=await api({action:'create_report',admin:adminToken,title});await loadReports();await openReport(r.id)}catch(e){alert('تعذر إنشاء التقرير')}}async function openReport(id){try{let d=await api({action:'report',admin:adminToken,report_id:id});current=d.report;currentTitle.textContent=current.title;statusBadge.textContent=current.status==='closed'?'محفوظ':'مفتوح';statusBadge.className='badge '+(current.status==='closed'?'closed':'');let link=location.origin+location.pathname.replace('nafs-admin.html','nafs-followup.html')+'?report='+current.report_token;teacherLink.textContent=link;shareArea.classList.toggle('hide',current.status==='closed');render(d.entries);viewer.classList.remove('hide')}catch(e){alert('تعذر فتح التقرير')}}function render(data){count.textContent='عدد المشاركات: '+data.length;rows.innerHTML=data.map(e=>{let a=[e.item_bank,e.item_hots,e.item_keys_feedback,e.item_diagnosis];return '<tr><td>'+safe(e.teacher_name)+'</td><td>'+safe(e.period)+'</td><td>'+safe(e.lesson_date)+'</td><td class="items">'+labels.map((x,i)=>'<div>'+(a[i]?'☑':'☐')+' '+x+'</div>').join('')+'</td></tr>'}).join('')||'<tr><td colspan="4">لا توجد مشاركات في هذا التقرير حتى الآن</td></tr>'}async function closeCurrent(){if(!current||current.status==='closed')return;if(!confirm('إغلاق وحفظ التقرير؟ بعد الإغلاق لن يقبل رابط المعلمات مشاركات جديدة.'))return;try{await api({action:'close_report',admin:adminToken,report_id:current.id});await loadReports();await openReport(current.id)}catch(e){alert('تعذر إغلاق التقرير')}}function copyTeacher(){navigator.clipboard.writeText(teacherLink.textContent).then(()=>alert('تم نسخ رابط المعلمات'))}function openTeacher(){window.open(teacherLink.textContent,'_blank')}function safe(x){let d=document.createElement('div');d.textContent=x??'';return d.innerHTML}function dateText(x){try{return new Date(x).toLocaleDateString('ar-SA')}catch{return ''}}function logout(){localStorage.removeItem('nafsAdminToken');location.reload()}if(adminToken)loadReports();</script></body></html>

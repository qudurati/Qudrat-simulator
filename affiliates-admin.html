<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>إدارة المسوقين | محاكي القدرات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#10254a}.wrap{max-width:1050px;margin:30px auto;padding:16px}.head,.card,.marketer{background:#fff;border:1px solid #d8e0ea;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px rgba(30,70,120,.04)}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1,.card h2{margin:0 0 6px}.muted{color:#667085}.actions,.rowActions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;background:#173866;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.btn.light{background:#eaf0f7;color:#173866}.form{display:grid;gap:12px}.form input{width:100%;margin-top:7px;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.plans,.rates,.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.marketerTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.marketer h3{margin:0 0 6px}.status{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:#dcfce7;color:#166534}.status.off{background:#fee2e2;color:#991b1b}.link{direction:ltr;text-align:left;background:#f7faff;padding:10px 12px;border-radius:10px;margin:14px 0;font-family:monospace;overflow:auto}.rates div,.stats div{background:#f7faff;border-radius:12px;padding:12px}.rates small,.stats small{display:block;color:#718096;margin-bottom:5px}.stats b{font-size:18px}.rowActions{margin-top:14px}.empty{text-align:center;padding:30px;color:#718096}.msg{margin:8px 0;color:#166534;font-weight:700}dialog{border:0;border-radius:18px;padding:0;max-width:520px;width:calc(100% - 30px)}.dialogBox{padding:20px}.hist{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #edf2f7}.hist small{display:block;color:#718096;margin-top:4px}@media(max-width:700px){.wrap{margin:0;padding:10px}.head{align-items:flex-start;flex-direction:column}.plans,.rates{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.actions{width:100%}.actions .btn{flex:1;text-align:center}}</style></head><body><main class="wrap"><section class="head"><div><h1>إدارة المسوقين</h1><div id="owner" class="muted"></div></div><div class="actions"><a class="btn light" href="admin.html">لوحة المالك</a><button id="refresh" class="btn">تحديث</button><button id="logout" class="btn light">خروج</button></div></section><section class="card"><h2>إضافة مسوق</h2><p class="muted">أنشئ رابطًا عشوائيًا وحدد عمولة كل باقة لهذا المسوق.</p><form id="form" class="form"><label>اسم المسوق بالعربي<input id="name" required minlength="2" placeholder="مثال: بندر العلوي"></label><div class="plans"><label>الباقة الأساسية — العمولة (ريال)<input data-plan="basic" type="number" min="0" step="0.01" required></label><label>الباقة المتوسطة — العمولة (ريال)<input data-plan="plus" type="number" min="0" step="0.01" required></label><label>الباقة الأعلى — العمولة (ريال)<input data-plan="pro" type="number" min="0" step="0.01" required></label></div><button class="btn" type="submit">＋ إضافة مسوق</button></form><div id="msg" class="msg"></div></section><div id="list"></div></main><dialog id="history"><div class="dialogBox"><div class="marketerTop"><h2 id="historyTitle">سجل التحويلات</h2><button id="closeHistory" class="btn light">إغلاق</button></div><div id="historyBody"></div></div></dialog><script src="affiliates-admin.js?v=1"></script></body></html>

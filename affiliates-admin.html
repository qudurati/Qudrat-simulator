rflow:hidden;text-overflow:ellipsis;margin-bottom:3px}.rates b{font-size:14px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:7px}.stats div{padding:8px 4px;text-align:center;border-radius:9px;min-width:0}.stats small{font-size:10.5px;line-height:1.3;margin-bottom:3px}.stats b{font-size:16px}.rowActions{margin-top:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.rowActions .btn{padding:8px 5px;font-size:12px;white-space:nowrap}.rowActions .settle{grid-column:span 1}.rowActions .del,.rowActions .toggle{padding:7px 5px}}</style></head><body><main class="wrap"><section class="head"><div><h1>إدارة المسوقين</h1><div id="owner" class="muted"></div></div><div class="actions"><a class="btn light" href="admin.html">لوحة المالك</a><button id="refresh" class="btn">تحديث</button></div></section><section class="card"><h2>إضافة مسوق</h2><p class="muted">أدخل اسم المسوق وحدد عمولته لكل باقة.</p><form id="form" class="form"><label class="fieldName">اسم المسوق<input id="name" required minlength="2" placeholder="مثال: بندر العلوي"></label><div class="plans"><label class="commissionField"><span>الباقة الأساسية</span><input data-plan="basic" type="number" min="0" step="0.01" required placeholder="ريال"></label><label class="commissionField"><span>الباقة المتوسطة</span><input data-plan="plus" type="number" min="0" step="0.01" required placeholder="ريال"></label><label class="commissionField"><span>الباقة الأعلى</span><input data-plan="pro" type="number" min="0" step="0.01" required placeholder="ريال"></label></div><button class="btn addMarketerBtn" type="submit"><span class="plus">＋</span>إضافة مسوق</button></form><div id="msg" class="msg"></div></section><div id="list"></div></main><dialog id="history"><div class="dialogBox"><div class="marketerTop"><h2 id="historyTitle">سجل التحويلات</h2><button id="closeHistory" class="btn light">إغلاق</button></div><div id="historyBody"></div></div></dialog><script src="affiliates-admin.js?v=3"></script></body></

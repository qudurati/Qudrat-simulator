<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>الخطة الفصلية — PDF</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f2f4f7;font-family:Tahoma,Arial}.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e1e5ea;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bar b{font-size:16px;margin-left:auto}.bar button{border:0;border-radius:10px;padding:10px 14px;background:#edf0f5;color:#344054;font:inherit;font-weight:700;cursor:pointer}.bar .primary{background:#167783;color:#fff}.bar .share{background:#5538c8;color:#fff}.stage{padding:10px;display:flex;flex-direction:column;align-items:center;gap:14px}.sheet{width:min(100%,760px);aspect-ratio:760/1080;background:#fff;box-shadow:0 2px 12px #0002}.sheet img{width:100%;height:100%;display:block;object-fit:contain}.empty{padding:40px;text-align:center;color:#667085}@media(max-width:600px){.stage{padding:5px}.sheet{width:100%}.bar{justify-content:center}.bar b{width:100%;margin:0;text-align:center}.bar button{flex:1;min-width:90px;padding:9px 7px;font-size:13px}}</style></head><body><div class="bar"><b>الخطة الفصلية — PDF</b><button id="back">رجوع</button><button id="print" class="primary">طباعة PDF</button><button id="save">حفظ في الملفات</button><button id="share" class="share">مشاركة PDF</button></div><main class="stage" id="stage"></main><script>const RETURN='/nafs-semester-plan-v3.html',raw=sessionStorage.getItem('nafsSemesterCardPages'),legacy=sessionStorage.getItem('nafsSemesterCardPreview'),name='خطة-نافس-الفصلية.pdf';let pages=[];try{pages=raw?JSON.parse(raw):[]}catch(e){}if(!pages.length&&legacy)pages=[legacy];const stage=document.getElementById('stage');if(pages.length)pages.forEach((src,i)=>{const s=document.createElement('div');s.className='sheet';s.innerHTML=`<img src="${src}" alt="صفحة ${i+1}">`;stage.appendChild(s)});else stage.innerHTML='<div class="empty">انتهت المعاينة. ارجع وأنشئ التقرير مرة أخرى.</div>';let pdfBlob=null,pdfUrl=null;function makePdf(){if(pdfBlob||!pages.length||!window.jspdf)return pdfBlob;const{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});pages.forEach((p,i)=>{if(i)pdf.addPage('a4','portrait');pdf.addImage(p,'JPEG',0,0,210,297,undefined,'FAST')});pdfBlob=pdf.output('blob');pdfUrl=URL.createObjectURL(pdfBlob);return pdfBlob}function file(){const b=makePdf();return b?new File([b],name,{type:'application/pdf'}):null}function goBack(){location.replace(RETURN)}document.getElementById('back').onclick=goBack;document.getElementById('print').onclick=()=>{if(!makePdf())return alert('تعذر إنشاء ملف PDF');window.open(pdfUrl,'_blank')};async function deliver(){const f=file();if(!f)return alert('تعذر إنشاء ملف PDF');try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'الخطة الفصلية'});return}}catch(e){if(e&&e.name==='AbortError')return}window.open(pdfUrl,'_blank')}document.getElementById('save').onclick=deliver;document.getElementById('share').onclick=deliver;history.replaceState({semesterGuard:true},'',location.href);history.pushState({semesterPreview:true},'',location.href);window.addEventListener('popstate',goBack,{once:true});window.addEventListener('beforeunload',()=>{if(pdfUrl)URL.revokeObjectURL(pdfUrl)});</script></body></html>

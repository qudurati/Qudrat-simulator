<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>الخطة الفصلية — A4</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f2f4f7;font-family:Tahoma,Arial}.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e1e5ea;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}.bar b{font-size:16px}.bar button{border:0;border-radius:10px;padding:10px 16px;background:#edf0f5;color:#344054;font:inherit;font-weight:700}.stage{padding:10px;display:flex;justify-content:center}.sheet{width:min(100%,760px);aspect-ratio:760/1080;background:#fff;box-shadow:0 2px 12px #0002}.sheet img{width:100%;height:100%;display:block;object-fit:contain}.empty{padding:40px;text-align:center;color:#667085}@media(max-width:600px){.stage{padding:5px}.sheet{width:100%}}</style></head><body><div class="bar"><b>الخطة الفصلية — A4</b><button id="back">رجوع</button></div><main class="stage"><div class="sheet" id="sheet"><img id="page" alt="الخطة الفصلية"></div></main><script>const RETURN='/nafs-semester-plan-v3.html';const data=sessionStorage.getItem('nafsSemesterCardPreview'),img=document.getElementById('page');if(data)img.src=data;else document.getElementById('sheet').innerHTML='<div class="empty">انتهت المعاينة. ارجع وأنشئ التقرير مرة أخرى.</div>';function goBack(){location.replace(RETURN)}document.getElementById('back').onclick=goBack;history.replaceState({semesterGuard:true},'',location.href);history.pushState({semesterPreview:true},'',location.href);window.addEventListener('popstate',goBack,{once:true});</script></body></html>

name: Vendor NAFS PDF engine
on:
  push:
    paths:
      - '.github/workflows/vendor-nafs-pdfmake.yml'
      - 'nafs-pdf-vendor-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download pinned browser PDF engine and Arabic font
        run: |
          set -euo pipefail
          mkdir -p vendor/nafs-pdf
          curl -fLsS --retry 4 'https://cdn.jsdelivr.net/npm/pdfmake@0.2.20/build/pdfmake.min.js' -o vendor/nafs-pdf/pdfmake.min.js
          curl -fLsS --retry 4 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf' -o vendor/nafs-pdf/Amiri-Regular.ttf
          test "$(wc -c < vendor/nafs-pdf/pdfmake.min.js)" -gt 500000
          test "$(wc -c < vendor/nafs-pdf/Amiri-Regular.ttf)" -gt 100000
      - name: Commit local vendor files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/nafs-pdf/pdfmake.min.js vendor/nafs-pdf/Amiri-Regular.ttf
          if ! git diff --cached --quiet; then
            git commit -m 'Vendor pdfmake and Arabic font locally for NAFS reports'
            git push
          fi

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الطلاب | محاكي القدرات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;background:#f3f6fa;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#10254a}.wrap{max-width:520px;margin:60px auto;padding:18px}.card{background:#fff;border:1px solid #d8e0ea;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(16,37,74,.06)}h1{margin:0 0 8px}.muted{color:#667085;margin:0 0 22px}.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;padding:12px 14px;margin:0 0 16px;line-height:1.7}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.tabs button{padding:11px;border:1px solid #cad5e2;background:#f8fafc;border-radius:9px;font-weight:700;color:#173866}.tabs button.active{background:#173866;color:#fff}.form{display:grid;gap:12px}.form label{font-weight:700;font-size:14px}.form input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.hint{font-size:12px;color:#667085;margin-top:-7px}.primary{margin-top:4px;padding:12px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-size:16px;font-weight:800}.msg{min-height:24px;margin-top:12px;color:#b42318}.msg.ok{color:#15803d}.home,.forgot{display:inline-block;margin-top:15px;color:#173866;text-decoration:none}.forgot{border:0;background:none;padding:0;font:inherit;cursor:pointer}.hidden{display:none}</style></head><body><main class="wrap"><section class="card"><h1>حساب الطالب</h1><p class="muted">سجّل الدخول برقم الجوال أو أنشئ حسابًا جديدًا.</p><div id="loginNotice" class="notice" hidden>يلزم أولًا تسجيل الدخول أو إنشاء حساب طالب.</div><div class="tabs"><button id="loginTab" class="active">تسجيل الدخول</button><button id="signupTab">إنشاء حساب</button></div><form id="loginForm" class="form"><label>رقم الجوال</label><input id="loginPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="05XXXXXXXX" required maxlength="10" pattern="05[0-9]{8}"><label>كلمة المرور</label><input id="loginPassword" type="password" required minlength="8" autocomplete="current-password"><button class="primary" type="submit">دخول</button><button id="forgotBtn" class="forgot" type="button">نسيت كلمة المرور؟</button></form><form id="signupForm" class="form hidden"><label>اسم الطالب</label><input id="fullName" required maxlength="80"><label>رقم الجوال</label><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="05XXXXXXXX" required maxlength="10" pattern="05[0-9]{8}"><div class="hint">سيكون رقم الجوال هو وسيلة تسجيل الدخول.</div><label>البريد الإلكتروني</label><input id="signupEmail" type="email" required autocomplete="email"><div class="hint">يُستخدم لتأكيد الحساب واستعادة كلمة المرور.</div><label>كلمة المرور</label><input id="signupPassword" type="password" required minlength="8" autocomplete="new-password"><button class="primary" type="submit">إنشاء الحساب</button></form><form id="forgotForm" class="form hidden"><div class="notice">أدخل البريد الإلكتروني الذي سجلت به وسنرسل لك رابط استعادة كلمة المرور.</div><label>البريد الإلكتروني</label><input id="recoveryEmail" type="email" required autocomplete="email"><button class="primary" type="submit">إرسال رابط الاستعادة</button><button id="backLogin" class="forgot" type="button">العودة لتسجيل الدخول</button></form><div id="msg" class="msg"></div><a class="home" href="index.html">العودة للرئيسية</a></section></main><script>const db=window.getQudratSupabase();const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const STORAGE_KEY='sb-lqvfvpvyzoupdyqahwjy-auth-token';if(params.get('reason')==='login')$('loginNotice').hidden=false;function show(which){const login=which==='login',signup=which==='signup';$('loginForm').classList.toggle('hidden',!login);$('signupForm').classList.toggle('hidden',!signup);$('forgotForm').classList.toggle('hidden',which!=='forgot');$('loginTab').classList.toggle('active',login);$('signupTab').classList.toggle('active',signup);$('msg').textContent='';$('msg').classList.remove('ok')}$('loginTab').onclick=()=>show('login');$('signupTab').onclick=()=>show('signup');$('forgotBtn').onclick=()=>show('forgot');$('backLogin').onclick=()=>show('login');if(params.get('mode')==='signup')show('signup');['phone','loginPhone'].forEach(id=>$(id).addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^0-9]/g,'').slice(0,10)}));async function persistAndEnter(session){if(!session)return false;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(session));await db.auth.setSession({access_token:session.access_token,refresh_token:session.refresh_token});location.replace('dashboard.html');return true}catch(e){$('msg').textContent='تعذر حفظ تسجيل الدخول في هذا المتصفح.';return false}}$('loginForm').onsubmit=async e=>{e.preventDefault();$('msg').textContent='جارٍ تسجيل الدخول...';const phone=$('loginPhone').value.replace(/\D/g,''),password=$('loginPassword').value;if(!/^05\d{8}$/.test(phone)){$('msg').textContent='أدخل رقم جوال سعودي صحيح.';return}try{const r=await fetch('https://lqvfvpvyzoupdyqahwjy.supabase.co/functions/v1/login-by-phone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password})});const j=await r.json();if(!r.ok||!j.session){$('msg').textContent='رقم الجوال أو كلمة المرور غير صحيحة.';return}await persistAndEnter(j.session)}catch(_){$('msg').textContent='تعذر تسجيل الدخول الآن. حاول مرة أخرى.'}};$('signupForm').onsubmit=async e=>{e.preventDefault();$('msg').classList.remove('ok');$('msg').textContent='جارٍ إنشاء الحساب...';const email=$('signupEmail').value.trim(),password=$('signupPassword').value,full_name=$('fullName').value.trim(),phone=$('phone').value.replace(/[^0-9]/g,'');if(!/^05\d{8}$/.test(phone)){$('msg').textContent='أدخل رقم جوال سعودي صحيح يبدأ بـ 05 ويتكون من 10 أرقام.';return}const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name,phone},emailRedirectTo:new URL('dashboard.html',location.href).href}});if(error){$('msg').textContent=/already registered/i.test(error.message)?'البريد مسجل بالفعل؛ استخدم تسجيل الدخول أو استعادة كلمة المرور.':error.message;return}if(data.session){await persistAndEnter(data.session);return}$('msg').classList.add('ok');$('msg').textContent='تم إنشاء الحساب. افتح رسالة التأكيد في بريدك، وبعدها سجّل الدخول برقم جوالك.'};$('forgotForm').onsubmit=async e=>{e.preventDefault();$('msg').classList.remove('ok');$('msg').textContent='جارٍ إرسال رابط الاستعادة...';const email=$('recoveryEmail').value.trim();const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:new URL('reset-password.html',location.href).href});if(error){$('msg').textContent='تعذر إرسال رابط الاستعادة الآن.';return}$('msg').classList.add('ok');$('msg').textContent='إذا كان البريد مسجلًا لدينا فستصلك رسالة استعادة كلمة المرور.'};(async()=>{try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const s=JSON.parse(raw);if(s?.access_token&&s?.refresh_token){const {data,error}=await db.auth.setSession({access_token:s.access_token,refresh_token:s.refresh_token});if(!error&&data?.session){location.replace('dashboard.html');return}}}const {data}=await db.auth.getSession();if(data?.session&&!data.session.user?.is_anonymous)location.replace('dashboard.html')}catch(e){}})();</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الطلاب | محاكي القدرات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>:root{--navy:#0b2f5f;--blue:#1769c2;--ink:#102a56;--muted:#687995;--line:#dce7f2;--shadow:0 18px 48px rgba(22,79,148,.10)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f5f8fc 0%,#eef5fb 100%);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;text-align:center}.wrap{width:min(100%,560px);margin:0 auto;padding:34px 18px 45px}.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:20px;color:var(--navy);font-size:20px;font-weight:900}.brand img{width:58px;height:58px;border-radius:16px;object-fit:cover;box-shadow:0 8px 22px rgba(15,75,145,.12)}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow);text-align:center}h1{margin:0 0 8px;font-size:29px;font-weight:900;color:var(--navy)}.muted{color:var(--muted);font-size:16px;font-weight:600;line-height:1.8;margin:0 0 24px}.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e4f91;border-radius:12px;padding:12px 14px;margin:0 0 17px;line-height:1.75;font-weight:600;font-size:14px;text-align:center}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:5px;background:#f3f7fb;border-radius:14px;margin-bottom:22px}.tabs button{padding:12px;border:0;background:transparent;border-radius:10px;font-size:15px;font-weight:800;color:#536b89;cursor:pointer;text-align:center}.tabs button.active{background:#fff;color:var(--navy);box-shadow:0 3px 12px rgba(22,79,148,.09)}.form{display:grid;gap:12px;text-align:center}.form label{font-weight:800;font-size:15px;color:#183d70;text-align:center}.form input{width:100%;padding:13px 14px;border:1px solid #cbd9e7;border-radius:11px;font:inherit;font-size:16px;color:#102a56;background:#fff;outline:none;transition:.2s;text-align:center}.form input:focus{border-color:#4b8ed1;box-shadow:0 0 0 3px rgba(23,105,194,.09)}.hint{font-size:13px;font-weight:600;color:#77879d;margin-top:-7px;line-height:1.6;text-align:center}.primary{margin-top:5px;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#0f56a5,#1769c2);color:#fff;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 8px 18px rgba(23,105,194,.17);text-align:center}.msg{min-height:25px;margin-top:13px;color:#b4233d;font-weight:700;font-size:14px;line-height:1.7}.msg.ok{color:#087d46}.home,.forgot{display:inline-block;margin-top:16px;color:#164f94;text-decoration:none;font-weight:700;font-size:14px}.forgot{border:0;background:none;padding:0;font:inherit;font-weight:700;color:#164f94;cursor:pointer;justify-self:center}.homeRow{text-align:center;border-top:1px solid #edf2f7;margin-top:7px;padding-top:4px}.hidden{display:none}@media(max-width:600px){.wrap{padding:20px 12px 32px}.brand{font-size:18px;margin-bottom:15px}.brand img{width:52px;height:52px}.card{padding:23px 18px;border-radius:20px}h1{font-size:25px}}</style></head><body><main class="wrap"><div class="brand"><img src="logo.PNG" alt="شعار محاكي القدرات"><span>محاكي القدرات</span></div><section class="card"><h1>حساب الطالب</h1><p class="muted">سجّل الدخول برقم الجوال أو أنشئ حسابًا جديدًا.</p><div id="loginNotice" class="notice" hidden>يلزم أولًا تسجيل الدخول أو إنشاء حساب طالب.</div><div class="tabs"><button id="loginTab" class="active">تسجيل الدخول</button><button id="signupTab">إنشاء حساب</button></div><form id="loginForm" class="form"><label>رقم الجوال</label><input id="loginPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="05XXXXXXXX" required maxlength="10" pattern="05[0-9]{8}"><label>كلمة المرور</label><input id="loginPassword" type="password" required minlength="8" autocomplete="current-password"><button class="primary" type="submit">تسجيل الدخول</button><button id="forgotBtn" class="forgot" type="button">نسيت كلمة المرور؟</button></form><form id="signupForm" class="form hidden"><label>اسم الطالب</label><input id="fullName" required maxlength="80"><label>رقم الجوال</label><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="05XXXXXXXX" required maxlength="10" pattern="05[0-9]{8}"><div class="hint">سيكون رقم الجوال هو وسيلة تسجيل الدخول.</div><label>البريد الإلكتروني</label><input id="signupEmail" type="email" required autocomplete="email"><div class="hint">يُستخدم لتأكيد الحساب واستعادة كلمة المرور.</div><label>كلمة المرور</label><input id="signupPassword" type="password" required minlength="8" autocomplete="new-password"><button class="primary" type="submit">إنشاء الحساب</button></form><form id="forgotForm" class="form hidden"><div class="notice">أدخل البريد الإلكتروني الذي سجلت به وسنرسل لك رابط استعادة كلمة المرور.</div><label>البريد الإلكتروني</label><input id="recoveryEmail" type="email" required autocomplete="email"><button class="primary" type="submit">إرسال رابط الاستعادة</button><button id="backLogin" class="forgot" type="button">العودة لتسجيل الدخول</button></form><div id="msg" class="msg"></div><div class="homeRow"><a class="home" href="index.html">العودة للرئيسية</a></div></section></main><script src="affiliate-tracking.js?v=20260925-2"></script><script>const db=window.getQudratSupabase();const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const STORAGE_KEY='sb-lqvfvpvyzoupdyqahwjy-auth-token';if(params.get('reason')==='login')$('loginNotice').hidden=false;function show(which){const login=which==='login',signup=which==='signup';$('loginForm').classList.toggle('hidden',!login);$('signupForm').classList.toggle('hidden',!signup);$('forgotForm').classList.toggle('hidden',which!=='forgot');$('loginTab').classList.toggle('active',login);$('signupTab').classList.toggle('active',signup);$('msg').textContent='';$('msg').classList.remove('ok')}$('loginTab').onclick=()=>show('login');$('signupTab').onclick=()=>show('signup');$('forgotBtn').onclick=()=>show('forgot');$('backLogin').onclick=()=>show('login');if(params.get('mode')==='signup')show('signup');['phone','loginPhone'].forEach(id=>$(id).addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^0-9]/g,'').slice(0,10)}));async function captureReferral(){try{const x=JSON.parse(localStorage.getItem('qr_ref')||'null');if(!x?.c||Date.now()-x.t>2592000000)return;const r=await db.rpc('capture_affiliate_referral',{p_code:x.c});if(!r.error)localStorage.removeItem('qr_ref')}catch(e){}}async function persistAndEnter(session){if(!session)return false;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(session));await db.auth.setSession({access_token:session.access_token,refresh_token:session.refresh_token});await captureReferral();location.replace('dashboard.html');return true}catch(e){$('msg').textContent='تعذر حفظ تسجيل الدخول في هذا المتصفح.';return false}}$('loginForm').onsubmit=async e=>{e.preventDefault();$('msg').textContent='جارٍ تسجيل الدخول...';const phone=$('loginPhone').value.replace(/\D/g,''),password=$('loginPassword').value;if(!/^05\d{8}$/.test(phone)){$('msg').textContent='أدخل رقم جوال سعودي صحيح.';return}try{const r=await fetch('https://lqvfvpvyzoupdyqahwjy.supabase.co/functions/v1/login-by-phone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password})});const j=await r.json();if(!r.ok||!j.session){$('msg').textContent='رقم الجوال أو كلمة المرور غير صحيحة.';return}await persistAndEnter(j.session)}catch(_){$('msg').textContent='تعذر تسجيل الدخول الآن. حاول مرة أخرى.'}};$('signupForm').onsubmit=async e=>{e.preventDefault();$('msg').classList.remove('ok');$('msg').textContent='جارٍ إنشاء الحساب...';const email=$('signupEmail').value.trim(),password=$('signupPassword').value,full_name=$('fullName').value.trim(),phone=$('phone').value.replace(/[^0-9]/g,'');if(!/^05\d{8}$/.test(phone)){$('msg').textContent='أدخل رقم جوال سعودي صحيح يبدأ بـ 05 ويتكون من 10 أرقام.';return}const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name,phone},emailRedirectTo:new URL('dashboard.html',location.href).href}});if(error){$('msg').textContent=/already registered/i.test(error.message)?'البريد مسجل بالفعل؛ استخدم تسجيل الدخول أو استعادة كلمة المرور.':error.message;return}if(data.session){await persistAndEnter(data.session);return}$('msg').classList.add('ok');$('msg').textContent='تم إنشاء الحساب. افتح رسالة التأكيد في بريدك، وبعدها سجّل الدخول برقم جوالك.'};$('forgotForm').onsubmit=async e=>{e.preventDefault();$('msg').classList.remove('ok');$('msg').textContent='جارٍ إرسال رابط الاستعادة...';const email=$('recoveryEmail').value.trim();const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:new URL('reset-password.html',location.href).href});if(error){$('msg').textContent='تعذر إرسال رابط الاستعادة الآن.';return}$('msg').classList.add('ok');$('msg').textContent='إذا كان البريد مسجلًا لدينا فستصلك رسالة استعادة كلمة المرور.'};(async()=>{try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const s=JSON.parse(raw);if(s?.access_token&&s?.refresh_token){const {data,error}=await db.auth.setSession({access_token:s.access_token,refresh_token:s.refresh_token});if(!error&&data?.session){await captureReferral();location.replace('dashboard.html');return}}}const {data}=await db.auth.getSession();if(data?.session&&!data.session.user?.is_anonymous){await captureReferral();location.replace('dashboard.html')}}catch(e){}})();</script></body></html>

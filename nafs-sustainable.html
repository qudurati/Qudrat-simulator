<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة المستدامة | نافس</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Tahoma,Arial}.wrap{max-width:920px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:22px}h1{margin:0;color:#177344}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.tab{padding:13px;text-align:center;border:1px solid #dce2ea;border-radius:11px;font-weight:700}.active{background:#218b55;color:#fff}.off{opacity:.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.f{margin-top:8px}.f.full{grid-column:1/-1}.f label{display:block;font-weight:700;margin-bottom:6px}.f select{width:100%;padding:12px;border:1px solid #d4dbe5;border-radius:10px;background:#fff;font:inherit}.checks{border:1px solid #dbe3dd;border-radius:11px;overflow:hidden}.check{display:flex;gap:9px;padding:11px 13px;border-bottom:1px solid #edf0ee;line-height:1.6}.check:last-child{border:0}.check input{margin-top:5px}.actions{display:flex;gap:9px;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 17px;background:#218b55;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.back{background:#edf0f5;color:#344054}.note{color:#667085;font-size:13px}.report{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.f.full{grid-column:auto}}@media print{.chooser{display:none}.report{display:block}.head{text-align:center;border-bottom:3px solid #218b55;padding-bottom:12px}.box{border:1px solid #ccc;border-radius:8px;padding:9px;margin:8px 0}.ttl{font-weight:700;color:#17653e;margin-top:12px}@page{size:A4;margin:14mm}}</style></head><body><div class="wrap chooser"><div class="card"><h1>خطة نافس المستدامة</h1><div class="tabs"><div class="tab active">المهارات</div><div class="tab off">البرامج — لاحقًا</div><div class="tab off">المبادرات — لاحقًا</div></div><div class="grid"><div class="f"><label>الصف</label><select id="grade" onchange="loadSubjects()"><option value="g3">الصف الثالث الابتدائي</option><option value="g4">الصف الرابع الابتدائي</option><option value="g5">الصف الخامس الابتدائي</option><option value="g6" selected>الصف السادس الابتدائي</option><option value="g9">الصف الثالث المتوسط (التاسع)</option></select></div><div class="f"><label>المادة</label><select id="subject" onchange="loadDomains()"></select></div><div class="f full"><label>المجال</label><select id="domain" onchange="loadSubs()"></select></div><div class="f full" id="subWrap"><label>المجال الفرعي</label><select id="sub" onchange="loadOutcomes()"></select></div><div class="f full" id="outcomeWrap"><label>ناتج التعلم</label><select id="outcome" onchange="loadIndicators()"></select></div><div class="f full"><label>المهارات / المؤشرات</label><div id="indicators" class="checks"></div></div></div><p class="note">تظهر القوائم بالتدرج: المجال ← المجال الفرعي ← ناتج التعلم ← المؤشرات.</p><div class="actions"><button class="btn" onclick="pdf()">إنشاء تقرير PDF</button><a class="btn back" href="nafs.html">رجوع</a></div></div></div><section class="wrap report"><div class="head"><h1>تقرير خطة نافس المستدامة</h1></div><div id="reportBody"></div></section><script src="nafs-ms-data.js"></script><script src="nafs-reading-data.js"></script><script src="nafs-g4-data.js?v=20261005-1"></script><script src="nafs-g5-data.js?v=2"></script><script>const O=(n,i)=>({n,i}),S=(n,o)=>({n,o}),D=(n,s)=>({n,s});function directNormalize(rows){return (rows||[]).map(r=>D(r[0],[S(r[0],[O(r[0],r[2]||[])])]))}function legacy(s,g){if(s==='reading')return window.NAFS_READING?.[g]||[];return window.NAFS_MS?.[s]?.[g]||[]}function normalizeLegacy(rows){const dm={};(rows||[]).forEach(r=>{const p=String(r[0]||'').split(' — '),d=p[0]||'',sub=p.slice(1).join(' — ')||d;(dm[d]??={});(dm[d][sub]??=[]).push(O(r[1],r[2]||[]))});return Object.entries(dm).map(([d,subs])=>D(d,Object.entries(subs).map(([s,os])=>S(s,os))))}const DATA={g3:{math:normalizeLegacy(legacy('math','g3')),science:normalizeLegacy(legacy('science','g3')),reading:normalizeLegacy(legacy('reading','g3'))},g4:{math:directNormalize(legacy('math','g4')),science:directNormalize(legacy('science','g4')),reading:directNormalize(legacy('reading','g4'))},g5:{math:directNormalize(legacy('math','g5')),science:directNormalize(legacy('science','g5')),reading:directNormalize(legacy('reading','g5'))},g6:{math:normalizeLegacy(legacy('math','g6')),science:normalizeLegacy(legacy('science','g6')),reading:normalizeLegacy(legacy('reading','g6'))},g9:{math:normalizeLegacy(legacy('math','g9')),science:normalizeLegacy(legacy('science','g9')),reading:normalizeLegacy(legacy('reading','g9'))}};const labels={math:'الرياضيات',reading:'القراءة',science:'العلوم الطبيعية'};function direct(){return ['g4','g5'].includes(grade.value)}function loadSubjects(){const isDirect=direct();document.getElementById('subWrap').style.display=isDirect?'none':'';document.getElementById('outcomeWrap').style.display=isDirect?'none':'';document.querySelector('.note').textContent=isDirect?'اختر المجال ثم المهارات مباشرة.':'تظهر القوائم بالتدرج: المجال ← المجال الفرعي ← ناتج التعلم ← المؤشرات.';subject.innerHTML='';let keys=Object.keys(DATA[grade.value]||{}).filter(k=>(DATA[grade.value][k]||[]).length);if(!keys.length){subject.add(new Option('لا توجد بيانات',''));domain.innerHTML=sub.innerHTML=outcome.innerHTML='';indicators.innerHTML='<div class="check">لا توجد بيانات لهذا الصف.</div>';return}keys.forEach(k=>subject.add(new Option(labels[k],k)));loadDomains()}function loadDomains(){domain.innerHTML='';(DATA[grade.value]?.[subject.value]||[]).forEach((x,i)=>domain.add(new Option(x.n,i)));loadSubs()}function loadSubs(){sub.innerHTML='';let d=DATA[grade.value]?.[subject.value]?.[+domain.value];(d?.s||[]).forEach((x,i)=>sub.add(new Option(x.n,i)));loadOutcomes()}function loadOutcomes(){outcome.innerHTML='';let s=DATA[grade.value]?.[subject.value]?.[+domain.value]?.s?.[+sub.value];(s?.o||[]).forEach((x,i)=>outcome.add(new Option(x.n,i)));loadIndicators()}function loadIndicators(){let o=DATA[grade.value]?.[subject.value]?.[+domain.value]?.s?.[+sub.value]?.o?.[+outcome.value];indicators.innerHTML=(o?.i||[]).map((x,i)=>'<label class="check"><input type="checkbox" value="'+i+'"><span>'+x+'</span></label>').join('')||'<div class="check">لا توجد مهارات.</div>'}function pdf(){let c=[...document.querySelectorAll('#indicators input:checked')];if(!c.length){alert('اختر مهارة واحدة على الأقل');return}let d=DATA[grade.value][subject.value][+domain.value],s=d.s[+sub.value],o=s.o[+outcome.value];reportBody.innerHTML='<div class="ttl">الصف والمادة</div><div class="box">'+grade.options[grade.selectedIndex].text+' — '+subject.options[subject.selectedIndex].text+'</div><div class="ttl">المجال</div><div class="box">'+d.n+'</div>'+(direct()?'':'<div class="ttl">المجال الفرعي</div><div class="box">'+s.n+'</div><div class="ttl">ناتج التعلم</div><div class="box">'+o.n+'</div>')+'<div class="ttl">المهارات المختارة</div><div class="box">'+c.map(x=>'✓ '+o.i[+x.value]).join('<br><br>')+'</div>';window.print()}loadSubjects();</script></body></html>

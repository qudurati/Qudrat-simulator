<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة المستدامة | نافس</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Tahoma,Arial}.wrap{max-width:920px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:22px}h1{margin:0;color:#177344}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.tab{padding:13px;text-align:center;border:1px solid #dce2ea;border-radius:11px;font-weight:700}.active{background:#218b55;color:#fff}.off{opacity:.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.f{margin-top:8px}.f.full{grid-column:1/-1}.f label{display:block;font-weight:700;margin-bottom:6px}.f select{width:100%;padding:12px;border:1px solid #d4dbe5;border-radius:10px;background:#fff;font:inherit}.checks{border:1px solid #dbe3dd;border-radius:11px;overflow:hidden}.check{display:flex;gap:9px;padding:11px 13px;border-bottom:1px solid #edf0ee;line-height:1.6}.check:last-child{border:0}.check input{margin-top:5px}.actions{display:flex;gap:9px;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 17px;background:#218b55;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.back{background:#edf0f5;color:#344054}.note{color:#667085;font-size:13px}.report{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.f.full{grid-column:auto}}@media print{.chooser{display:none}.report{display:block}.head{text-align:center;border-bottom:3px solid #218b55;padding-bottom:12px}.box{border:1px solid #ccc;border-radius:8px;padding:9px;margin:8px 0}.ttl{font-weight:700;color:#17653e;margin-top:12px}@page{size:A4;margin:14mm}}</style></head><body><div class="wrap chooser"><div class="card"><h1>خطة نافس المستدامة</h1><div class="tabs"><div class="tab active">المهارات</div><div class="tab off">البرامج — لاحقًا</div><div class="tab off">المبادرات — لاحقًا</div></div><div class="grid"><div class="f"><label>الصف</label><select id="grade" onchange="loadSubjects()"><option value="g3">الصف الثالث الابتدائي</option><option value="g6" selected>الصف السادس الابتدائي</option><option value="g9">الصف الثالث المتوسط (التاسع)</option></select></div><div class="f"><label>المادة</label><select id="subject" onchange="loadDomains()"></select></div><div class="f full"><label>المجال</label><select id="domain" onchange="loadSubs()"></select></div><div class="f full"><label>المجال الفرعي</label><select id="sub" onchange="loadOutcomes()"></select></div><div class="f full"><label>ناتج التعلم</label><select id="outcome" onchange="loadIndicators()"></select></div><div class="f full"><label>المهارات / المؤشرات</label><div id="indicators" class="checks"></div></div></div><p class="note">تظهر القوائم بالتدرج: المجال ← المجال الفرعي ← ناتج التعلم ← المؤشرات.</p><div class="actions"><button class="btn" onclick="pdf()">إنشاء تقرير PDF</button><a class="btn back" href="nafs.html">رجوع</a></div></div></div><section class="wrap report"><div class="head"><h1>تقرير خطة نافس المستدامة</h1></div><div id="reportBody"></div></section><script>const O=(n,i)=>({n,i}),S=(n,o)=>({n,o}),D=(n,s)=>({n,s});const g6math=[D('الأعداد والعمليات عليها',[S('الأعداد ومجموعات الأعداد',[O('فهم القيمة المنزلية للأعداد ضمن 12 منزلة، وتمثيلها، وقراءتها وكتابتها، والمقارنة بينها، وترتيبها، وتقريبها.',['يحدد القيمة المنزلية للأرقام في الأعداد ضمن 12 منزلة، ويمثلها على خط الأعداد، ويقربها إلى أقرب منزلة معطاة.','يقرأ الأعداد ضمن 12 منزلة، ويكتبها في الصور القياسية واللفظية والتحليلية.','يقارن بين الأعداد ضمن 12 منزلة باستخدام الرموز (<، >، =)، ويرتبها تصاعديًا وتنازليًا.']),O('تمييز الكسور الاعتيادية، والأعداد الكسرية، والكسور غير الفعلية، وتمثيلها، وقراءتها، وكتابتها، والمقارنة بينها، وترتيبها، وتقريبها.',['يميز الكسر الاعتيادي، ويمثله باستخدام النماذج والرسوم وخط الأعداد، ويقرؤه ويكتبه.','يوجد الكسور المكافئة لكسر، ويكتب كسرًا في أبسط صورة، ويقربه إلى الصفر أو النصف أو الواحد.','يميز العدد الكسري، ويمثله باستخدام النماذج والرسوم وخط الأعداد، ويقرؤه ويكتبه.','يميز الكسر غير الفعلي، ويحوله إلى عدد كسري والعكس.','يقارن بين الكسور والأعداد الكسرية، ويرتبها تصاعديًا وتنازليًا.']),O('فهم الكسور العشرية، وتمثيلها، وتحديد القيمة المنزلية لرقم فيها، وقراءتها، وكتابتها، والمقارنة بينها، وترتيبها، وتقريبها، والتحويل بينها وبين الكسور الاعتيادية والأعداد الكسرية.',['يميز الكسور العشرية، ويمثلها باستخدام النماذج والرسوم وخط الأعداد، ويحدد القيمة المنزلية للأرقام فيها، ويقربها إلى أقرب عدد كلي أو أقرب منزلة معطاة.','يقرأ الكسور العشرية، ويكتبها في الصور القياسية واللفظية والتحليلية.','يقارن بين الكسور العشرية، ويرتبها تصاعديًا وتنازليًا، ويحول بينها وبين الكسور الاعتيادية والأعداد الكسرية.'])]),S('العمليات على الأعداد والحس العددي',[O('جمع الأعداد الكلية وطرحها ضمن سبع منازل، وضرب الأعداد ضمن ثلاث منازل على الأكثر، وقسمة الأعداد من أربع منازل على الأكثر على أعداد من منزلتين على الأكثر، وحل مسائل رياضية عليها تتضمن تطبيقات حياتية.',['يجمع الأعداد ضمن سبع منازل ويطرحها (دون إعادة التجميع ومعه).','يضرب عددًا من ثلاث منازل على الأكثر في عدد من منزلتين على الأكثر باستخدام الإستراتيجيات المعتمدة على القيمة المنزلية.','يقسم عددًا من أربع منازل على الأكثر على عدد من منزلتين على الأكثر (دون باق وبباق) باستخدام الإستراتيجيات المعتمدة على القيمة المنزلية.','يحل مسائل رياضية من ثلاث خطوات على الأكثر تتضمن تطبيقات حياتية على العمليات الأربع، ويفسر حلها.']),O('تمييز عوامل عدد ومضاعفاته، وتمثيلها، وإيجادها، وحل مسائل رياضية عليها تتضمن تطبيقات حياتية.',['يوجد عوامل عدد، ويمثلها باستخدام النماذج والرسوم.','يوجد مضاعفات عدد، ويمثلها باستخدام النماذج والرسوم.','يميز الأعداد الأولية والأعداد غير الأولية، ويمثلها باستخدام النماذج والرسوم.','يحلل عددًا إلى عوامله الأولية، ويستخدم التحليل إلى عوامل ليوجد القاسم المشترك الأكبر والمضاعف المشترك الأصغر لعددين أو أكثر.','يحل مسائل رياضية تتضمن تطبيقات حياتية على القاسم المشترك الأكبر والمضاعف المشترك الأصغر، ويفسر حلها.']),O('فهم قوى عدد كلي، وتمثيلها، وإيجادها، وإيجاد قيم عبارات عددية تتضمنها، وحل مسائل رياضية عليها تتضمن تطبيقات حياتية.',['يميز قوة عدد كلي (الأس عدد كلي) بوصفها ضربًا متكررًا، ويوجدها.','يميز العبارة العددية، ويكتبها، ويوجد قيم عبارات عددية تتضمن قوى وأقواسًا باستخدام ترتيب العمليات.','يحل مسائل رياضية تتضمن تطبيقات حياتية على عبارات عددية تتضمن قوى عدد كلي، ويفسر حلها.']),O('فهم النسبة، والمعدل، والنسبة المئوية، والتناسب، والتمييز بينها، وإيجادها، وحل مسائل رياضية عليها تتضمن تطبيقات حياتية.',['يميز النسبة والمعدل، ويوجدهما، ويعبر عنهما ككسور اعتيادية في أبسط صورة.','يميز النسبة المئوية، ويمثلها باستخدام النماذج والرسوم، ويوجدها، ويعبر عنها ككسر عشري أو اعتيادي في أبسط صورة.','يميز التناسب، ويحله، ويحدد الكميات المتناسبة.','يحل مسائل رياضية تتضمن تطبيقات حياتية على النسبة والمعدل والنسبة المئوية والتناسب، ويفسر حلها.']),O('إجراء العمليات الأربع على الكسور الاعتيادية والأعداد الكسرية، وحل مسائل رياضية عليها تتضمن تطبيقات حياتية.',['يجمع الكسور الاعتيادية المتشابهة وغير المتشابهة، ويطرحها، ويكتب الناتج في أبسط صورة.','يجمع الأعداد الكسرية، ويطرحها، ويكتب الناتج في أبسط صورة.','يضرب الكسور الاعتيادية، ويقسمها، ويكتب الناتج في أبسط صورة.','يضرب الأعداد الكسرية، ويقسمها، ويكتب الناتج في أبسط صورة.','يحل مسائل رياضية من ثلاث خطوات على الأكثر تتضمن تطبيقات حياتية على العمليات الأربع على الكسور والأعداد الكسرية، ويفسر حلها.']),O('إجراء العمليات الأربع على الكسور العشرية، وحل مسائل رياضية عليها تتضمن تطبيقات حياتية.',['يجمع الكسور العشرية حتى الجزء من ألف، ويطرحها.','يضرب الكسور العشرية حتى الجزء من مئة، ويقسمها.','يحل مسائل رياضية من ثلاث خطوات على الأكثر تتضمن تطبيقات حياتية على العمليات الأربع على الكسور العشرية، ويفسر حلها.']),O('تقدير نواتج العمليات الأربع على الأعداد الكلية، والكسور الاعتيادية والعشرية، واستخدام استراتيجيات الحساب الذهني لإيجاد النواتج، والتحقق من معقولية النواتج وصحتها.',['يقدر نواتج العمليات الأربع على الأعداد الكلية والكسور الاعتيادية والأعداد الكسرية والكسور العشرية مستخدمًا التقريب.','يستخدم الحساب الذهني لإيجاد ناتج ضرب عدد من منزلتين على الأكثر وقسمته في/على مضاعفات (10، 100، 1000).','يستخدم خاصية التوزيع لضرب عدد من منزلتين في عدد من منزلة واحدة ذهنيًا.','يستخدم الحساب الذهني لإيجاد ناتج ضرب الكسور العشرية ضمن الأجزاء حتى ألف وقسمتها في/على (10، 100، 1000).','يتحقق من معقولية أو صحة نواتج العمليات الأربع على الأعداد الكلية والكسور الاعتيادية والعشرية والأعداد الكسرية مستخدمًا التقدير التقريبي أو الحساب الذهني.'])])]),D('الجبر والتحليل',[S('الأنماط والعلاقات والدوال',[O('تمييز الأنماط العددية والهندسية المتنامية، وتكوينها وتعميمها، واستكشاف العلاقات من جداول البيانات، وحل مسائل رياضية عليها تتضمن تطبيقات حياتية.',['يميز الأنماط العددية المتنامية، ويعبر عنها ويوسعها ويكمل العناصر المفقودة فيها ويكونها ويعممها.','يميز الأنماط الهندسية المتنامية، ويوسعها ويكمل العناصر المفقودة فيها ويكونها ويعممها.','يعبر عن العلاقة بين مجموعتين من البيانات في جدول المدخلات والمخرجات بالكلمات والرموز والأزواج المرتبة، ويمثلها في المستوى الإحداثي.','يكمل البيانات في جداول المدخلات والمخرجات ويوسعها ويكون جداول وفق قاعدة معطاة.','يحل مسائل رياضية تتضمن تطبيقات حياتية على الأنماط وجداول المدخلات والمخرجات، ويفسر حلها.'])]),S('البنى الجبرية والعبارات الرياضية',[O('تمييز العبارات الجبرية، وكتابتها، وإيجاد قيمها، وحل المعادلة الخطية البسيطة، وحل مسائل رياضية عليها تتضمن تطبيقات حياتية.',['يميز العبارة الجبرية، ويكتبها مستخدمًا الأقواس، ويوجد قيمتها باستخدام ترتيب العمليات.','يميز المعادلة الخطية البسيطة (ذات الخطوة الواحدة)، ويكتبها، ويحلها ذهنيًا وباستخدام النماذج.','يحل مسائل رياضية تتضمن تطبيقات حياتية على العبارات الجبرية والمعادلات الخطية البسيطة، ويفسر حلها.'])])]),D('الهندسة والقياس',[S('الأشكال الهندسية',[O('تمييز المفاهيم الهندسية الأولية، وتحديد أنواع الزوايا، والعلاقات بين المستقيمات، والعلاقات بين الزوايا.',['يميز النقطة والمستقيم ونصف المستقيم والقطعة المستقيمة، ويحددها على الأشكال الهندسية.','يميز الزوايا (القائمة والحادة والمنفرجة والمستقيمة) ويقدر قياسها ويوجده.','يميز المستقيمات المتقاطعة والمتوازية والمتعامدة، ويحددها على الأشكال الهندسية.','يميز الزاويتين المتقابلتين بالرأس والمتجاورتين والمتتامتين والمتكاملتين، ويستخدمها في إيجاد قياسات زوايا مجهولة.']),O('فهم خصائص الأشكال الهندسية ثنائية الأبعاد وثلاثية الأبعاد، واستخدامها في تحديد عناصرها، وتصنيفها.',['يميز المضلع، ويصنف المضلعات إلى منتظمة وغير منتظمة، ويسميها.','يميز المثلث والدائرة، ويحدد عناصرهما ويسميهما، ويصنف المثلثات وفقًا لأطوال أضلاعها وقياسات زواياها.','يميز الأشكال الرباعية، ويحدد عناصرها ويسميها ويصنفها وفقًا لخصائص أضلاعها وزواياها.','يميز المنشور (الثلاثي والرباعي والمكعب)، ويحدد رؤوسها وأحرفها وأوجهها وقواعدها، ويرسم مخططاتها.','يحدد مجموع زوايا المثلث ومجموع زوايا الرباعي، ويستخدمها في إيجاد قياسات زوايا مجهولة.'])]),S('الإحداثيات والتحويلات الهندسية',[O('استخدام المستوى الإحداثي لتسمية المواقع، وتعيينها، وتمييز التحويلات الهندسية، وإجراؤها.',['يميز عناصر المستوى الإحداثي (الربع الأول)، ويسمي مواقع النقاط فيه ويعينها مستخدمًا الأزواج المرتبة، ويرسم مضلعات بمعلومية إحداثيات رؤوسها.','يميز الانسحاب في المستوى الإحداثي ويرسم صورة شكل بانسحاب معطى.','يميز الانعكاس حول محور في المستوى الإحداثي ويرسم صورة شكل بانعكاس معطى.','يميز الدوران حول نقطة في المستوى الإحداثي ويرسم صورة شكل بدوران معطى.'])]),S('القياس ووحداته',[O('تمييز العلاقات بين وحدات الطول والكتلة والسعة والزمن، واستخدامها في التحويل بين كل منها.',['يحدد وحدة قياس الطول المناسبة، ويميز العلاقات بين وحدات الطول المترية ويستخدمها في التحويل بينها.','يحدد وحدة قياس الكتلة المناسبة، ويميز العلاقات بين وحدات الكتلة المترية ويستخدمها في التحويل بينها.','يحدد وحدة قياس السعة المناسبة، ويميز العلاقات بين وحدات السعة المترية ويستخدمها في التحويل بينها.','يميز العلاقات بين وحدات الزمن ويستخدمها في التحويل بينها.']),O('تمييز صيغ المحيط والمساحة لأشكال ثنائية الأبعاد، واستخدامها في إيجاد المحيط والمساحة، وحل مسائل رياضية عليها تتضمن تطبيقات حياتية.',['يميز صيغ محيطات المستطيل والمربع والدائرة، ويستخدمها في إيجاد المحيط.','يميز صيغ مساحات المستطيل والمربع ومتوازي الأضلاع والمثلث، ويستخدمها في حساب مساحاتها ومساحات أشكال مركبة منها.','يحل مسائل رياضية تتضمن تطبيقات حياتية على محيطات الأشكال الهندسية ومساحاتها، ويفسر حلها.']),O('فهم الحجم، والمساحة السطحية ووحدات قياسها، وتمييز صيغتيهما للمنشور الرباعي القائم واستخدامهما في إيجادهما، وحل مسائل رياضية عليهما تتضمن تطبيقات حياتية.',['يقدر الحجم، ويقيسه مستخدمًا الوحدة المترية المناسبة.','يميز صيغة حجم المنشور الرباعي القائم، ويستخدمها في حساب حجمه.','يميز صيغة المساحة السطحية للمنشور الرباعي القائم، ويستخدمها في تقدير المساحة السطحية وحسابها.','يحل مسائل رياضية تتضمن تطبيقات حياتية على حجم المنشور الرباعي القائم ومساحته السطحية، ويفسر حلها.'])])]),D('الإحصاء والاحتمالات',[S('الإحصاء والتمثيلات البيانية',[O('جمع بيانات كمية ونوعية واقعية، وتنظيمها، وتمثيلها، وقراءتها، وتفسيرها.',['يجمع بيانات كمية ونوعية واقعية، وينظمها في جداول تكرارية، ويمثلها باستخدام النقاط والخطوط البيانية والأعمدة البيانية.','يقرأ البيانات الممثلة بالنقاط والخطوط البيانية والأعمدة البيانية والقطاعات الدائرية، ويفسرها.','يقارن بين التمثيلات المختلفة للبيانات، ويحدد التمثيل الأنسب لبيانات معطاة.'])]),S('تحليل البيانات وتفسيرها',[O('فهم مقاييس النزعة المركزية والمدى والتمييز بينها، وإيجادها، وتفسيرها.',['يميز المتوسط الحسابي والوسيط والمنوال والمدى، ويوجدها لمجموعة من القيم المفردة، ويفسرها في سياق القيم.','يوجد المتوسط الحسابي والوسيط والمنوال والمدى للبيانات الممثلة بالنقاط والأعمدة البيانية، ويفسرها.','يحدد القيم المتطرفة لمجموعة من البيانات، ويصف أثرها على المتوسط الحسابي.'])]),S('حساب الاحتمالات',[O('فهم التجربة العشوائية، وإيجاد نواتجها، والتعبير عن احتمالات وقوعها، وحل مسائل رياضية عليها تتضمن تطبيقات حياتية.',['يوجد نواتج التجربة العشوائية الممكنة وعددها مستخدمًا الجداول والقوائم المنظمة والرسم الشجري ومبدأ العد.','يميز الحادثة، ويعبر عن احتمال وقوعها باستخدام الكلمات والكسور الاعتيادية والعشرية والنسب المئوية.','يحل مسائل رياضية تتضمن تطبيقات حياتية على الاحتمالات، ويفسر حلها، ويستخدمها للتنبؤ.'])])])];const DATA={g6:{math:g6math},g3:{},g9:{}};const labels={math:'الرياضيات',reading:'القراءة',science:'العلوم الطبيعية'};function loadSubjects(){subject.innerHTML='';let keys=Object.keys(DATA[grade.value]||{});if(!keys.length){subject.add(new Option('سيتم إدخال بيانات هذا الصف من الوثيقة',''));domain.innerHTML=sub.innerHTML=outcome.innerHTML='';indicators.innerHTML='<div class="check">بي

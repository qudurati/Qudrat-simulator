<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تعيين كلمة مرور جديدة | محاكي القدرات</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#10254a}.wrap{max-width:520px;margin:60px auto;padding:18px}.card{background:#fff;border:1px solid #d8e0ea;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(16,37,74,.06)}h1{margin:0 0 8px}.muted{color:#667085;line-height:1.8;margin:0 0 22px}.form{display:grid;gap:12px}.form label{font-weight:700;font-size:14px}.form input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.primary{margin-top:4px;padding:12px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-size:16px;font-weight:800}.primary:disabled{opacity:.6;cursor:not-allowed}.msg{min-height:24px;margin-top:12px;color:#b42318;line-height:1.7}.msg.ok{color:#15803d}.home{display:inline-block;margin-top:15px;color:#173866;text-decoration:none}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<h1>تعيين كلمة مرور جديدة</h1>
<p class="muted">أدخل كلمة المرور الجديدة لحسابك. بعد حفظها يمكنك تسجيل الدخول برقم الجوال وكلمة المرور الجديدة.</p>
<form id="resetForm" class="form">
<label>كلمة المرور الجديدة</label><input id="password" type="password" required minlength="8" autocomplete="new-password" disabled>
<label>تأكيد كلمة المرور</label><input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password" disabled>
<button id="saveBtn" class="primary" type="submit" disabled>حفظ كلمة المرور</button>
</form>
<div id="msg" class="msg">جارٍ التحقق من رابط الاستعادة...</div>
<a class="home" href="login.html">العودة لتسجيل الدخول</a>
</section></main>
<script>
const db=window.getQudratSupabase();
const form=document.getElementById('resetForm'),msg=document.getElementById('msg'),saveBtn=document.getElementById('saveBtn'),passwordInput=document.getElementById('password'),confirmInput=document.getElementById('confirmPassword');
let recoveryReady=false;
function ready(){if(recoveryReady)return;recoveryReady=true;passwordInput.disabled=false;confirmInput.disabled=false;saveBtn.disabled=false;msg.textContent='تم التحقق من رابط الاستعادة. يمكنك الآن اختيار كلمة مرور جديدة.';msg.classList.add('ok')}
function invalid(){if(recoveryReady)return;passwordInput.disabled=true;confirmInput.disabled=true;saveBtn.disabled=true;msg.classList.remove('ok');msg.textContent='رابط الاستعادة غير صالح أو منتهي. اطلب رابطًا جديدًا من صفحة تسجيل الدخول.'}
const hashParams=new URLSearchParams(location.hash.replace(/^#/,''));
const queryParams=new URLSearchParams(location.search);
const hasRecoveryMarker=hashParams.get('type')==='recovery'||queryParams.get('type')==='recovery'||queryParams.has('code');
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')ready()});
setTimeout(()=>{if(!recoveryReady)invalid()},2500);
form.onsubmit=async e=>{e.preventDefault();msg.classList.remove('ok');if(!recoveryReady){invalid();return}const password=passwordInput.value,confirmPassword=confirmInput.value;if(password.length<8){msg.textContent='كلمة المرور يجب أن تكون 8 أحرف أو أرقام على الأقل.';return}if(password!==confirmPassword){msg.textContent='كلمتا المرور غير متطابقتين.';return}saveBtn.disabled=true;msg.textContent='جارٍ حفظ كلمة المرور...';const {error}=await db.auth.updateUser({password});if(error){saveBtn.disabled=false;msg.textContent='تعذر تغيير كلمة المرور. قد يكون الرابط منتهيًا؛ اطلب رابط استعادة جديدًا.';return}recoveryReady=false;passwordInput.disabled=true;confirmInput.disabled=true;msg.classList.add('ok');msg.textContent='تم تغيير كلمة المرور بنجاح. سيتم نقلك إلى تسجيل الدخول...';await db.auth.signOut();localStorage.removeItem('sb-lqvfvpvyzoupdyqahwjy-auth-token');setTimeout(()=>location.replace('login.html'),1200)};
</script>
</body></html>

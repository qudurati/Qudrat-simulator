<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير مسرد الحصص — PDF</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f5;font-family:Tahoma,Arial;color:#172033}.bar{position:sticky;top:0;z-index:2;background:#fff;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;box-shadow:0 1px 4px #0002}.bar h2{width:100%;text-align:center;margin:4px 0 10px;font-size:22px}.bar button{flex:1;border:0;border-radius:12px;padding:14px 8px;font:bold 17px Tahoma,Arial;background:#eceef4;color:#30384d;cursor:pointer}.bar .print{background:#24594b;color:#fff}.bar .share{background:#5538c8;color:#fff;flex-basis:100%}.stage{padding:12px;max-width:1150px;margin:auto}iframe{width:100%;height:calc(100vh - 240px);min-height:550px;background:#fff;border:0;box-shadow:0 2px 10px #0002}@media(min-width:800px){.bar h2{width:auto;margin-inline-end:24px}.bar button{flex:0 1 170px}.bar .share{flex:0 1 170px}iframe{height:calc(100vh - 120px)}}</style></head><body><div class="bar"><h2>مسرد الحصص — PDF</h2><button id="back">رجوع</button><button class="print" id="print">طباعة PDF</button><button id="save">حفظ في الملفات</button><button class="share" id="share">مشاركة PDF</button></div><div class="stage"><iframe id="preview" title="معاينة مسرد الحصص"></iframe><p id="status"></p></div><script>const data=sessionStorage.getItem('nafsLessonPdf'),name=sessionStorage.getItem('nafsLessonPdfName')||'مسرد-الحصص.pdf',status=document.getElementById('status');let blob,url;if(data){const raw=atob(data.split(',')[1]),arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);blob=new Blob([arr],{type:'application/pdf'});url=URL.createObjectURL(blob);document.getElementById('preview').src=url+'#toolbar=0&navpanes=0';}else status.textContent='لم يتم العثور على التقرير. ارجع وأنشئ المسرد من جديد.';document.getElementById('back').onclick=()=>location.href=sessionStorage.getItem('nafsLessonReturn')||'/nafs-lesson-log-owner-trial.html';document.getElementById('save').onclick=()=>{if(!url)return;const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()};document.getElementById('print').onclick=()=>{if(!url)return;const w=window.open(url,'_blank');if(!w)document.getElementById('preview').contentWindow?.print()};document.getElementById('share').onclick=async()=>{if(!blob)return;const file=new File([blob],name,{type:'application/pdf'});try{if(navigator.canShare?.({files:[file]})&&navigator.share)await navigator.share({files:[file],title:'مسرد الحصص'});else{status.textContent='المشاركة المباشرة غير مدعومة في هذا المتصفح. استخدم حفظ في الملفات ثم شارك الملف.'}}catch(e){if(e.name!=='AbortError')status.textContent='تعذرت المشاركة: '+e.message}};</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير مسرد الحصص — PDF</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f5;font-family:Tahoma,Arial;color:#172033}.bar{position:sticky;top:0;z-index:2;background:#fff;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;box-shadow:0 1px 4px #0002}.bar h2{width:100%;text-align:center;margin:2px 0 5px;font-size:18px}.bar button{flex:1;border:0;border-radius:9px;padding:9px 5px;font:bold 13px Tahoma,Arial;background:#eceef4;color:#30384d;cursor:pointer}.bar .print{background:#24594b;color:#fff}.bar .share{background:#5538c8;color:#fff;flex-basis:100%}.stage{padding:12px;max-width:1150px;width:100%;min-width:0;margin:auto;overflow-x:hidden}#preview{width:100%;min-width:0;overflow:hidden}.page-preview{width:100%;max-width:100%;height:auto;aspect-ratio:1120/792;background:#fff;box-shadow:0 2px 10px #0002;margin:0 0 14px;display:block;object-fit:contain}@media(min-width:800px){.bar h2{width:auto;margin-inline-end:24px}.bar button{flex:0 1 140px}.bar .share{flex:0 1 140px}}</style></head><body><div class="bar"><h2>مسرد الحصص — PDF</h2><button id="back">رجوع</button><button class="print" id="print">طباعة PDF</button><button id="save">حفظ في الملفات</button><button class="share" id="share">مشاركة PDF</button></div><div class="stage"><div id="preview" aria-label="معاينة صفحات المسرد"></div><p id="status"></p></div><script>const status=document.getElementById('status');let blob,url,name='مسرد-الحصص.pdf';
function showReport(record){blob=record.blob;name=record.name||name;url=URL.createObjectURL(blob);const previews=record.previewBlobs||[];if(previews.length){previews.forEach((part,i)=>{const img=document.createElement('img');img.className='page-preview';img.alt='صفحة المسرد '+(i+1);img.src=URL.createObjectURL(part);document.getElementById('preview').appendChild(img)})}else{const frame=document.createElement('iframe');frame.style.cssText='display:block;width:100%;max-width:100%;height:min(74vh,760px);border:0;overflow:hidden';frame.src=url+'#view=Fit&zoom=page-fit';document.getElementById('preview').appendChild(frame)}}
const params=new URLSearchParams(location.search);const requestedReport=params.get('report');const expectedTeacher=params.get('teacher');if(requestedReport)status.textContent='جارٍ التحقق من التقرير الجديد...';
const request=indexedDB.open('nafsLessonPdfStore',1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('reports'))request.result.createObjectStore('reports')};request.onerror=()=>status.textContent='تعذر فتح التقرير المخزن.';request.onsuccess=()=>{const db=request.result,tx=db.transaction('reports','readonly'),get=tx.objectStore('reports').get(params.get('id')||'latest');get.onsuccess=()=>{if(get.result?.blob){const record=get.result;if(requestedReport&&(!record.createdAt||Math.abs(Number(requestedReport)-record.createdAt)>30000)){status.textContent='المعاينة تعرض تقريرًا قديمًا، ولم يُعثر على التقرير الجديد. ارجع وأنشئ المسرد مرة أخرى.';return}if(expectedTeacher!==null&&record.teacher!==undefined&&record.teacher!==expectedTeacher){status.textContent='تقرير المعاينة لا يطابق بيانات المعلمة الحالية. ارجع وأنشئ تقريرًا جديدًا.';return}showReport(record)}else status.textContent='لم يتم العثور على ملف التقرير الجديد. ارجع وأنشئ المسرد من جديد.'};get.onerror=()=>status.textContent='تعذر قراءة التقرير.';tx.oncomplete=()=>db.close()};
document.getElementById('back').onclick=()=>location.href=sessionStorage.getItem('nafsLessonReturn')||'/nafs-lesson-log-owner-trial.html';document.getElementById('save').onclick=async()=>{if(!blob)return;const file=new File([blob],name,{type:'application/pdf'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:name});status.textContent='اختر «حفظ في الملفات» من قائمة المشاركة لحفظ PDF على الآيفون.';return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();status.textContent='إذا لم يبدأ الحفظ، افتح الملف من المتصفح واختر «حفظ في الملفات».'};document.getElementById('print').onclick=()=>{if(!url)return;const w=window.open(url,'_blank');if(!w)document.getElementById('preview').contentWindow?.print()};document.getElementById('share').onclick=async()=>{if(!blob)return;const file=new File([blob],name,{type:'application/pdf'});try{if(navigator.canShare?.({files:[file]})&&navigator.share)await navigator.share({files:[file],title:'مسرد الحصص'});else{status.textContent='المشاركة المباشرة غير مدعومة في هذا المتصفح. استخدم حفظ في الملفات ثم شارك الملف.'}}catch(e){if(e.name!=='AbortError')status.textContent='تعذرت المشاركة: '+e.message}};</script></body></html>

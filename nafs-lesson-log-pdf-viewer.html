<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير مسرد الحصص — PDF</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f5;font-family:Tahoma,Arial;color:#172033}.bar{position:sticky;top:0;z-index:2;background:#fff;padding:7px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:center;box-shadow:0 1px 4px #0002}.bar h2{grid-column:1/-1;text-align:center;margin:2px 0 6px;font-size:17px}.bar button{width:100%;min-width:0;min-height:34px;border:0;border-radius:7px;padding:7px 2px;font:bold 11px Tahoma,Arial;white-space:nowrap;background:#eceef4;color:#30384d;cursor:pointer}.bar .print{background:#24594b;color:#fff}.bar .share{background:#5538c8;color:#fff}.stage{padding:12px;max-width:1150px;margin:auto}.page-preview{width:100%;aspect-ratio:2200/1556;background:#fff;box-shadow:0 2px 10px #0002;margin:0 0 14px;display:block;object-fit:contain}@media(min-width:800px){.bar{display:flex;justify-content:center}.bar h2{margin:0 15px;font-size:17px}.bar button{width:auto;min-width:115px;padding:8px 12px;font-size:12px}}</style><style id="vectorStyle">@page{size:A4 landscape;margin:0}#vectorPages{display:none}.sheet{width:297mm;height:210mm;box-sizing:border-box;background:white;padding:5mm 6mm 4mm;direction:rtl;display:flex;flex-direction:column;break-after:page;page-break-after:always;color:#262b39}.sheet header{background:#f3f0ff;border:1px solid #d6cdf0;padding:2mm;margin-bottom:2.5mm}.sheet h1{font-size:14pt;text-align:right;color:#513b9b;margin:0 0 2mm}.info{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1.4mm}.info-card{border:1px solid #d4cbea;background:#fff;text-align:center;min-width:0;min-height:11mm;display:flex;flex-direction:column;justify-content:center;padding:1mm;overflow-wrap:anywhere}.info-card strong{color:#5c419c;font-size:9pt}.info-card span{font-size:9pt;font-weight:700}.weeks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:2.2mm;flex:1;min-height:0}.week{border:1px solid #c8bfe9;background:#f8f6ff;min-height:0;display:flex;flex-direction:column;overflow:hidden}.week h2{background:#5b45a8;color:white;font-size:10pt;padding:2mm;margin:0;line-height:1.2}.lesson{padding:1.5mm 2mm;flex:1;min-height:0;border-bottom:1px solid #ddd7ef;overflow:hidden}.lesson b{font-size:8.5pt;color:#4b3994}.lesson p{font-size:8.3pt;line-height:1.32;white-space:pre-line;margin:1mm 0 0;overflow-wrap:anywhere}.sheet footer{text-align:left;font-size:7pt;color:#6b7280;padding-top:1mm}@media print{html,body{background:white!important;margin:0!important}.bar,.stage{display:none!important}#vectorPages{display:block!important}.sheet{margin:0!important;box-shadow:none!important}.sheet:last-child{break-after:auto;page-break-after:auto}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}@media screen{#vectorPages.preview-mode{display:block;max-width:1200px;margin:10px auto}.preview-mode .sheet{width:100%;height:auto;aspect-ratio:297/210;margin-bottom:12px;box-shadow:0 2px 10px #0002}.preview-mode .weeks{min-height:0}.preview-mode .week{min-height:0}}</style></head><body><div class="bar"><h2>مسرد الحصص — PDF</h2><button id="back">رجوع</button><button class="print" id="print">طباعة PDF</button><button id="save">حفظ في الملفات</button><button class="share" id="share">مشاركة PDF</button></div><div class="stage"><div id="preview" aria-label="معاينة صفحتي المسرد"></div><p id="status"></p></div><div id="vectorPages"></div><script>const vector=sessionStorage.getItem('nafsLessonVectorHTML');if(vector){document.getElementById('vectorPages').innerHTML=vector;document.getElementById('vectorPages').classList.add('preview-mode');document.getElementById('vectorPages').style.display='block';document.getElementById('preview').style.display='none'}const data=sessionStorage.getItem('nafsLessonPdf'),name=sessionStorage.getItem('nafsLessonPdfName')||'مسرد-الحصص.pdf',status=document.getElementById('status');let blob,url;if(data){const raw=atob(data.split(',')[1]),arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);blob=new Blob([arr],{type:'application/pdf'});url=URL.createObjectURL(blob);const pages=sessionStorage.getItem('nafsLessonPreviewPages');if(pages){try{JSON.parse(pages).forEach((src,i)=>{const img=document.createElement('img');img.className='page-preview';img.alt='صفحة المسرد '+(i+1);img.src=src;document.getElementById('preview').appendChild(img)})}catch(e){status.textContent='تعذرت معاينة الصفحات'}}else{const frame=document.createElement('iframe');frame.style.cssText='width:100%;height:65vh;border:0';frame.src=url+'#view=FitH';document.getElementById('preview').appendChild(frame)}}else if(!vector)status.textContent='لم يتم العثور على التقرير. ارجع وأنشئ المسرد من جديد.';document.getElementById('back').onclick=()=>location.href=sessionStorage.getItem('nafsLessonReturn')||'/nafs-lesson-log-owner-trial.html';document.getElementById('save').onclick=async()=>{if(sessionStorage.getItem('nafsLessonVectorHTML')){status.textContent='من نافذة الطباعة اختر حفظ كملف PDF للحصول على نص واضح.';window.print();return}if(!blob)return;const file=new File([blob],name,{type:'application/pdf'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:name});status.textContent='اختر «حفظ في الملفات» من قائمة المشاركة لحفظ PDF على الآيفون.';return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();status.textContent='إذا لم يبدأ الحفظ، افتح الملف من المتصفح واختر «حفظ في الملفات».'};document.getElementById('print').onclick=()=>{if(!sessionStorage.getItem('nafsLessonVectorHTML'))return;window.print()};document.getElementById('share').onclick=()=>{if(!sessionStorage.getItem('nafsLessonVectorHTML'))return;status.textContent='للمشاركة بجودة النص الأصلية: افتح معاينة الطباعة، ثم استخدم زر المشاركة في الآيفون لمشاركة ملف PDF.';window.print()};</script></body></html>

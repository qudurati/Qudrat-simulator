<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير مسرد الحصص — PDF</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f5;font-family:Tahoma,Arial;color:#172033}.bar{position:sticky;top:0;z-index:2;background:#fff;padding:7px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:center;box-shadow:0 1px 4px #0002}.bar h2{grid-column:1/-1;text-align:center;margin:2px 0 6px;font-size:17px}.bar button{width:100%;min-width:0;min-height:34px;border:0;border-radius:7px;padding:7px 2px;font:bold 11px Tahoma,Arial;white-space:nowrap;background:#eceef4;color:#30384d;cursor:pointer}.bar .print{background:#24594b;color:#fff}.bar .share{background:#5538c8;color:#fff}.stage{padding:12px;max-width:1150px;margin:auto}.page-preview{width:100%;aspect-ratio:2200/1556;background:#fff;box-shadow:0 2px 10px #0002;margin:0 0 14px;display:block;object-fit:contain}@media(min-width:800px){.bar{display:flex;justify-content:center}.bar h2{margin:0 15px;font-size:17px}.bar button{width:auto;min-width:115px;padding:8px 12px;font-size:12px}}</style><style id="vectorStyle">@page{size:A4 landscape;margin:0}#vectorPages{display:none}.sheet{width:297mm;height:210mm;box-sizing:border-box;background:white;padding:5mm 6mm 4mm;direction:rtl;display:flex;flex-direction:column;break-after:page;page-break-after:always;color:#262b39}.sheet header{background:#f3f0ff;border:1px solid #d6cdf0;padding:2mm;margin-bottom:2.5mm}.sheet h1{font-size:14pt;text-align:right;color:#513b9b;margin:0 0 2mm}.info{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1.4mm}.info-card{border:1px solid #d4cbea;background:#fff;text-align:center;min-width:0;min-height:11mm;display:flex;flex-direction:column;justify-content:center;padding:1mm;overflow-wrap:anywhere}.info-card strong{color:#5c419c;font-size:9pt}.info-card span{font-size:9pt;font-weight:700}.weeks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:2.2mm;flex:1;min-height:0}.week{border:1px solid #c8bfe9;background:#f8f6ff;min-height:0;display:flex;flex-direction:column;overflow:hidden}.week h2{background:#5b45a8;color:white;font-size:10pt;padding:2mm;margin:0;line-height:1.2}.lesson{padding:1.5mm 2mm;flex:1;min-height:0;border-bottom:1px solid #ddd7ef;overflow:hidden}.lesson b{font-size:8.5pt;color:#4b3994}.lesson p{font-size:8.3pt;line-height:1.32;white-space:pre-line;margin:1mm 0 0;overflow-wrap:anywhere}.sheet footer{text-align:left;font-size:7pt;color:#6b7280;padding-top:1mm}@media print{html,body{background:white!important;margin:0!important}.bar,.stage{display:none!important}#vectorPages{display:block!important}.sheet{margin:0!important;box-shadow:none!important}.sheet:last-child{break-after:auto;page-break-after:auto}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}@media screen{#vectorPages.preview-mode{display:block;max-width:1200px;margin:10px auto;overflow-x:auto}.preview-mode .sheet{width:1122px;height:794px;min-width:1122px;aspect-ratio:auto;margin:0 auto 12px;box-shadow:0 2px 10px #0002}.preview-mode .weeks{min-height:0}.preview-mode .week{min-height:0}}.sheet h1{font-size:12pt}.info-card{min-height:10mm;padding:.5mm}.info-card strong{font-size:8pt}.info-card span{font-size:8pt}.week h2{font-size:9pt;padding:1.4mm}.lesson{padding:1mm 1.5mm}.lesson b{font-size:7.6pt}.lesson p{font-size:7.4pt;line-height:1.22}@media screen and (max-width:700px){#vectorPages.preview-mode{width:100%;overflow:hidden}.preview-mode .sheet{transform-origin:top right;transform:scale(var(--preview-scale, .33));margin-bottom:calc(-794px * (1 - var(--preview-scale, .33)) + 12px)!important;margin-left:0!important;margin-right:0!important}}.week{min-height:0}.lesson{flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:.45mm 1mm;overflow:hidden}.lesson b{font-size:6.4pt;line-height:1.05;flex-shrink:0}.lesson p{font-size:6.2pt;line-height:1.08;margin:.2mm 0 0;overflow:hidden}.week h2{font-size:8pt;padding:1mm;flex-shrink:0}.sheet:has(.week .lesson:nth-child(6)) .lesson{padding:.25mm .8mm}.sheet:has(.week .lesson:nth-child(6)) .lesson b{font-size:5.8pt}.sheet:has(.week .lesson:nth-child(6)) .lesson p{font-size:5.6pt}</style><script src="/vendor/nafs-pdf/pdfmake.min.js"></script></head><body><div class="bar"><h2>مسرد الحصص — PDF</h2><button id="back">رجوع</button><button class="print" id="print">طباعة PDF</button><button id="save">حفظ في الملفات</button><button class="share" id="share">مشاركة PDF</button></div><div class="stage"><div id="preview" aria-label="معاينة صفحتي المسرد"></div><p id="status"></p></div><div id="vectorPages"></div><script>const vector=sessionStorage.getItem('nafsLessonVectorHTML');if(vector){document.getElementById('vectorPages').innerHTML=vector;document.getElementById('vectorPages').classList.add('preview-mode');document.getElementById('vectorPages').style.display='block';const scale=Math.min(1,(document.documentElement.clientWidth-16)/1122);document.getElementById('vectorPages').style.setProperty('--preview-scale',String(scale));document.getElementById('preview').style.display='none'}const data=sessionStorage.getItem('nafsLessonPdf'),name=sessionStorage.getItem('nafsLessonPdfName')||'مسرد-الحصص.pdf',status=document.getElementById('status');let blob,url;if(data){const raw=atob(data.split(',')[1]),arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);blob=new Blob([arr],{type:'application/pdf'});url=URL.createObjectURL(blob);const pages=sessionStorage.getItem('nafsLessonPreviewPages');if(pages){try{JSON.parse(pages).forEach((src,i)=>{const img=document.createElement('img');img.className='page-preview';img.alt='صفحة المسرد '+(i+1);img.src=src;document.getElementById('preview').appendChild(img)})}catch(e){status.textContent='تعذرت معاينة الصفحات'}}else{const frame=document.createElement('iframe');frame.style.cssText='width:100%;height:65vh;border:0';frame.src=url+'#view=FitH';document.getElementById('preview').appendChild(frame)}}else if(!vector)status.textContent='لم يتم العثور على التقرير. ارجع وأنشئ المسرد من جديد.';document.getElementById('back').onclick=()=>location.href=sessionStorage.getItem('nafsLessonReturn')||'/nafs-lesson-log-owner-trial.html';async function loadPdfMake(){if(window.pdfMake)return;throw Error('مكتبة PDF المحلية غير منشورة بعد؛ تحقق من اكتمال مهمة GitHub Actions')}let pdfTask=null;async function ensureTextPdf(){if(blob)return blob;if(pdfTask)return pdfTask;pdfTask=(async()=>{if(!vector)throw Error('بيانات المسرد غير موجودة');await loadPdfMake();const fontUrl=location.origin+'/vendor/nafs-pdf/Amiri-Regular.ttf';pdfMake.fonts={Amiri:{normal:fontUrl,bold:fontUrl,italics:fontUrl,bolditalics:fontUrl}};const root=document.getElementById('vectorPages');const pages=[...root.querySelectorAll('.sheet')];const doc={pageSize:'A4',pageOrientation:'landscape',pageMargins:[13,13,13,13],defaultStyle:{font:'Amiri',fontSize:7,alignment:'right',color:'#252b3a'},content:[]};pages.forEach((page,pi)=>{const title=page.querySelector('h1')?.textContent||'مسرد الحصص الدراسية';const info=[...page.querySelectorAll('.info-card')].map(c=>({text:c.innerText.replace(/\\n/g,' — '),alignment:'center',fontSize:7,border:[true,true,true,true],fillColor:'#f3f0ff',margin:[2,3,2,3]}));doc.content.push({text:title,bold:true,fontSize:15,color:'#513b9b',margin:[0,0,0,5],alignment:'right',pageBreak:pi?'before':undefined});doc.content.push({table:{widths:Array(info.length).fill('*'),body:[info]},layout:'lightHorizontalLines',margin:[0,0,0,7]});const weeks=[...page.querySelectorAll('.week')];const cells=weeks.map(w=>{const head=w.querySelector('h2')?.textContent||'';const parts=[{text:head,color:'#513b9b',bold:true,fontSize:9,margin:[0,0,0,5]}];w.querySelectorAll('.lesson').forEach(l=>{parts.push({text:(l.querySelector('b')?.textContent||'')+'\n'+(l.querySelector('p')?.textContent||''),fontSize:7.2,margin:[0,2,0,2]})});return {table:{widths:['*'],body:parts.map((part,i)=>[{text:part.text,fontSize:part.fontSize,bold:!!part.bold,color:i===0?'#ffffff':'#252b3a',fillColor:i===0?'#5b45a8':'#f8f6ff',margin:[4,i===0?3:6,4,i===0?3:6],border:[true,true,true,true]}])},layout:{hLineWidth:()=>0.65,vLineWidth:()=>0.65,hLineColor:()=>'#c8bfe9',vLineColor:()=>'#c8bfe9'}}});for(let row=0;row<3;row++){doc.content.push({table:{widths:['*','*','*'],heights:145,body:[[cells[row*3]||'',cells[row*3+1]||'',cells[row*3+2]||'']]},layout:{hLineWidth:()=>.5,vLineWidth:()=>.5,hLineColor:()=>'#c8bfe9',vLineColor:()=>'#c8bfe9'},margin:[0,0,0,4]})}});return await new Promise((resolve,reject)=>{try{pdfMake.createPdf(doc).getBlob(resolve)}catch(e){reject(e)}})})();try{blob=await pdfTask;url=URL.createObjectURL(blob);return blob}catch(e){pdfTask=null;throw e}}async function sharePdf(saveMode){try{await ensureTextPdf()}catch(e){status.textContent='تعذر إنشاء PDF نصي: '+e.message;return}const file=new File([blob],name,{type:'application/pdf'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}if(saveMode){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();status.textContent='إذا لم يبدأ التنزيل، افتح PDF واختر حفظ في الملفات.'}else{status.textContent='المشاركة المباشرة غير متاحة في هذا المتصفح. افتح ملف PDF للمشاركة.';window.open(url,'_blank')}}document.getElementById('save').onclick=()=>sharePdf(true);document.getElementById('print').onclick=async()=>{const tab=window.open('','_blank');try{await ensureTextPdf();if(tab)tab.location.href=url;else status.textContent='اسمح بفتح نافذة PDF للطباعة.'}catch(e){if(tab)tab.close();status.textContent='تعذر فتح PDF للطباعة: '+e.message}};document.getElementById('share').onclick=()=>sharePdf(false);</script></body></html>

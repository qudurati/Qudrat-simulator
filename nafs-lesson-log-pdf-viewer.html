<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير مسرد الحصص — PDF</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f5;font-family:Tahoma,Arial;color:#172033}.bar{position:sticky;top:0;z-index:2;background:#fff;padding:7px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:center;box-shadow:0 1px 4px #0002}.bar h2{grid-column:1/-1;text-align:center;margin:2px 0 6px;font-size:17px}.bar button{width:100%;min-width:0;min-height:34px;border:0;border-radius:7px;padding:7px 2px;font:bold 11px Tahoma,Arial;white-space:nowrap;background:#eceef4;color:#30384d;cursor:pointer}.bar .print{background:#24594b;color:#fff}.bar .share{background:#5538c8;color:#fff}.stage{padding:12px;max-width:1150px;margin:auto}.page-preview{width:100%;aspect-ratio:2200/1556;background:#fff;box-shadow:0 2px 10px #0002;margin:0 0 14px;display:block;object-fit:contain}@media(min-width:800px){.bar{display:flex;justify-content:center}.bar h2{margin:0 15px;font-size:17px}.bar button{width:auto;min-width:115px;padding:8px 12px;font-size:12px}}</style></head><body><div class="bar"><h2>مسرد الحصص — PDF</h2><button id="back">رجوع</button><button class="print" id="print">طباعة PDF</button><button id="save">حفظ في الملفات</button><button class="share" id="share">مشاركة PDF</button></div><div class="stage"><div id="preview" aria-label="معاينة صفحتي المسرد"></div><p id="status"></p></div><script>const data=sessionStorage.getItem('nafsLessonPdf'),name=sessionStorage.getItem('nafsLessonPdfName')||'مسرد-الحصص.pdf',status=document.getElementById('status');let blob,url;if(data){const raw=atob(data.split(',')[1]),arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);blob=new Blob([arr],{type:'application/pdf'});url=URL.createObjectURL(blob);const pages=sessionStorage.getItem('nafsLessonPreviewPages');if(pages){try{JSON.parse(pages).forEach((src,i)=>{const img=document.createElement('img');img.className='page-preview';img.alt='صفحة المسرد '+(i+1);img.src=src;document.getElementById('preview').appendChild(img)})}catch(e){status.textContent='تعذرت معاينة الصفحات'}}else{const frame=document.createElement('iframe');frame.style.cssText='width:100%;height:65vh;border:0';frame.src=url+'#view=FitH';document.getElementById('preview').appendChild(frame)}}else status.textContent='لم يتم العثور على التقرير. ارجع وأنشئ المسرد من جديد.';document.getElementById('back').onclick=()=>location.href=sessionStorage.getItem('nafsLessonReturn')||'/nafs-lesson-log-owner-trial.html';document.getElementById('save').onclick=async()=>{if(!blob)return;const file=new File([blob],name,{type:'application/pdf'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:name});status.textContent='اختر «حفظ في الملفات» من قائمة المشاركة لحفظ PDF على الآيفون.';return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();status.textContent='إذا لم يبدأ الحفظ، افتح الملف من المتصفح واختر «حفظ في الملفات».'};document.getElementById('print').onclick=()=>{if(!url)return;const w=window.open(url,'_blank');if(!w)document.getElementById('preview').contentWindow?.print()};document.getElementById('share').onclick=async()=>{if(!blob)return;const file=new File([blob],name,{type:'application/pdf'});try{if(navigator.canShare?.({files:[file]})&&navigator.share)await navigator.share({files:[file],title:'مسرد الحصص'});else{status.textContent='المشاركة المباشرة غير مدعومة في هذا المتصفح. استخدم حفظ في الملفات ثم شارك الملف.'}}catch(e){if(e.name!=='AbortError')status.textContent='تعذرت المشاركة: '+e.message}};</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>عرض الخطة الفصلية</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef1f5;font-family:Tahoma,Arial}.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dfe3ea;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}.bar b{font-size:15px}.bar button{border:0;border-radius:9px;padding:9px 14px;background:#edf0f5;color:#344054;font:inherit;font-weight:700}.stage{padding:10px;display:grid;gap:12px;justify-items:center}.sheet{width:min(100%,1120px);aspect-ratio:297/210;background:#fff;box-shadow:0 2px 12px #0002;overflow:hidden}.sheet img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}.empty{padding:40px;text-align:center;color:#667085}@media(max-width:600px){.stage{padding:6px;gap:8px}.sheet{width:100%}}</style></head><body><div class="bar"><b>الخطة الفصلية — A4</b><button onclick="history.back()">رجوع</button></div><main id="stage" class="stage"></main><script>const stage=document.getElementById('stage');let pages=[];try{pages=JSON.parse(sessionStorage.getItem('nafsSemesterPreviewPages')||'[]')}catch(e){}if(!pages.length)stage.innerHTML='<div class="empty">انتهت المعاينة. ارجع وأنشئ التقرير مرة أخرى.</div>';else pages.forEach((src,i)=>{const s=document.createElement('div');s.className='sheet';const img=document.createElement('img');img.src=src;img.alt='صفحة '+(i+1);s.appendChild(img);stage.appendChild(s)});</script></body></html>

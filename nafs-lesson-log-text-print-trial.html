<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مسرد الحصص — طباعة نصية تجريبية</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0f5;font-family:Tahoma,Arial,sans-serif;color:#252b3a}.bar{position:sticky;top:0;background:white;padding:12px;display:flex;align-items:center;gap:10px;z-index:5;box-shadow:0 2px 8px #0002}.bar button{border:0;border-radius:8px;padding:11px 18px;font:inherit;background:#eee}.bar .print{background:#17634c;color:#fff}.stage{padding:12px;overflow:auto}.sheet{width:297mm;height:210mm;min-width:297mm;min-height:210mm;background:#fff;margin:0 auto 14px;padding:5mm 7mm 4mm;display:flex;flex-direction:column;break-after:page;page-break-after:always;box-shadow:0 2px 8px #0002}.sheet:last-child{break-after:auto}.heading{background:#f3f0ff;border:1px solid #d6cdf0;padding:2mm 3mm;margin-bottom:3mm}.heading h1{font-size:15px;color:#513b9b;margin:0 0 2mm}.info{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2mm}.info div{border:1px solid #d4cbea;background:#fff;text-align:center;padding:1mm;min-width:0}.info b{display:block;color:#5c419c;font-size:9px}.info span{font-weight:bold;font-size:10px;overflow-wrap:anywhere}.weeks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:3mm;flex:1;min-height:0}.week{border:1px solid #c8bfe9;background:#f8f6ff;display:flex;flex-direction:column;min-height:0;overflow:hidden}.week h2{background:#5b45a8;color:white;font-size:11px;padding:2mm;margin:0;flex:none}.lesson{padding:1.2mm 2mm;border-top:1px solid #ddd7ef;flex:1;min-height:0;overflow:hidden}.lesson b{display:block;color:#4b3994;font-size:9px;margin-bottom:1mm}.lesson p{font-size:9px;line-height:1.25;white-space:pre-line;margin:0;overflow-wrap:anywhere}.footer{text-align:left;font-size:9px;color:#6b7280;margin-top:1mm}@page{size:297mm 210mm;margin:0}@media print{html,body{width:297mm!important;min-width:297mm!important;height:auto!important;margin:0!important;padding:0!important}body{background:white}.bar{display:none}.stage{padding:0;overflow:visible}.sheet{width:297mm!important;height:210mm!important;min-width:297mm!important;min-height:210mm!important;max-width:297mm!important;margin:0!important;padding:5mm 7mm 4mm!important;box-shadow:none;break-inside:avoid;overflow:hidden}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}@media screen and (max-width:1150px){.stage{overflow-x:auto}.sheet{margin-left:0;margin-right:0}}
</style></head><body><div class="bar"><button onclick="history.back()">رجوع</button><button class="print" onclick="window.print()">طباعة / حفظ PDF نصي</button><span>تجربة المالك — دون صور</span></div><main class="stage" id="stage"></main><script>
const data=JSON.parse(sessionStorage.getItem('nafsLessonTextTrial')||'null');const stage=document.getElementById('stage');if(!data){stage.textContent='ارجع إلى مسرد المالك واضغط «طباعة نصية تجريبية».'}else{const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const info=[['المدرسة',data.school],['المعلمة',data.teacher],['مديرة المدرسة',data.principal],['الصف',data.grade],['المادة',data.subject],['العام الدراسي','1448هـ']];for(let page=0;page<2;page++){const section=document.createElement('section');section.className='sheet';section.innerHTML='<header class="heading"><h1>تدريب نافس — مسرد الحصص الدراسية</h1><div class="info">'+info.map(([k,v])=>'<div><b>'+escape(k)+'</b><span>'+escape(v||'................')+'</span></div>').join('')+'</div></header><div class="weeks">'+data.weeks.slice(page*9,page*9+9).map((w,i)=>'<article class="week"><h2>الأسبوع '+(page*9+i+1)+' — '+escape(w.date)+'</h2>'+w.lessons.map(l=>'<div class="lesson"><b>'+escape(l.day)+' — الحصة '+escape(l.period)+'</b><p>'+escape(l.skill)+(l.notes?'\n'+escape(l.notes):'')+'</p></div>').join('')+'</article>').join('')+'</div><div class="footer">تدريب نافس — مسرد الحصص</div>';stage.appendChild(section)}} 
</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الفصلية | نافس</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Tahoma,Arial}.wrap{max-width:980px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:22px}h1{margin:0 0 18px;color:#167783}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}select,input{width:100%;padding:12px;border:1px solid #d4dbe5;border-radius:10px;background:#fff;font:inherit}.actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 17px;background:#167783;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.back{background:#edf0f5;color:#344054}.preview{margin-top:20px;overflow:auto;background:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #aeb8bd;padding:9px;text-align:center;vertical-align:middle;line-height:1.55}th{background:#177985;color:#fff}.wk{font-weight:800;color:#177985;width:70px}.date{width:150px;font-weight:700}.note{color:#87572e}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><div class="form"><h1>الخطة الفصلية لتطبيق تدريبات نافس</h1><div class="grid"><div class="full"><label>اسم المدرسة</label><input id="school"></div><div><label>الصف</label><select id="grade" onchange="loadSubjects()"><option value="g3">الصف الثالث الابتدائي</option><option value="g6">الصف السادس الابتدائي</option><option value="g9">الصف الثالث المتوسط</option></select></div><div><label>المادة</label><select id="subject" onchange="build()"></select></div><div><label>الفصل</label><input id="term" value="الثالث أ/ب"></div><div><label>العام الدراسي</label><input id="year" value="1448هـ"></div></div><div class="actions"><button class="btn" id="pdfBtn" onclick="exportPDF()">تنزيل PDF</button><button class="btn" onclick="build()">تحديث التقرير</button><a class="btn back" href="nafs.html">رجوع</a></div></div><div class="preview" id="report"><div id="heading"></div><table><thead><tr><th>الأسبوع</th><th>التاريخ (هـ)</th><th>محتوى التطبيق</th><th>ملاحظات</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="nafs-ms-data.js"></script><script src="nafs-corrections-2026.js?v=1"></script><script src="nafs-reading-data.js"></script><script>const $=x=>document.getElementById(x);const dates=['١٢–١٧ ربيع الأول','٢٤–٢٨ ربيع الأول','٢–٦ ربيع الآخر','٩–١١ ربيع الآخر','١٦–٢١ ربيع الآخر','٢٣–٢٧ ربيع الآخر','٣٠ ربيع الآخر – ٤ جمادى الأولى','٧–١١ جمادى الأولى','١٤–١٨ جمادى الأولى','٢١–٢٥ جمادى الأولى','٢٨ جمادى الأولى – ٢ جمادى الآخرة','٥–٩ جمادى الآخرة','١٩–٢٣ جمادى الآخرة','٢٦ جمادى الآخرة – ١ رجب','٤–٨ رجب','١١–١٥ رجب','١٨–٢٣ رجب','٢٥–٢٩ رجب'];function data(s,g){return s==='reading'?(window.NAFS_READING?.[g]||[]):(window.NAFS_MS?.[s]?.[g]||[])}function subjects(){const g=$('grade').value,a=[];if(data('reading',g).length)a.push(['reading','لغتي / القراءة']);if(data('math',g).length)a.push(['math','الرياضيات']);if(data('science',g).length)a.push(['science','العلوم الطبيعية']);return a}function loadSubjects(){$('subject').innerHTML=subjects().map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');build()}function skills(){const a=data($('subject').value,$('grade').value),out=[];a.forEach(r=>(r[2]||[]).forEach(x=>{x=String(x||'').trim();if(x&&!out.includes(x))out.push(x)}));return out}function noteFor(s){const subj=$('subject').value;if(subj==='reading')return /مفرد|معن|مرادف|مضاد/.test(s)?'تدريب الطلاب على معاني المفردات ومرادفاتها وأضدادها':'تطبيق المهارة على نصوص متنوعة مع الاستدلال والتبرير';if(subj==='math')return'تدريب متدرج وتطبيق المهارة في مسائل ومواقف جديدة';return'تطبيق المهارة في مواقف علمية واستقصائية وربطها بالأدلة'}function build(){const sk=skills();const body=$('rows');const subject=$('subject').selectedOptions[0]?.text||'';$('heading').innerHTML=`<div style="text-align:center;margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-weight:700"><span>${$('school').value||'اسم المدرسة'}</span><span>العام الدراسي ${$('year').value}</span></div><h2 style="margin:8px 0;color:#176f78">خطة التطبيق — تدريبات نافس</h2><h3 style="margin:5px">الخطة الزمنية الفصلية لتطبيق تدريبات نافس — مادة ${subject}</h3><div style="display:flex;justify-content:space-between"><b>الصف: ${$('grade').selectedOptions[0]?.text||''}</b><b>الفصل: ${$('term').value}</b><b>المادة: ${subject}</b></div></div>`;let html='';for(let i=0;i<18;i++){let content,note;if(i===0){content='تطبيق الاختبار التشخيصي لنواتج التعلم وتحليل نتائجه لترتيب أولويات المعالجة';note='إعداد الطلاب والتعريف بنمط الاختبار والاستعداد لتطبيقه'}else if(i===2||i===3||i===17){content='مراجعة عامة وسد الفجوات في ضوء نتائج التدريب';note=i===17?'مراجعة ختامية وقياس مستوى التحسن':'تعزيز المهارات التي تحتاج إلى دعم إضافي'}else if(i===15){content='تطبيق الاختبار النهائي ومعالجة الفاقد التعليمي في ضوء نتائجه';note='تحليل النتائج وتحديد المهارات التي تحتاج إلى تعزيز ومعالجة'}else{const s=sk[(i-1)%Math.max(sk.length,1)]||'تدريب على نواتج التعلم المستهدفة';content='التدريب على المهارة: '+s;note=noteFor(s)}html+=`<tr><td class="wk">${i+1}</td><td class="date">${dates[i]}</td><td>${content}</td><td class="note">${note}</td></tr>`}body.innerHTML=html}function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}async function exportPDF(){const b=$('pdfBtn');try{b.disabled=true;b.textContent='جاري إنشاء PDF...';build();if(!window.html2canvas)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await document.fonts?.ready;const source=$('report'),clone=source.cloneNode(true),host=document.createElement('div');host.style.cssText='position:absolute;left:-12000px;top:0;width:1120px;background:#fff;padding:22px;direction:rtl;font-family:Tahoma,Arial';clone.style.cssText='margin:0;overflow:visible;background:#fff';clone.querySelector('table').style.fontSize='15px';host.appendChild(clone);document.body.appendChild(host);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const canvas=await html2canvas(host,{scale:1.5,useCORS:true,backgroundColor:'#ffffff',logging:false,width:1164,windowWidth:1164});const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true}),img=canvas.toDataURL('image/jpeg',.93),pw=297,ph=210,margin=5,usableW=pw-margin*2,imgH=canvas.height*usableW/canvas.width,pageH=ph-margin*2;let y=0;while(y<imgH){if(y>0)pdf.addPage('a4','landscape');pdf.addImage(img,'JPEG',margin,margin-y,usableW,imgH,undefined,'FAST');y+=pageH}pdf.save('خطة-نافس-الفصلية.pdf');host.remove()}catch(e){console.error(e);alert('تعذر إنشاء ملف PDF. أعد المحاولة بعد تحديث الصفحة.')}finally{b.disabled=false;b.textContent='تنزيل PDF'}}loadSubjects();</script></body></html>

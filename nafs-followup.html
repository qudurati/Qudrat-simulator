<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة نافس | أنجز</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e8ef;border-radius:20px;padding:24px}.title{text-align:center}.sub{text-align:center;color:#687386}.report{text-align:center;color:#5538c8;font-weight:800}.fields{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:12px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;border:1px solid #d9deea;border-radius:11px;padding:12px;font:inherit}.checkHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}.checkHead h3{margin:0}.checks{display:grid;gap:10px;margin-top:10px}.check{display:flex;gap:10px;border:1px solid #e3e6ee;border-radius:12px;padding:13px;font-weight:700}.check input{width:20px;height:20px;accent-color:#5b3fd6}.actions{text-align:center;margin-top:22px}.btn{border:0;border-radius:11px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;background:#5b3fd6;color:#fff}.small{padding:9px 14px;background:#eeeafd;color:#5538c8}.msg{text-align:center;margin-top:15px;font-weight:800}.ok{color:#17803d}.err{color:#b42318}@media(max-width:700px){.fields{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1 class="title">متابعة تدريب الطالبات على مهارات نافس</h1><p class="sub" id="schoolName">جاري التحقق من رابط التقرير...</p><p class="report" id="reportTitle"></p><div class="fields"><div class="field"><label>اسم المعلمة</label><input id="teacher"></div><div class="field"><label>الحصة</label><input id="period"></div><div class="field"><label>تاريخ الحصة</label><input id="date" type="date"></div></div><div class="checkHead"><h3>بنود المتابعة</h3><button id="allBtn" class="btn small" type="button" onclick="toggleAll()">تحديد الكل</button></div><div class="checks" id="checks"><label class="check"><input type="checkbox">اختيار التدريبات من بنوك نافس</label><label class="check"><input type="checkbox">استهداف مهارات التفكير العليا</label><label class="check"><input type="checkbox">تدريب الطالبات على مفاتيح الحل وتقديم تغذية راجعة</label><label class="check"><input type="checkbox">تشخيص الطالبات حسب النموذج المرفق سابقًا</label></div><div class="actions"><button id="sendBtn" class="btn" onclick="send()">إرسال المتابعة</button></div><div id="msg" class="msg"></div></div></div><script>const API='https://cixwjisioawswnnwwswf.supabase.co/functions/v1/nafs-api',report=new URLSearchParams(location.search).get('report');async function api(b){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok||d.error)throw Error(d.error||'تعذر الاتصال');return d}async function init(){if(!report){invalid('رابط التقرير غير صالح');return}try{let d=await api({action:'teacher_report',report});schoolName.textContent=d.school_name;reportTitle.textContent=d.title}catch(e){invalid('هذا التقرير مغلق أو الرابط غير صالح')}}function invalid(t){msg.className='msg err';msg.textContent=t;sendBtn.disabled=true;document.querySelectorAll('input').forEach(i=>i.disabled=true);allBtn.disabled=true}function toggleAll(){let x=[...document.querySelectorAll('#checks input')],on=!x.every(i=>i.checked);x.forEach(i=>i.checked=on);allBtn.textContent=on?'إلغاء تحديد الكل':'تحديد الكل'}async function send(){let x=[...document.querySelectorAll('#checks input')],entry={teacher_name:teacher.value.trim(),period:period.value.trim(),lesson_date:date.value,item_bank:x[0].checked,item_hots:x[1].checked,item_keys_feedback:x[2].checked,item_diagnosis:x[3].checked};if(!entry.teacher_name||!entry.period||!entry.lesson_date){msg.className='msg err';msg.textContent='أكملي جميع البيانات';return}sendBtn.disabled=true;sendBtn.textContent='جارٍ الإرسال...';try{await api({action:'save_report_entry',report,entry});msg.className='msg ok';msg.textContent='✓ تم حفظ المتابعة في التقرير بنجاح';period.value='';date.value='';x.forEach(i=>i.checked=false);allBtn.textContent='تحديد الكل'}catch(e){msg.className='msg err';msg.textContent='تعذر الحفظ؛ قد يكون التقرير أُغلق';}finally{sendBtn.disabled=false;sendBtn.textContent='إرسال المتابعة'}}init();</script></body></html>

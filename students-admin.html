<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>اشتراكات الطلاب | محاكي القدرات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#10254a}.wrap{max-width:1280px;margin:30px auto;padding:16px}.head,.card{background:#fff;border:1px solid #d8e0ea;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px rgba(30,70,120,.04)}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{margin:0 0 5px}.studentCount{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:7px 11px;border-radius:999px;background:#eef5ff;color:#173866;font-weight:800;font-size:14px}.studentCount b{font-size:17px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;background:#173866;color:#fff;text-decoration:none;font-weight:800;cursor:pointer;transition:.15s}.btn:active{transform:scale(.98)}.btn.light{background:#eaf0f7;color:#173866}.btn.danger{background:#fff0f0;color:#b42318;border:1px solid #ffd5d2}.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.phoneInput{width:145px!important;min-width:145px}.tableWrap{overflow:auto}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1120px}th,td{text-align:right;padding:12px 10px;border-bottom:1px solid #e8edf3;vertical-align:middle}th{background:#f8fafc;color:#52657d;font-size:13px}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:850}.active{background:#dcfce7;color:#166534}.free,.expired,.cancelled{background:#f1f5f9;color:#475569}.rowBtns{display:grid;grid-template-columns:repeat(2,minmax(96px,1fr));gap:7px;min-width:215px}.rowBtns .btn{padding:9px 8px;font-size:12px;white-space:nowrap;box-shadow:none}.rowBtns .btn[data-plan="basic"]{background:#eaf8f0;color:#137348;border:1px solid #c8ead7}.rowBtns .btn[data-plan="advanced"]{background:#eaf3ff;color:#1769c2;border:1px solid #cbdfff}.rowBtns .btn[data-plan="pro"]{background:#fff5df;color:#95630c;border:1px solid #f0ddb0}.rowBtns .danger{background:#fff0f0;color:#b42318;border:1px solid #ffd5d2}.rowBtns .printOne{grid-column:1/-1;background:#173866;color:#fff;border:1px solid #173866}.msg{padding:12px;border-radius:8px;background:#fff7ed;color:#9a3412}.empty{text-align:center;color:#667085;padding:30px}.reportTitle{display:none}@media(max-width:700px){.wrap{margin:0;padding:10px}.head,.card{border-radius:14px;padding:14px}.head{align-items:flex-start;flex-direction:column}.head h1{font-size:22px}.actions{width:100%}.actions .btn{flex:1;text-align:center}.toolbar{display:grid;grid-template-columns:1fr auto auto}.toolbar input{min-width:0;width:100%}.tableWrap{overflow:visible}table{min-width:0;display:block}thead{display:none}tbody{display:grid;gap:12px}tr{display:block;background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:14px;box-shadow:0 4px 14px rgba(30,70,120,.04)}td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #edf1f5;text-align:left}td:last-child{border-bottom:0;display:block}td::before{font-weight:800;color:#718096;font-size:12px}td:nth-child(1)::before{content:'الطالب'}td:nth-child(2)::before{content:'الجوال'}td:nth-child(3)::before{content:'البريد'}td:nth-child(4)::before{content:'الحالة'}td:nth-child(5)::before{content:'الباقة'}td:nth-child(6)::before{content:'الانتهاء'}td:nth-child(7)::before{content:'أول انتفاع'}td:nth-child(8)::before{content:'إدارة الاشتراك';display:block;text-align:right;margin-
